          audioPacketsLost = report.packetsLost;
          audioPacketsReceived = report.packetsReceived;
        }
        if (report.type === 'candidate-pair' && report.state === 'succeeded' && (report.nominated || report.selected)) {
          pairLocalCandId = report.localCandidateId;
        }
      });
      let candidateType = diagCandidateType;
      if (pairLocalCandId) {
        const localCand = stats.get(pairLocalCandId);
        if (localCand && localCand.candidateType) candidateType = localCand.candidateType; // host/srflx/relay/prflx
      }

      const now = performance.now();
      let kbpsUp = null, kbpsDown = null, audioKbpsUp = null, audioKbpsDown = null;
      const dt = diagPrevBytes.time ? (now - diagPrevBytes.time) / 1000 : 0;
      if (dt > 0 && bytesSent != null) kbpsUp = Math.max(0, Math.round(((bytesSent - diagPrevBytes.sent) * 8) / dt / 1000));
      if (dt > 0 && bytesReceived != null) kbpsDown = Math.max(0, Math.round(((bytesReceived - diagPrevBytes.received) * 8) / dt / 1000));
      if (dt > 0 && audioBytesSent != null) audioKbpsUp = Math.max(0, Math.round(((audioBytesSent - diagPrevBytes.audioSent) * 8) / dt / 1000));
      if (dt > 0 && audioBytesReceived != null) audioKbpsDown = Math.max(0, Math.round(((audioBytesReceived - diagPrevBytes.audioReceived) * 8) / dt / 1000));
      const audioLossPct = (audioPacketsLost != null && audioPacketsReceived != null && (audioPacketsLost + audioPacketsReceived) > 0)
        ? Math.round((audioPacketsLost / (audioPacketsLost + audioPacketsReceived)) * 1000) / 10
        : null;
      diagPrevBytes = {
        sent: bytesSent || 0, received: bytesReceived || 0,
        audioSent: audioBytesSent || 0, audioReceived: audioBytesReceived || 0,
        time: now
      };

      if (kbpsUp != null && kbpsDown != null) {
        diagBitrateSamples.push({ up: kbpsUp, down: kbpsDown, audioUp: audioKbpsUp, audioDown: audioKbpsDown, audioLossPct });
        if (diagBitrateSamples.length > 400) diagBitrateSamples.shift();
      }

      if (candidateType && candidateType !== diagCandidateType) {
        diagCandidateType = candidateType;
        if (!lowBandwidthMode) {
          diagApplyBitrateCap(candidateType === 'relay' ? DIAG_BITRATE_RELAY : DIAG_BITRATE_FULL);
        }
      }

      const vSender = pcRef.getSenders().find((s) => s.track && s.track.kind === 'video');
      const vReceiver = pcRef.getReceivers().find((r) => r.track && r.track.kind === 'video');
      const sentSettings = (vSender && vSender.track) ? vSender.track.getSettings() : {};
      const recvSettings = (vReceiver && vReceiver.track) ? vReceiver.track.getSettings() : {};

      localStorage.setItem(DIAG_LS_LIVE, JSON.stringify({
        timestamp: Date.now(),
        connectionState: pcRef.connectionState,
        candidateType: diagCandidateType,
        bitrateUpKbps: kbpsUp,
        bitrateDownKbps: kbpsDown,
        audioBitrateUpKbps: audioKbpsUp,
        audioBitrateDownKbps: audioKbpsDown,
        audioPacketLossPct: audioLossPct,
        resolutionSent: sentSettings.width ? (sentSettings.width + 'x' + sentSettings.height) : null,
        resolutionReceived: recvSettings.width ? (recvSettings.width + 'x' + recvSettings.height) : null,
        reconnectCount: diagReconnectCount,
        bandwidthMode: lowBandwidthMode ? 'low' : 'auto'
      }));
    } catch (e) { /* never let a diagnostics failure affect the call */ }
  }

  function diagAttachToPc(pcRef) {
    if (!diagSessionStart) diagSessionStart = Date.now();
    diagPrevBytes = { sent: 0, received: 0, time: performance.now() };
    if (lowBandwidthMode) diagApplyBandwidthMode();
    const diagHandleStateChange = () => {
      if (pcRef.connectionState === 'disconnected' || pcRef.connectionState === 'failed') {
        diagReconnectCount++;
      }
      if (pcRef.connectionState === 'connected' && !diagPollTimer) {
        diagPollTimer = setInterval(() => diagPollStats(pcRef), DIAG_POLL_MS);
      }
    };
    pcRef.addEventListener('connectionstatechange', diagHandleStateChange);
    // Covers the case where the call already reached "connected" in the
    // moment between pc being created and this watcher noticing it (the
    // watcher only checks once per second) — without this, a fast-connecting
    // call (e.g. two tabs on the same network) could skip logging entirely.
    diagHandleStateChange();
  }

  // Rather than touch createPeerConnection()/teardownPeerConnection(), this
  // just watches the existing `pc` variable from the outside and reacts
  // when it appears or disappears.
  setInterval(() => {
    if (pc && pc !== diagLastPc) {
      diagLastPc = pc;
      diagAttachToPc(pc);
    } else if (!pc && diagLastPc) {
      diagLastPc = null;
      if (diagPollTimer) { clearInterval(diagPollTimer); diagPollTimer = null; }
      diagFinalizeSession();
    }
  }, 1000);
  // ===== DIAGNOSTICS MODULE END =======================================

  // ===== SELF-VIEW POPOUT MODULE ========================================
  // Opens your own camera feed in a separate browser window so you can see
  // yourself the way Maria does — large, and unmirrored (the small preview
  // on video#local is flipped via CSS for comfort, but the real feed sent
  // over WebRTC, and the one shown in this popped-out window, is not; the
  // popout has no stylesheet of its own so no flip is ever applied).
  //
  // Opens as a plain window near the main screen; drag/resize it onto the
  // second monitor manually. No automatic screen-placement logic — kept
  // deliberately simple.
  //
  // Delete this whole block plus the matching HTML block in the footer to
  // remove the feature entirely; nothing else in the app depends on it.
  const popoutBtn = document.getElementById('popoutBtn');
  let popoutWindow = null;
  let popoutVideoEl = null;

  function popoutUpdateStream() {
    if (!popoutVideoEl) return;
    try { popoutVideoEl.srcObject = localStream; } catch (e) {}
  }

  // PIP-TEST BUILD: Document Picture-in-Picture first (Design B), window.open fallback.
  // Detection loop reads on-page #local; we do NOT move it. A separate lightweight
  // <video> goes into the PiP surface on the same localStream, so detection is
  // untouched; the only variable under test is PiP surface vs window.open decode.
  const PIP_BADGE_OK_MS = 10000;     // success clears soon so it stops covering the Pop Out button
  const PIP_BADGE_FAIL_MS = 60000;   // failures stay up longer so they can be read
  let pipBadgeTimer = null;

  function pipSetBadge(text, ok) {
    let b = document.getElementById('pipPathBadge');
    if (!b) {
      b = document.createElement('div');
      b.id = 'pipPathBadge';
      b.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:100000;' +
        'font:12px/1.4 monospace;padding:5px 9px;border-radius:6px;' +
        'background:#111;border:1px solid #333;color:#fff;pointer-events:none;';
      document.body.appendChild(b);
    }
    b.textContent = 'popout path: ' + text;
    b.style.borderColor = ok ? '#2e9e5b' : '#a55';
    b.style.color = ok ? '#dff5e7' : '#f4d0d0';
    b.style.display = '';
    clearTimeout(pipBadgeTimer);
    pipBadgeTimer = setTimeout(() => { b.style.display = 'none'; }, ok ? PIP_BADGE_OK_MS : PIP_BADGE_FAIL_MS);
  }

  function pipBuildVideoIn(doc) {
    doc.title = 'My View';
    const style = doc.createElement('style');
    style.textContent = 'html,body{margin:0;padding:0;height:100%;background:#000;}' +
      'video{width:100%;height:100%;object-fit:contain;background:#000;display:block;}';
    doc.head.appendChild(style);
    const video = doc.createElement('video');
    video.id = 'popoutVideo';
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;
    doc.body.appendChild(video);
    popoutVideoEl = video;
    popoutUpdateStream();
    paceClockBuildIn(doc, video);
  }

  // SECOND-SCREEN TEST BUILD: when Chromium's Window Management API is allowed
  // and a screen other than this window's own exists (the Roku TV), open the
  // popout filling that screen instead of an 800x600 window. Document PiP
  // windows cannot be placed or sized, so this path uses window.open. If
  // anything here fails, the original behaviour below runs unchanged.
  // First use shows a one-time "manage windows on all your displays" prompt;
  // after Allow, click Pop Out a second time (the prompt uses up the click).
  async function popoutFindOtherScreen() {
    if (!('getScreenDetails' in window)) return { screen: null, askedNow: false };
    let askedNow = false;
    try {
      const st = await navigator.permissions.query({ name: 'window-management' });
      askedNow = (st.state === 'prompt');
    } catch (e) {}
    try {
      const d = await window.getScreenDetails();
      const cur = d.currentScreen;
      const other = d.screens.find(s => s.left !== cur.left || s.top !== cur.top) || null;
      return { screen: other, askedNow };
    } catch (e) {
      return { screen: null, askedNow: false };
    }
  }

  function popoutAddFullscreen(w, scr) {
    const d = w.document;
    // The attempt made as the popout opens has no gesture in the popup, so its
    // refusal is expected: it is logged but does not put a failure on the badge.
    let opening = true;
    const fsFailed = (what, e, auto) => {
      const name = (e && e.name) || 'err';
      afdiag('POPOUT FULLSCREEN ' + what + ' failed' + (auto ? ' (attempt at open)' : '') + ': ' + name);
      if (!auto) pipSetBadge('fullscreen ' + what + ' failed: ' + name, false);
    };
    const toggle = () => {
      const auto = opening;
      if (d.fullscreenElement) { d.exitFullscreen().catch((e) => { fsFailed('exit', e, auto); }); return; }
      const el = d.documentElement;
      el.requestFullscreen({ screen: scr }).catch((e) => {
        afdiag('POPOUT FULLSCREEN request on screen refused: ' + ((e && e.name) || 'err') + ' - retrying without screen');
        el.requestFullscreen().catch((e2) => { fsFailed('request', e2, auto); });
      });
    };
    d.addEventListener('fullscreenchange', () => {
      afdiag('POPOUT FULLSCREEN ' + (d.fullscreenElement ? 'entered' : 'exited'));
    });
    d.addEventListener('click', toggle);
    d.addEventListener('keydown', (e) => { if (e.key === 'f' || e.key === 'F') toggle(); });
    try { toggle(); } catch (e) {}   // may be refused without a click in the popup
    opening = false;
  }

  async function openSelfViewPopout() {
    if (popoutWindow && !popoutWindow.closed) {
      popoutWindow.focus();
      return;
    }
    if (window.documentPictureInPicture && documentPictureInPicture.window) {
      try { documentPictureInPicture.window.focus(); } catch (e) {}
      return;
    }

    const found = await popoutFindOtherScreen();
    if (found.askedNow) {
      pipSetBadge('second-screen permission asked - click Pop Out again', false);
      return;
    }
    if (found.screen) {
      const sc = found.screen;
      const feat = 'popup=yes,left=' + sc.availLeft + ',top=' + sc.availTop +
        ',width=' + sc.availWidth + ',height=' + sc.availHeight;
      const w = window.open('', 'selfViewPopout', feat);
      if (w) {
        popoutWindow = w;
        pipBuildVideoIn(w.document);
        popoutAddFullscreen(w, sc);
        w.addEventListener('pagehide', () => { popoutVideoEl = null; });
        pipSetBadge('window.open on other screen ' + sc.width + 'x' + sc.height +
          ' (click or F in popout = fullscreen)', true);
        return;
      }
    }

    if ('documentPictureInPicture' in window) {
      try {
        const pipWin = await documentPictureInPicture.requestWindow({
          width: 800, height: 600
        });
        pipBuildVideoIn(pipWin.document);
        pipWin.addEventListener('pagehide', () => { popoutVideoEl = null; });
        pipSetBadge('documentPictureInPicture', true);
        return;
      } catch (e) {
        pipSetBadge('DPiP failed -> window.open (' + (e && e.name || 'err') + ')', false);
      }
    }

    popoutWindow = window.open('', 'selfViewPopout', 'width=800,height=600');
    if (!popoutWindow) { pipSetBadge('popup blocked', false); return; }
    pipBuildVideoIn(popoutWindow.document);
    const bd = document.getElementById('pipPathBadge');
    if (!bd || bd.textContent.indexOf('DPiP failed') === -1) {
      pipSetBadge('window.open (legacy)', false);
    }
  }

  if (popoutBtn) {
    popoutBtn.addEventListener('click', () => { openSelfViewPopout(); });
  }
  // Everything in the popout (stream, clock, timers) is driven from this page,
  // so it must not outlive it: close it when this page closes, reloads or
  // navigates away, on both roles.
  window.addEventListener('pagehide', () => {
    try { if (popoutWindow && !popoutWindow.closed) popoutWindow.close(); } catch (e) {}
    try {
      if (window.documentPictureInPicture && documentPictureInPicture.window) documentPictureInPicture.window.close();
    } catch (e) {}
  });
  // ===== VOICE COMMAND MODULE ============================================
  // Offline spoken commands through Vosk, built around a registry: each entry
  // is {phrase, action}, the decoder grammar is generated from the registry,
  // and a FINAL result runs the one entry whose words it contains. Other
  // modules add their phrases with window.__VOICECMD__.register(); the timer
  // registers "<word> start/stop/reset" in the STOPWATCH MODULE below
  // (word from ?voiceword=, default "timer").
  // Role-independent code. Listens on the gym role (?inv=door) unless the URL
  // has ?voicecmd=0, and on any role with ?voicecmd=1; the trainer link has
  // neither, so the trainer never listens. When off, start() refuses and
  // nothing is loaded, no mic is opened, no UI is added.
  // Never runs beside the KINESIS voice (one Vosk model, one mic at a time):
  // start() refuses while KINESIS voice is on, and pressing the KINESIS voice
  // button stops this module first. Lib and model paths are the same as
  // KINESIS uses (vendor/vosk/, overridable with ?voskLib= / ?voskModel=).
  // Delete this block to remove the feature; the timer's register() calls
  // are guarded and do nothing without it.

  // ----- VOICECMD PURE START (test/stopwatch-page.test.js extracts this part) -----
  function voiceCmdWords(text) {
    return String(text == null ? '' : text).toLowerCase().replace(/[^a-z0-9' ]/g, ' ').split(' ').filter(Boolean);
  }

  // A phrase is lowercase words separated by single spaces.
  function voiceCmdPhrase(raw) {
    const words = voiceCmdWords(raw);
    return words.length ? words.join(' ') : null;
  }

  function voiceCmdGrammar(phrases) {
    return JSON.stringify(phrases.concat(['[unk]']));
  }

  // True for a result with no words, or only [unk] words.
  function voiceCmdAllUnk(text) {
    const words = String(text == null ? '' : text).split(/\s+/).filter(Boolean);
    return words.every((w) => w === '[unk]');
  }

  // Listening is on for ?voicecmd=1 on any role, and by default for the gym
  // role (?inv=door, set by the gym launcher); ?voicecmd=0 turns it off.
  function voiceCmdEnabled(param, gymRole) {
    return param === '1' || (param !== '0' && gymRole);
  }

  // The registered phrase whose words all appear in the result, or null when
  // none does. When several do, the longest wins if its words include every
  // other hit's words ("set start squats" over "set start"); otherwise it is
  // ambiguous and nothing runs (e.g. "timer start stop").
  function voiceCmdMatch(phrases, text) {
    const heard = voiceCmdWords(text);
    const hits = phrases.filter((p) => p.split(' ').every((w) => heard.includes(w)));
    if (hits.length <= 1) return hits[0] || null;
    const best = hits.reduce((a, b) => (b.split(' ').length > a.split(' ').length ? b : a));
    const words = best.split(' ');
    return hits.every((h) => h.split(' ').every((w) => words.includes(w))) ? best : null;
  }
  // ----- VOICECMD PURE END ----------------------------------------------------

  const VOICECMD_ON = voiceCmdEnabled(params.get('voicecmd'), AF_FORCE_MODE);
  const VOICECMD_AUTO = VOICECMD_ON && params.get('voicecmd') !== '1';   // on because of the gym role
  const VOICECMD_LIB_URL = params.get('voskLib') || 'vendor/vosk/vosk.js';
  const VOICECMD_MODEL_URL = params.get('voskModel') || 'vendor/vosk/vosk-model-small-en-us-0.15.tar.gz';
  const VOICECMD_REFIRE_MS = 1200;
  const voiceCmd = {
    entries: new Map(),     // phrase -> action
    listeners: [],          // given every final result's text, never matched (POSEREC set naming)
    on: false, loading: false, status: 'off', lastFire: 0, statusEl: null, note: '',
    gen: 0,                 // bumped by every stop, so a start still loading knows it was cancelled
    model: null, rec: null, ctx: null, mic: null, src: null, proc: null
  };

  function voiceCmdSetStatus(s) {
    voiceCmd.status = s;
    if (voiceCmd.statusEl) voiceCmd.statusEl.textContent = 'voice: ' + s + (voiceCmd.note ? ' · ' + voiceCmd.note : '');
  }

  // Extra text after the status; POSEREC shows the open set here.
  function voiceCmdNote(text) {
    voiceCmd.note = String(text || '');
    voiceCmdSetStatus(voiceCmd.status);
  }

  // KINESIS keeps its voice state private; its panel shows it. Anything but
  // "off" or an error there means it is loading or listening.
  function voiceCmdKinesisBusy() {
    const el = document.getElementById('knVstat');
    if (!el) return false;
    const t = el.textContent || '';
    return t !== 'off' && t.indexOf('err') !== 0;
  }

  function voiceCmdLoadLib() {
    if (window.Vosk) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = VOICECMD_LIB_URL;
      sc.async = true;
      sc.onload = () => resolve();
      sc.onerror = () => reject(new Error('script load failed: ' + VOICECMD_LIB_URL));
      document.head.appendChild(sc);
    });
  }

  function voiceCmdResult(msg) {
    const text = (msg && msg.result && msg.result.text) || '';
    if (voiceCmdAllUnk(text)) return;
    afdiag('VOICE result text=' + text);
    voiceCmd.listeners.forEach((fn) => { try { fn(text); } catch (e) {} });
    const hit = voiceCmdMatch([...voiceCmd.entries.keys()], text);
    if (!hit) return;
    const now = Date.now();
    if (now - voiceCmd.lastFire < VOICECMD_REFIRE_MS) return;
    voiceCmd.lastFire = now;
    afdiag('VOICE hit=' + hit);
    try { voiceCmd.entries.get(hit)(); } catch (e) { afdiag('VOICE action failed for ' + hit + ': ' + (e && e.message)); }
  }

  // Creates the recognizer for the current registry, replacing any old one.
  function voiceCmdRecognizer() {
    if (!voiceCmd.model || !voiceCmd.ctx) return;
    const old = voiceCmd.rec;
    const rec = new voiceCmd.model.KaldiRecognizer(voiceCmd.ctx.sampleRate,
      voiceCmdGrammar([...voiceCmd.entries.keys()]));
    rec.on('result', voiceCmdResult);
    voiceCmd.rec = rec;
    try { if (old) old.remove(); } catch (e) {}
  }

  function voiceCmdResume(why) {
    const ctx = voiceCmd.ctx;
    if (!ctx) return;
    const log = () => { try { afdiag('VOICE audioctx=' + ctx.state + ' (' + why + ')'); } catch (e) {} };
    try { ctx.resume().then(log, log); } catch (e) { log(); }
  }

  async function voiceCmdStart() {
    if (voiceCmd.on || voiceCmd.loading) return false;
    if (!VOICECMD_ON) { afdiag('VOICE start refused: voice commands are off on this page (gym role or ?voicecmd=1 turns them on)'); return false; }
    if (voiceCmdKinesisBusy()) {
      voiceCmdSetStatus('off (KINESIS voice is on)');
      afdiag('VOICE start refused: KINESIS voice is on (one Vosk model and one mic at a time)');
      return false;
    }
    if (!voiceCmd.entries.size) { afdiag('VOICE start refused: no commands registered'); return false; }
    voiceCmd.loading = true;
    const gen = ++voiceCmd.gen;
    const cancelled = () => gen !== voiceCmd.gen;
    try {
      voiceCmdSetStatus('loading');
      await voiceCmdLoadLib();
      if (!window.Vosk) throw new Error('Vosk global missing after lib load');
      if (!voiceCmd.model) {
        const t0 = performance.now();
        const model = await window.Vosk.createModel(VOICECMD_MODEL_URL);
        if (cancelled()) { try { model.terminate(); } catch (e) {} return false; }
        voiceCmd.model = model;
        afdiag('VOICE ready in ' + Math.round(performance.now() - t0) + 'ms');
      }
      if (cancelled()) return false;
      voiceCmdSetStatus('opening mic');
      voiceCmd.mic = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true }, video: false
      });
      if (cancelled()) { voiceCmd.mic.getTracks().forEach((t) => t.stop()); voiceCmd.mic = null; return false; }
      const AC = window.AudioContext || window.webkitAudioContext;
      voiceCmd.ctx = new AC();
      voiceCmdResume('created');
      voiceCmdRecognizer();
      voiceCmd.src = voiceCmd.ctx.createMediaStreamSource(voiceCmd.mic);
      // ScriptProcessor, as KINESIS uses; Vosk takes the AudioBuffer directly.
      voiceCmd.proc = voiceCmd.ctx.createScriptProcessor(4096, 1, 1);
      voiceCmd.proc.onaudioprocess = (ev) => {
        if (!voiceCmd.on || !voiceCmd.rec) return;
        try { voiceCmd.rec.acceptWaveform(ev.inputBuffer); } catch (e) {}
      };
      voiceCmd.src.connect(voiceCmd.proc);
      voiceCmd.proc.connect(voiceCmd.ctx.destination);   // needed for onaudioprocess to fire
      voiceCmd.loading = false;
      voiceCmd.on = true;
      voiceCmdSetStatus('listening');
      afdiag('VOICE listening: ' + [...voiceCmd.entries.keys()].join(', ') +
        ' (rate ' + voiceCmd.ctx.sampleRate + ')');
      return true;
    } catch (e) {
      if (cancelled()) return false;
      voiceCmd.loading = false;
      voiceCmdRelease();
      voiceCmdSetStatus('error');
      afdiag('VOICE error: ' + (e && (e.message || e.name) || '?'));
      return false;
    }
  }

  function voiceCmdRelease() {
    try { if (voiceCmd.proc) { voiceCmd.proc.onaudioprocess = null; voiceCmd.proc.disconnect(); } } catch (e) {}
    try { if (voiceCmd.src) voiceCmd.src.disconnect(); } catch (e) {}
    try { if (voiceCmd.ctx) voiceCmd.ctx.close(); } catch (e) {}
    try { if (voiceCmd.mic) voiceCmd.mic.getTracks().forEach((t) => t.stop()); } catch (e) {}
    try { if (voiceCmd.rec) voiceCmd.rec.remove(); } catch (e) {}
    voiceCmd.proc = null; voiceCmd.src = null; voiceCmd.ctx = null; voiceCmd.mic = null; voiceCmd.rec = null;
  }

  // keepModel false also ends the Vosk worker, so nothing of ours is loaded
  // when KINESIS starts its own.
  function voiceCmdStop(why, keepModel) {
    const was = voiceCmd.on || voiceCmd.loading;
    voiceCmd.gen++;
    voiceCmd.on = false;
    voiceCmd.loading = false;
    voiceCmdRelease();
    if (!keepModel && voiceCmd.model) {
      try { voiceCmd.model.terminate(); } catch (e) {}
      voiceCmd.model = null;
    }
    voiceCmdSetStatus('off');
    if (was) afdiag('VOICE stopped' + (why ? ': ' + why : ''));
  }

  function voiceCmdRegister(entry) {
    const phrase = voiceCmdPhrase(entry && entry.phrase);
    if (!phrase || typeof entry.action !== 'function') return false;
    voiceCmd.entries.set(phrase, entry.action);
    if (voiceCmd.on) { try { voiceCmdRecognizer(); } catch (e) {} }
    return true;
  }

  window.__VOICECMD__ = Object.freeze({
    register: voiceCmdRegister,
    listen: (fn) => { if (typeof fn !== 'function') return false; voiceCmd.listeners.push(fn); return true; },
    start: voiceCmdStart,
    stop: () => voiceCmdStop('api', true),
    status: () => ({ enabled: VOICECMD_ON, on: voiceCmd.on, loading: voiceCmd.loading,
      status: voiceCmd.status, phrases: [...voiceCmd.entries.keys()] })
  });

  if (VOICECMD_ON) {
    // One small fixed text, outside the layout.
    const st = document.createElement('div');
    st.id = 'voiceCmdStatus';
    st.style.cssText = 'position:fixed;left:6px;bottom:4px;z-index:6;pointer-events:none;' +
      'font:11px/1.2 system-ui,sans-serif;color:rgba(255,255,255,0.6);';
    document.body.appendChild(st);
    voiceCmd.statusEl = st;
    voiceCmdSetStatus('off');
    // Autoplay rules can leave the context suspended until the page gets a gesture.
    const gesture = () => {
      document.removeEventListener('pointerdown', gesture, true);
      document.removeEventListener('keydown', gesture, true);
      voiceCmdResume('first gesture');
    };
    document.addEventListener('pointerdown', gesture, true);
    document.addEventListener('keydown', gesture, true);
    // The KINESIS voice button hands the mic to KINESIS: stop ours first.
    document.addEventListener('click', (e) => {
      if ((voiceCmd.on || voiceCmd.loading) && e.target && e.target.closest && e.target.closest('#knVoice')) {
        voiceCmdStop('KINESIS voice requested', false);
      }
    }, true);
    // After this script has run, so every module has registered its phrases.
    setTimeout(() => {
      if (VOICECMD_AUTO) afdiag('VOICE autostart (gym role)');
      voiceCmdStart();
    }, 0);
  }
  // ===== VOICE COMMAND MODULE END ========================================

  // ===== STOPWATCH MODULE ================================================
  // A shared stopwatch both sides hold a copy of, shown in the clock panel
  // (PACE CLOCK MODULE below). The trainer's main window has Start/Stop and
  // Reset buttons; the voice commands "timer start/stop/reset" work on any
  // side that enables voice. Every accepted command is sent to the other side
  // as {type:'timer', snapshot}, and again whenever the control channel opens
  // (at once, then after 3 s and 10 s).
  // Only elapsed time crosses the wire: the receiver rebases it on its own
  // clock, so the two machines' wall clocks are never compared.
  // The SHAREDWIDGET part is the generic sync rule; the next shared widget
  // (a set counter, say) adds its own entry to sharedWidgets.

  // ----- SHAREDWIDGET PURE START (test/stopwatch.test.js extracts this part) -----
  function sharedSeqOk(n) {
    return Number.isSafeInteger(n) && n >= 0;
  }

  // The seq for an accepted change: one above anything either side has used.
  function sharedNextSeq(localSeq, seenSeq) {
    return Math.max(sharedSeqOk(localSeq) ? localSeq : 0, sharedSeqOk(seenSeq) ? seenSeq : 0) + 1;
  }

  // True when snapshot a should replace b. Higher seq wins; on a tie the
  // smaller "by" wins, so both sides settle on the same snapshot.
  function sharedWins(a, b) {
    if (a.seq !== b.seq) return a.seq > b.seq;
    return a.by < b.by;
  }
  // ----- SHAREDWIDGET PURE END ------------------------------------------------

  // ----- STOPWATCH PURE START (test/stopwatch.test.js extracts this part) -----
  // State: {running, elapsedMs (accumulated while stopped), runStartMs (this
  // machine's Date.now() when it started running), seq, by}.
  const STOPWATCH_ZERO = Object.freeze({ running: false, elapsedMs: 0, runStartMs: 0, seq: 0, by: '' });
  const STOPWATCH_BY_MAX = 128;
  const STOPWATCH_REBASE_MS = 250;   // smaller timing differences are left alone

  function stopwatchElapsed(s, nowMs) {
    return s.elapsedMs + (s.running ? Math.max(0, nowMs - s.runStartMs) : 0);
  }

  // Returns the next state, or the same object when the command changes
  // nothing (start while running, stop while stopped, reset at zero).
  function stopwatchApply(s, cmd, nowMs, by, seenSeq) {
    let next;
    if (cmd === 'start') {
      if (s.running) return s;
      next = { running: true, elapsedMs: s.elapsedMs, runStartMs: nowMs };
    } else if (cmd === 'stop') {
      if (!s.running) return s;
      next = { running: false, elapsedMs: stopwatchElapsed(s, nowMs), runStartMs: 0 };
    } else if (cmd === 'reset') {
      if (!s.running && s.elapsedMs === 0) return s;
      next = { running: false, elapsedMs: 0, runStartMs: 0 };
    } else {
      return s;
    }
    next.seq = sharedNextSeq(s.seq, seenSeq);
    next.by = String(by);
    return next;
  }

  function stopwatchSnapshot(s, nowMs) {
    return { running: s.running, elapsedMs: Math.round(stopwatchElapsed(s, nowMs)), seq: s.seq, by: s.by };
  }

  function stopwatchSnapshotValid(o) {
    return !!o && typeof o.running === 'boolean' && Number.isFinite(o.elapsedMs) && o.elapsedMs >= 0 &&
      sharedSeqOk(o.seq) && typeof o.by === 'string' && o.by.length <= STOPWATCH_BY_MAX;
  }

  // Our state with a remote snapshot merged in; the same object if ours wins.
  // A snapshot of the same command (same seq and by) made by the other side
  // (by is not selfId; a call has two peers) re-bases a running stopwatch on
  // the sender's timing, which corrects a first snapshot that waited behind a
  // busy page before it was handled.
  function stopwatchMerge(s, snap, nowMs, selfId) {
    if (!stopwatchSnapshotValid(snap)) return s;
    if (!sharedWins(snap, s)) {
      const same = snap.seq === s.seq && snap.by === s.by && s.by !== selfId && s.running && snap.running;
      if (!same || Math.abs(stopwatchElapsed(s, nowMs) - snap.elapsedMs) <= STOPWATCH_REBASE_MS) return s;
    }
    return snap.running
      ? { running: true, elapsedMs: 0, runStartMs: nowMs - snap.elapsedMs, seq: snap.seq, by: snap.by }
      : { running: false, elapsedMs: snap.elapsedMs, runStartMs: 0, seq: snap.seq, by: snap.by };
  }

  // Stored state from this machine; a running stopwatch carries on from the
  // wall clock. Anything unreadable means zero.
  function stopwatchParse(raw) {
    try {
      const o = JSON.parse(raw);
      if (stopwatchSnapshotValid(o) && Number.isFinite(o.runStartMs)) {
        return { running: o.running, elapsedMs: o.elapsedMs, runStartMs: o.running ? o.runStartMs : 0, seq: o.seq, by: o.by };
      }
    } catch (e) {}
    return STOPWATCH_ZERO;
  }

  // M:SS.t, or H:MM:SS.t from one hour. Tenths are cut, not rounded, so the
  // display never shows a tenth that has not happened yet.
  function stopwatchFormat(ms) {
    const tenths = (Number.isFinite(ms) && ms > 0) ? Math.floor(ms / 100) : 0;
    const secs = Math.floor(tenths / 10);
    const two = (n) => String(n).padStart(2, '0');
    const h = Math.floor(secs / 3600);
    const m = Math.floor(secs / 60) % 60;
    return (h > 0 ? h + ':' + two(m) : String(m)) + ':' + two(secs % 60) + '.' + (tenths % 10);
  }

  // Why a command changed nothing, for the log; null when it would change something.
  function stopwatchNoopReason(s, cmd) {
    if (cmd === 'start' && s.running) return 'already running';
    if (cmd === 'stop' && !s.running) return 'already stopped';
    if (cmd === 'reset' && !s.running && s.elapsedMs === 0) return 'already at zero';
    return null;
  }

  // ?voiceword= the word before start/stop/reset: 3-12 lowercase letters,
  // anything else means "timer".
  function stopwatchVoiceWord(raw) {
    return (typeof raw === 'string' && /^[a-z]{3,12}$/.test(raw)) ? raw : 'timer';
  }

  // Longer readouts get a smaller font so they fit the same panel.
  function stopwatchSizeClass(text) {
    return text.length >= 9 ? 'len9' : (text.length >= 7 ? 'len7' : '');
  }
  // ----- STOPWATCH PURE END ---------------------------------------------------

  const LS_STOPWATCH = 'trainingCall:stopwatch';
  const STOPWATCH_FAST_MS = 100;     // readout rate while running and visible
  let stopwatchState = STOPWATCH_ZERO;
  try { stopwatchState = stopwatchParse(localStorage.getItem(LS_STOPWATCH)); } catch (e) {}
  let stopwatchSeenSeq = 0;          // highest seq received from the other side
  const clockViews = [];             // clock panels currently built (main window, pop-out)
  // EFFORT MODULE state, declared before any clock view can be built: the
  // gym's own last rating for the pop-out ('' = no line). Gym role with
  // ?poserec=1 only; the POSEREC block sets it through __POSEREC_HOST__.effort().
  const EFFORT_GYM = AF_FORCE_MODE && params.get('poserec') === '1';
  let effortSelfText = '';
  let effortPersonText = '';   // person and open set for the pop-out, "Alex · set 2 squats" ('' = no line)
  // Large confirmation text on the pop-out for EFFORT_FLASH_MS after each
  // accepted voice command (pop-out only; gym role with ?poserec=1 only).
  const EFFORT_FLASH_MS = 2500;
  let effortFlashText = '', effortFlashUntil = 0, effortFlashTimer = 0;
  function effortFlash(text) {
    if (!EFFORT_GYM) return;
    effortFlashText = String(text || '');
    effortFlashUntil = Date.now() + EFFORT_FLASH_MS;
    clearTimeout(effortFlashTimer);
    effortFlashTimer = setTimeout(clockViewsUpdate, EFFORT_FLASH_MS + 50);
    clockViewsUpdate();
  }

  function stopwatchSet(next, action, src) {
    stopwatchState = next;
    try { localStorage.setItem(LS_STOPWATCH, JSON.stringify(next)); } catch (e) {}
    try {
      afdiag('STOPWATCH ' + action + ' src=' + src + ' seq=' + next.seq +
        ' elapsed=' + Math.round(stopwatchElapsed(next, Date.now())) + 'ms');
    } catch (e) {}
    clockViewsUpdate();
  }

  // cmd: start | stop | reset; src: button | voice. Returns false for a no-op.
  function stopwatchCommand(cmd, src) {
    const next = stopwatchApply(stopwatchState, cmd, Date.now(), clientId, stopwatchSeenSeq);
    if (next === stopwatchState) {
      const why = stopwatchNoopReason(stopwatchState, cmd);
      if (why) {
        try { afdiag('STOPWATCH ' + cmd + ' ignored (' + why + ') src=' + src + ' seq=' + stopwatchState.seq); } catch (e) {}
      }
      return false;
    }
    stopwatchSet(next, cmd, src);
    sharedWidgetSend('timer');
    return true;
  }

  function stopwatchReceive(snap) {
    if (!stopwatchSnapshotValid(snap)) return;
    if (snap.seq > stopwatchSeenSeq) stopwatchSeenSeq = snap.seq;
    const prev = stopwatchState;
    const next = stopwatchMerge(prev, snap, Date.now(), clientId);
    if (next === prev) return;
    const action = (next.seq === prev.seq && next.by === prev.by) ? 'resync'
      : (next.running ? 'start' : (next.elapsedMs === 0 ? 'reset' : 'stop'));
    stopwatchSet(next, action, 'remote');
  }

  // Shared widgets sync over controlChannel as {type, snapshot}. Each entry
  // gives its current snapshot and takes one from the other side.
  const sharedWidgets = Object.create(null);
  sharedWidgets.timer = {
    snapshot: () => stopwatchSnapshot(stopwatchState, Date.now()),
    receive: stopwatchReceive
  };

  function sharedWidgetSend(type) {
    if (!controlChannel || controlChannel.readyState !== 'open') return;
    try { controlChannel.send(JSON.stringify({ type, snapshot: sharedWidgets[type].snapshot() })); } catch (e) {}
  }

  function sharedWidgetSendAll() {
    Object.keys(sharedWidgets).forEach(sharedWidgetSend);
  }

  // On every channel open: send now, and again once each page has settled
  // (a page that has just loaded can be slow to handle the first message).
  const SHARED_RESEND_MS = [3000, 10000];
  function sharedWidgetsOnOpen() {
    sharedWidgetSendAll();
    SHARED_RESEND_MS.forEach((ms) => setTimeout(sharedWidgetSendAll, ms));
  }

  // ----- VOICEALIAS PURE START (test/effort.test.js extracts this part) -----
  // Every way to say each timer command, originals first ("<word> start" etc.,
  // word from ?voiceword=, default "timer"), then the aliases; all go through
  // the same registry. The clock phrases are fixed.
  function stopwatchVoicePhrases(word) {
    return [
      { phrase: word + ' start', cmd: 'start' }, { phrase: word + ' stop', cmd: 'stop' }, { phrase: word + ' reset', cmd: 'reset' },
      { phrase: 'start ' + word, cmd: 'start' }, { phrase: word + ' go', cmd: 'start' },
      { phrase: 'start the clock', cmd: 'start' }, { phrase: 'clock start', cmd: 'start' },
      { phrase: 'stop ' + word, cmd: 'stop' }, { phrase: 'stop the clock', cmd: 'stop' }, { phrase: 'clock stop', cmd: 'stop' },
      { phrase: 'reset ' + word, cmd: 'reset' }, { phrase: 'reset the clock', cmd: 'reset' }, { phrase: 'clock reset', cmd: 'reset' }];
  }
  // ----- VOICEALIAS PURE END -----

  const STOPWATCH_VOICE_WORD = stopwatchVoiceWord(params.get('voiceword'));
  if (window.__VOICECMD__) {
    stopwatchVoicePhrases(STOPWATCH_VOICE_WORD).forEach((p) => {
      // EFFORT MODULE: an accepted command also flashes on the pop-out (gym, ?poserec=1 only).
      window.__VOICECMD__.register({ phrase: p.phrase, action: () => { if (stopwatchCommand(p.cmd, 'voice')) effortFlash('Timer ' + p.cmd); } });
    });
  }

  // One clock panel: its elements, the window it lives in, and its 10 Hz
  // timer, which runs only while the stopwatch runs and the panel is visible.
  // Each view listens for its own document's visibility, and drops the
  // listener with the view, so rebuilding into a reused popout adds none.
  function clockViewMake(win, doc, root, prefix, shown) {
    const q = (id) => root.querySelector('#' + prefix + id);
    const v = { win, doc, shown, fast: 0, failed: false, digits: q('Readout'), session: q('Session'),
      startStop: q('StartStop'), reset: q('Reset'), effort: q('Effort'), person: q('Person'), flash: q('Flash') };
    v.onVisibility = () => clockViewUpdate(v);
    doc.addEventListener('visibilitychange', v.onVisibility);
    clockViews.push(v);
    return v;
  }

  function clockViewDrop(v) {
    try { if (v.fast) v.win.clearInterval(v.fast); } catch (e) {}
    v.fast = 0;
    try { v.doc.removeEventListener('visibilitychange', v.onVisibility); } catch (e) {}
    const i = clockViews.indexOf(v);
    if (i >= 0) clockViews.splice(i, 1);
  }

  function clockViewUpdate(v) {
    try {
      if (v.win.closed || !v.digits.isConnected) { clockViewDrop(v); return; }
      const now = Date.now();
      const s = stopwatchState;
      const text = stopwatchFormat(stopwatchElapsed(s, now));
      if (v.digits.textContent !== text) {
        v.digits.textContent = text;
        v.digits.className = ('clockDigits ' + stopwatchSizeClass(text)).trim();
      }
      // No session yet (nobody has joined): no "Session 0:00:00" line.
      const inSession = paceClockValid(paceClockState);
      if (v.session.hidden === inSession) v.session.hidden = !inSession;
      const session = 'Session ' + paceClockFormat(paceClockState, now);
      if (v.session.textContent !== session) v.session.textContent = session;
      if (v.effort) {
        // EFFORT MODULE: the gym's own last rating (pop-out only, ?poserec=1).
        if (v.effort.hidden === !!effortSelfText) v.effort.hidden = !effortSelfText;
        if (v.effort.textContent !== effortSelfText) v.effort.textContent = effortSelfText;
      }
      if (v.person) {
        // EFFORT MODULE: the current person and open set (pop-out only, ?poserec=1).
        if (v.person.hidden === !!effortPersonText) v.person.hidden = !effortPersonText;
        if (v.person.textContent !== effortPersonText) v.person.textContent = effortPersonText;
      }
      if (v.flash) {
        // EFFORT MODULE: the confirmation flash (pop-out only, ?poserec=1).
        const on = !!effortFlashText && Date.now() < effortFlashUntil;
        if (v.flash.hidden === on) v.flash.hidden = !on;
        if (on && v.flash.textContent !== effortFlashText) v.flash.textContent = effortFlashText;
      }
      if (v.startStop) {
        // Write only on a change: rewriting the same text 10x a second while running
        // replaces the button's text node under the pointer and Safari then drops the click.
        const ssText = s.running ? 'Stop' : 'Start';
        const ssClass = s.running ? 'stop' : 'start';
        if (v.startStop.textContent !== ssText) v.startStop.textContent = ssText;
        if (v.startStop.className !== ssClass) v.startStop.className = ssClass;
        const resetOff = !s.running && s.elapsedMs === 0;
        if (v.reset.disabled !== resetOff) v.reset.disabled = resetOff;
      }
      const want = s.running && v.doc.visibilityState === 'visible' && v.shown();
      if (want && !v.fast) v.fast = v.win.setInterval(() => clockViewUpdate(v), STOPWATCH_FAST_MS);
      else if (!want && v.fast) { v.win.clearInterval(v.fast); v.fast = 0; }
    } catch (e) {
      // Keep the view: the next update may well succeed. Log the first failure only.
      if (!v.failed) {
        v.failed = true;
        try { afdiag('CLOCK view update failed: ' + ((e && e.message) || e)); } catch (e2) {}
      }
    }
  }

  function clockViewsUpdate() {
    clockViews.slice().forEach(clockViewUpdate);
  }
  // ===== STOPWATCH MODULE END ============================================

  // ===== PACE CLOCK MODULE ===============================================
  // The clock panel inside the popout built by pipBuildVideoIn(): the shared
  // stopwatch (STOPWATCH MODULE above) as the large line and the session
  // total as the small line under it (hidden until a session has started).
  // Display only, no buttons. A timer on
  // the popout's own window (the opener can be throttled) keeps the session
  // total current; the STOPWATCH MODULE adds a 10 Hz timer while it runs.
  // The main-page timer keeps session state current before a popout exists.
  // Delete this block and the paceClockBuildIn() line in pipBuildVideoIn() to
  // remove the feature.

  // ----- PACECLOCK PURE START (test/paceclock.test.js extracts this part) -----
  const GAP_MS = 30 * 60 * 1000;     // nobody in the call for longer than this ends the session

  function paceClockValid(state) {
    return !!state && Number.isFinite(state.startAt) && Number.isFinite(state.lastUpAt);
  }

  // Returns the next {startAt, lastUpAt}, or null for no session. Returns the
  // same object when nothing changed, so the caller can skip the storage write.
  function paceClockStep(state, nowMs, peerUp) {
    const live = paceClockValid(state) ? state : null;
    const expired = !!live && (nowMs - live.lastUpAt > GAP_MS);
    if (peerUp) {
      return { startAt: (live && !expired) ? live.startAt : nowMs, lastUpAt: nowMs };
    }
    return expired ? null : live;
  }

  function paceClockParse(raw) {
    try {
      const o = JSON.parse(raw);
      return paceClockValid(o) ? { startAt: o.startAt, lastUpAt: o.lastUpAt } : null;
    } catch (e) {
      return null;
    }
  }

  function paceClockFormat(state, nowMs) {
    const total = paceClockValid(state) ? Math.max(0, Math.floor((nowMs - state.startAt) / 1000)) : 0;
    const two = (n) => String(n).padStart(2, '0');
    return Math.floor(total / 3600) + ':' + two(Math.floor(total / 60) % 60) + ':' + two(total % 60);
  }

  function paceClockPos(raw) {
    return ['right', 'left', 'top', 'bottom', 'overlay'].includes(raw) ? raw : 'overlay';
  }

  // ?clocksize= clock width as a percentage of the popout width: 5-40, default 15.
  function paceClockSize(raw) {
    if (typeof raw !== 'string' || !/^\s*-?\d+(\.\d+)?\s*$/.test(raw)) return 15;
    return Math.min(40, Math.max(5, Number(raw)));
  }

  // vw units follow the popout's own width, including fullscreen and resizes.
  // Overlay sets no rule on the video, so it keeps its full-window layout.
  // --clock-w is the width the panel's text is sized from (clockFaceCss).
  function paceClockCss(pos, size) {
    const s = size + 'vw';
    const side = '#popoutVideo{flex:1 1 0;width:auto;min-width:0;min-height:0;}' +
      '#paceClockPanel{flex:0 0 ' + s + ';--clock-w:' + s + ';}';
    const stack = '#popoutVideo{flex:1 1 0;height:auto;min-width:0;min-height:0;}' +
      '#paceClockPanel{flex:0 0 ' + s + ';min-height:0;--clock-w:calc(' + s + ' * 1.6);}';
    if (pos === 'right') return 'body{display:flex;flex-direction:row;}' + side;
    if (pos === 'left') return 'body{display:flex;flex-direction:row-reverse;}' + side;
    if (pos === 'bottom') return 'body{display:flex;flex-direction:column;}' + stack;
    if (pos === 'top') return 'body{display:flex;flex-direction:column-reverse;}' + stack;
    return '#paceClockPanel{position:fixed;top:1vw;right:1vw;z-index:1;width:' + s + ';--clock-w:' + s + ';' +
      'background:rgba(0,0,0,0.7);border-radius:calc(' + s + ' * 0.08);}';
  }

  // The panel's text, shared by the pop-out and the main window: large
  // white tabular digits, a small session line, and (main window) the
  // buttons, all sized from --clock-w. Only the buttons take clicks.
  function clockFaceCss() {
    const w = (f) => 'calc(var(--clock-w) * ' + f + ')';
    return '.clockFace{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;' +
      'justify-content:center;padding:' + w(0.05) + ' ' + w(0.04) + ';color:#fff;' +
      'font-family:Arial,Helvetica,sans-serif;pointer-events:none;}' +
      '.clockDigits{font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap;' +
      'font-size:' + w(0.26) + ';}' +
      '.clockDigits.len7{font-size:' + w(0.22) + ';}' +
      '.clockDigits.len9{font-size:' + w(0.17) + ';}' +
      '.clockSession{font-size:' + w(0.075) + ';color:#c8ced6;font-variant-numeric:tabular-nums;' +
      'white-space:nowrap;margin-top:' + w(0.02) + ';}' +
      '.clockButtons{display:flex;gap:' + w(0.05) + ';margin-top:' + w(0.05) + ';}' +
      '.clockButtons button{pointer-events:auto;cursor:pointer;border:0;border-radius:999px;color:#fff;' +
      'min-width:' + w(0.38) + ';padding:' + w(0.035) + ' ' + w(0.05) + ';' +
      'font:700 max(11px,' + w(0.075) + ') Arial,Helvetica,sans-serif;}' +
      '.clockButtons button.start{background:#1f9d43;}' +
      '.clockButtons button.stop{background:#d0342c;}' +
      '.clockButtons button.reset{background:#5d636b;}' +
      '.clockButtons button:disabled{opacity:0.45;cursor:default;}';
  }

  // prefix + Readout / Session / StartStop / Reset are the element ids.
  function clockFaceHtml(prefix, withButtons) {
    return '<div id="' + prefix + 'Readout" class="clockDigits">0:00.0</div>' +
      '<div id="' + prefix + 'Session" class="clockSession">Session 0:00:00</div>' +
      (withButtons
        ? '<div class="clockButtons">' +
          '<button id="' + prefix + 'StartStop" type="button" class="start">Start</button>' +
          '<button id="' + prefix + 'Reset" type="button" class="reset" disabled>Reset</button></div>'
        : '');
  }
  // ----- PACECLOCK PURE END ---------------------------------------------------

  // ===== AF DIAGNOSTIC LOGGER: JS START ===================================
  // Persistent, LOG-ONLY diagnostic logger for the door-camera "tilts down
  // and stays down" / "disappears from switcher" investigation. Read-only
  // with respect to the app: it never changes what auto-framing, PTZ, or the
  // camera switcher do -- it only observes and records. Every write is
  // wrapped in try/catch so a logging failure (including a localStorage
  // quota error) can never affect the call. NOT cleared on page load --
  // survives reloads and launcher relaunches, since the incident is usually
  // followed by one; only the Clear button below empties it. Writes are
  // batched (flushed on a 1s timer) so a busy period never means a
  // JSON.stringify of the whole buffer on every call.
  const AFDIAG_LS_LOG = 'afDiag:log_v1';
  const AFDIAG_MAX_LINES = 5000;   // ring buffer cap -- oldest lines drop first
  const AFDIAG_FLUSH_MS = 1000;    // batched writes -- never stringify per line
  let afdiagBuf = [];              // lines already persisted this load
  let afdiagPending = [];          // lines written since the last flush
  let afdiagLastSummarySig = null;
  let afdiagLastHeartbeatAt = 0;    // AFFIX: wall-clock ms of the last summary/heartbeat line

  function afdiagRoleLabel() {
    try {
      if (!afOpenDeviceId) return '—';
      if (!AF_FORCE_MODE) return 'unforced';
      const hit = afRoleFor(afOpenDeviceId);
      return hit ? hit.role.toLowerCase() : 'unrecognised';
    } catch (e) { return '?'; }
  }

  function afdiagLoad() {
    try {
      const raw = JSON.parse(localStorage.getItem(AFDIAG_LS_LOG) || '[]');

  function afdiagFlush() {
    try {
      if (!afdiagPending.length) return;
      try { if (telemIsGym) logsinkEnqueue(afdiagPending); } catch (e2) { /* LOGSTREAM MODULE: must never affect logging */ }
      afdiagBuf = afdiagBuf.concat(afdiagPending);
      afdiagPending = [];
      if (afdiagBuf.length > AFDIAG_MAX_LINES) {
        afdiagBuf = afdiagBuf.slice(afdiagBuf.length - AFDIAG_MAX_LINES);
      }
      localStorage.setItem(AFDIAG_LS_LOG, JSON.stringify(afdiagBuf));

  }

      afdiagPending.push(line);
      // Guard against an unbounded burst piling up between flushes.
      if (afdiagPending.length > AFDIAG_MAX_LINES) {
        afdiagPending = afdiagPending.slice(afdiagPending.length - AFDIAG_MAX_LINES);
      }
      // ===== TELEMETRY MODULE: queue this line for the trainer -> gym log
      // stream. Nested try/catch so a telemetry failure can never take down
      // normal logging above -- this is the ONLY place telemetry code touches
      // afdiag() itself. Trainer-only (telemIsTrainer()); the gym side never
      // enqueues its own lines for sending.
      try { if (telemIsTrainer()) telemEnqueue(line); } catch (e2) { /* telemetry must never affect logging */ }

  // afdiag() hook above, the wsOpenedAt assignment in connectSignaling()'s
  // onopen, the 'sigprobe' arm in mySocket.onmessage, and the
  // 'trainer-log-batch' arm in setupControlChannel()'s onmessage.
  // (TELEM_* state constants/lets now declared near telemIsTrainer, above.)

  function telemLineTimestampMs(line) {

    try {

  function afdiagIngestRemote(text) {

  // ===== LOGSTREAM MODULE: gym log lines -> localhost session receiver ========
  // Gym role only (telemIsGym; the trainer's page never queues or POSTs). Copies
  // every line afdiagFlush() persists -- the gym's own afdiag() lines and the
  // [trainer] lines afdiagIngestRemote() adds -- and POSTs {"lines":[...]} to
  // LOGSINK_URL every 5s while a peer is connected and for 2 min after the last
  // one leaves, then one final POST with "end":true and silence until a peer
  // connects again. Observe-only: reads pc/controlChannel state, never writes
  // to them; every failure is swallowed; its only other output is at most one
  // afdiag() line per sink outage and one per recovery. To remove: delete this
  // block, the LOGSTREAM state next to the role latch, the one hook in
  // afdiagFlush(), and the CAMSWITCH line in the switch-camera handler.
  // State lives next to the role latch (see LOGSINK_* there).

  function logsinkEnqueue(lines) {
    if (!telemIsGym) return;

    if (logsinkQueue.length > LOGSINK_QUEUE_MAX) {

              (controlChannel && controlChannel.readyState === 'open'));

  // Oldest-first batch within the line/byte caps (newestFirst for pagehide).
  function logsinkTakeBatch(newestFirst) {
    const enc = new TextEncoder();
    const out = [];
    let bytes = 24; // {"lines":[],"end":true}
    const n = logsinkQueue.length;
    for (let k = 0; k < n && out.length < LOGSINK_MAX_LINES; k++) {
      const line = logsinkQueue[newestFirst ? n - 1 - k : k];
      const b = enc.encode(JSON.stringify(line)).length + 1;
      if (out.length && bytes + b > LOGSINK_MAX_BYTES) break;
      out.push(line);
      bytes += b;
    }
    return newestFirst ? out.reverse() : out;
  }

  function logsinkPost(lines, end, keepalive) {
    const body = JSON.stringify(end ? { lines, end: true } : { lines });
    // keepalive (pagehide) uses text/plain so it needs no preflight; the receiver parses JSON either way
    const ctl = (!keepalive && typeof AbortController === 'function') ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => { try { ctl.abort(); } catch (e) {} }, LOGSINK_TIMEOUT_MS) : null;
    return fetch(LOGSINK_URL, {
      method: 'POST',
      headers: { 'Content-Type': keepalive ? 'text/plain' : 'application/json' },
      body,
      keepalive: !!keepalive,
      credentials: 'omit',
      cache: 'no-store',
      signal: ctl ? ctl.signal : undefined,
    }).then((r) => {
      if (timer) clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
    }, (e) => {
      if (timer) clearTimeout(timer);
      throw e;
    });

  function logsinkOk() {
    if (logsinkFailing) {
      afdiag('LOGSINK recovered after ' + logsinkFailCount + ' failed attempt(s); ' +
        (logsinkDropped - logsinkDroppedAtFail) + ' line(s) dropped while down');

    logsinkFailCount = 0;
    logsinkBackoff = 0;
    logsinkNextAt = 0;

  function logsinkFail(e) {
    logsinkFailCount++;
    logsinkBackoff = logsinkBackoff ? Math.min(logsinkBackoff * 2, LOGSINK_BACKOFF_MAX_MS) : LOGSINK_BACKOFF_MIN_MS;
    logsinkNextAt = Date.now() + logsinkBackoff;

      logsinkDroppedAtFail = logsinkDropped;
      afdiag('LOGSINK unreachable (' + String((e && e.message) || e).slice(0, 80) + ') — queue=' +
        logsinkQueue.length + ', retrying every ' + (LOGSINK_BACKOFF_MIN_MS / 1000) + '-' + (LOGSINK_BACKOFF_MAX_MS / 1000) + 's');
    }
  }

  async function logsinkTick() {
    try {

      if (logsinkPeerUp()) {
        logsinkLastPeerAt = now;
        logsinkMode = 'live';
      } else if (logsinkMode === 'live' && now - logsinkLastPeerAt >= LOGSINK_LINGER_MS) {
        logsinkMode = 'ending';
        logsinkEndingSince = now;
      } else if (logsinkMode === 'ending' && now - logsinkEndingSince >= LOGSINK_END_GIVEUP_MS) {

      }

          if (!lines.length && !end) break;

          const sent = Math.max(0, lines.length - (logsinkDropped - droppedBefore));

          logsinkOk();
          if (end) { logsinkMode = 'idle'; break; }
        }

      }

  }

  // ===== PINGPONG MODULE: app-level signaling liveness =========================
  // The server's protocol-level ws pings prove the socket to the SERVER, not to
  // us -- a half-open socket can look OPEN here indefinitely. Every 20s send
  // {type:'ping'}; the server answers {type:'pong'} to us only. If no pong for
  // 40s, force a reconnect through scheduleReconnect() -- the same path
  // mySocket.onclose uses. Both timers stand down while the tab is hidden
  // (timers are throttled there and a stale gap would false-trigger); the
  // baseline is reset when it comes back. The watchdog stays inert until the
  // first pong ever arrives, so this page against a server WITHOUT ping/pong
  // support behaves exactly like index-telemetry (no reconnect loop).
  // To remove: delete this block, the PINGPONG lets near wsOpenedAt, the
  // lastPongAt line in onopen, the 'pong' arm in onmessage, and the rtt/pongAge
  // fields in TELEM-HB.
  const PING_INTERVAL_MS = 20000;
  const PONG_WATCHDOG_MS = 5000;
  const PONG_TIMEOUT_MS = 40000;

  function pingTick() {
    try {
      if (document.hidden) return;
      if (ws && ws.readyState === 1) { // 1 = WebSocket.OPEN -- checked directly, never via send()
        pingSeq++;
        ws.send(JSON.stringify({ type: 'ping', seq: pingSeq, t: Date.now() }));
      }
    } catch (e) { console.error('[pingpong] ping tick failed', e); }
  }

  function pongWatchdogTick() {
    try {
      if (document.hidden) return;
      if (!pongSeen || !inCall || replaced) return;
      if (!ws || ws.readyState !== 1) return; // closed/connecting: the existing onclose/retry path owns it
      const age = Date.now() - lastPongAt;

        afdiag('PONG timeout — no pong for ' + age + 'ms (lastRtt=' + (lastRtt === null ? 'na' : lastRtt + 'ms') + ') — forcing reconnect');
        lastPongAt = Date.now(); // one trigger per stall; onopen resets it again for the new socket
        if (inCall && !replaced) setStatus('Signaling lost — retrying…', 'bad');
        scheduleReconnect('pong-timeout');
      }
    } catch (e) { console.error('[pingpong] watchdog tick failed', e); }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) lastPongAt = Date.now(); // reset the baseline -- hidden time is not a stall
  });

  // Check-with-a-ping-first, used when the tab comes back after > FORCE_RECONNECT_HIDDEN_MS.
  // Pong within PONG_PROBE_MS: keep the socket, touch nothing. No pong, socket not
  // open, or a server that has never ponged: the same forced reconnect as before.
  // Exactly one PROBE line per decision, naming the path taken.
  const PONG_PROBE_MS = 5000;

  function verifyOrReconnect(hiddenFor) {
    if (!inCall || replaced) return; // reconnectNow() would no-op here anyway
    if (probe) return;               // a check is already in flight
    if (!pongSeen || !ws || ws.readyState !== 1) {
      afdiag('PROBE after hidden ' + hiddenFor + 'ms — path=reconnect (' +
        (!pongSeen ? 'server has never ponged' : 'ws not open, state=' + (ws ? ws.readyState : 'null')) + ')');
      reconnectNow('visibilitychange-forced', true);
      return;
    }
    const seq = ++pingSeq;
    probe = { seq: seq, socket: ws, hiddenFor: hiddenFor, timer: null };
    try {
      ws.send(JSON.stringify({ type: 'ping', seq: seq, t: Date.now() }));
    } catch (e) {
      probe = null;
      afdiag('PROBE after hidden ' + hiddenFor + 'ms — path=reconnect (ping send failed)');
      reconnectNow('visibilitychange-forced', true);
      return;
    }
    probe.timer = setTimeout(() => {
      const p = probe;
      probe = null;
      if (!p) return;
      if (ws !== p.socket) {
        afdiag('PROBE seq=' + p.seq + ' after hidden ' + p.hiddenFor + 'ms — path=none (socket already replaced)');
        return;
      }
      afdiag('PROBE seq=' + p.seq + ' after hidden ' + p.hiddenFor + 'ms — path=reconnect (no pong in ' + PONG_PROBE_MS + 'ms)');
      reconnectNow('visibilitychange-forced', true);
    }, PONG_PROBE_MS);
  }

      (rtt === null ? 'na' : rtt + 'ms') + ', no reconnect)');

  setInterval(pongWatchdogTick, PONG_WATCHDOG_MS);

  // ---- tuning persistence ------------------------------------------------
  const AF_SLIDERS = ['torso','vDead','hDead','stepT','stepP','tGain','pGain','rate','smooth','reacq','detHz'];
  function afReadTune() {
    AF_SLIDERS.forEach((k) => { afT[k] = +afQ('af_' + k).value; });

  // ---- per-camera invert persistence -------------------------------------
  function afInvStore() {
    try { return JSON.parse(localStorage.getItem(AF_LS_INV) || '{}'); } catch (e) { return {}; }
  }
  function afSaveInv() {
    if (!afOpenDeviceId) return;
    try {
      const s = afInvStore();
      s[afOpenDeviceId] = { t: afQ('af_invT').checked, p: afQ('af_invP').checked };
      localStorage.setItem(AF_LS_INV, JSON.stringify(s));
      afQ('afInvSaved').textContent = 'saved for ' + afOpenDeviceId.slice(0, 8);
      afQ('afInvSaved').className = 'af-ok';
    } catch (e) {}
  }
  // ORDERING FIX (v13 defect): this runs while the controls are still disabled,
  // BEFORE the user can touch a checkbox. In v13 it ran at the end of
  // startStream(), so a hand-set pair was silently overwritten on every open —
  // four combinations were set and one combination was tested, four times.
  function afRestoreInv() {
    afQ('afInvSaved').textContent = '';

    // Guarantee A, step 1 (PER-CAMERA) — a launcher-forced map (inv=door) is
    // authoritative. afOpenDeviceId is set by the caller (startStream) BEFORE this
    // runs, so the current camera's deviceId is available for lookup here. The map
    // applies each camera's correct pair with zero hand-setting; localStorage is
    // skipped entirely in forced mode. An unrecognised deviceId fails SAFE.
    if (AF_FORCE_MODE) {
      afInvUnconfirmed = false;
      const hit = afRoleFor(afOpenDeviceId);
      if (hit) {
        afQ('af_invT').checked = hit.t;
        afQ('af_invP').checked = hit.p;
        afQ('af_panOn').checked = true;
        afReadTune();
        afQ('afInvSaved').textContent = 'forced (' + hit.role + '): tilt ' + (hit.t ? 'ON' : 'OFF') + '/pan ' + (hit.p ? 'ON' : 'OFF');
        afQ('afInvSaved').className = 'af-ok';
        afLog('Inverts forced per-camera (' + hit.role + ', ' + (afOpenDeviceId || '').slice(0, 8) + '): tilt ' + (hit.t ? 'ON' : 'OFF') + ', pan ' + (hit.p ? 'ON' : 'OFF') + ' — localStorage skipped.', 'af-ok');
        try { afdiag('inverts forced (recognised, ' + hit.role.toLowerCase() + '): tilt ' + (hit.t ? 'ON' : 'OFF') + ' pan ' + (hit.p ? 'ON' : 'OFF')); } catch (e2) {}
      } else {
        // UNRECOGNISED camera — deviceId not in the baked map (replug shuffle or a
        // third camera). Force pan OFF (non-runaway) and HOLD auto-framing until a
        // human confirms inverts. The caller checks afInvUnconfirmed before enabling
        // the Go button, so this camera physically cannot auto-frame unconfirmed.
        afInvUnconfirmed = true;
        afQ('af_invT').checked = AF_FORCE_FALLBACK.t;
        afQ('af_invP').checked = AF_FORCE_FALLBACK.p;
        afQ('af_panOn').checked = true;
        afReadTune();
        afQ('afInvSaved').textContent = 'UNRECOGNISED cam ' + (afOpenDeviceId || '').slice(0, 8) + ' — auto-framing HELD; confirm inverts';
        afQ('afInvSaved').className = 'af-warn';
        afLog('Unrecognised camera ' + (afOpenDeviceId || '').slice(0, 8) + ' at index ' + afCameraIndex(afOpenDeviceId) + ' — expected exactly two (index0=Door, index1=Rack) from the remap launcher. Pan forced OFF and auto-framing HELD (safe). If you see this, the launcher did not pin both cameras: relaunch via the icon, or confirm inverts by hand to enable.', 'af-warn');
        try { afdiag('UNRECOGNISED camera adopted (index ' + afCameraIndex(afOpenDeviceId) + ') — auto-framing HELD, pan forced OFF'); } catch (e2) {}
      }
      return;
    }

    if (!afOpenDeviceId) return;
    const s = afInvStore()[afOpenDeviceId];
    if (!s) {
      // Guarantee A, step 2 — SAFETY FALLBACK (fixes the failed-session cause).
      // With no saved pair, fall to the known-good default (tilt ON, pan ON from
      // AF_DEFAULTS) rather than leaving the HTML default of OFF/OFF, which drove
      // the door camera the wrong way and parked it at a limit. Not written back
      // to localStorage — a fallback is not a decision.
      afQ('af_invT').checked = AF_DEFAULTS.invT;
      afQ('af_invP').checked = AF_DEFAULTS.invP;
      afReadTune();
      afQ('afInvSaved').textContent = 'no saved pair — default tilt ' + (AF_DEFAULTS.invT ? 'ON' : 'OFF') + '/pan ' + (AF_DEFAULTS.invP ? 'ON' : 'OFF') + ' for ' + afOpenDeviceId.slice(0, 8);
      afQ('afInvSaved').className = 'af-warn';
      afLog('No saved inverts for ' + afOpenDeviceId.slice(0, 8) + ' — applied known-good default (tilt ' + (AF_DEFAULTS.invT ? 'ON' : 'OFF') + ', pan ' + (AF_DEFAULTS.invP ? 'ON' : 'OFF') + '). Set them by hand to override; they persist from here.', 'af-warn');
      return;
    }
    afQ('af_invT').checked = !!s.t;
    afQ('af_invP').checked = !!s.p;
    afReadTune();
    afQ('afInvSaved').textContent = 'restored for ' + afOpenDeviceId.slice(0, 8);
    afQ('afInvSaved').className = 'af-ok';
    afLog('Inverts restored for ' + afOpenDeviceId.slice(0, 8) + ': tilt ' + (s.t ? 'ON' : 'OFF') + ', pan ' + (s.p ? 'ON' : 'OFF') + '.', 'af-ok');
  }
  ['af_invT', 'af_invP'].forEach((id) => {
    afQ(id).addEventListener('change', () => {
      afReadTune();
      afSaveInv();
      // A human toggling an invert on an UNRECOGNISED camera is the confirmation
      // that releases the safety hold: clear the flag and enable auto-framing.
      if (afInvUnconfirmed) {
        afInvUnconfirmed = false;
        if (afPoseReady && afTrack && afCaps && afCaps.tilt) afQ('afGo').disabled = false;
        afQ('afInvSaved').textContent = 'confirmed by hand for ' + (afOpenDeviceId || '').slice(0, 8);
        afQ('afInvSaved').className = 'af-ok';
        afLog('Inverts confirmed by hand — auto-framing enabled for ' + (afOpenDeviceId || '').slice(0, 8) + '.', 'af-ok');
        try { afdiag('inverts confirmed by hand — hold released'); } catch (e2) {}
      }
    });
  });

  // ---- pose model (dynamic import: a CDN failure must not kill the call) ---
  (async function afInitPose() {
    try {
      const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
      const fileset = await vision.FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      const make = (delegate) => vision.PoseLandmarker.createFromOptions(fileset, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
          delegate
        },
        runningMode: 'VIDEO', numPoses: 1,
        minPoseDetectionConfidence: 0.5, minTrackingConfidence: 0.5
      });
      try {
        afPose = await make('GPU');
        afQ('afPoseState').textContent = 'ready (GPU)';
        afLog('Pose model ready (GPU).', 'af-ok');
      } catch (e) {

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Training Call — Auto-Frame</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --line: #232830;
    --text: #e8eaed;
    --muted: #8b93a1;
    --accent: #4fd1c5;
    --danger: #e0556f;
    --warn: #e3b341;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    padding-top: calc(14px + env(safe-area-inset-top));
    padding-left: calc(18px + env(safe-area-inset-left));
    padding-right: calc(18px + env(safe-area-inset-right));
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
    transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.35s ease;
    max-height: 200px;
    overflow: hidden;
  }
  .title { font-size: 15px; font-weight: 600; letter-spacing: 0.2px; }
  .status {
    font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.live { background: var(--accent); animation: pulse 2s infinite; }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--danger); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(79,209,197,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(79,209,197,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,209,197,0); }
  }

  main {
    position: relative;
    flex: 1;
    background: #000;
    overflow: hidden;
    min-height: 0;
  }
  video#remote {
    width: 100%; height: 100%; object-fit: contain; background: #000;
    touch-action: none;
    transform-origin: center center;
  }
  video#local {
    position: absolute;
    width: 19%;
    max-width: 150px;
    min-width: 84px;
    right: calc(14px + env(safe-area-inset-right));
    bottom: calc(14px + env(safe-area-inset-bottom));
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #000;
    transform: scaleX(-1);
    transition: width 0.2s ease, height 0.2s ease, opacity 0.2s ease, border-radius 0.2s ease;
    cursor: pointer;
  }
  /* Tapping the self-preview shrinks it to a small, mostly-out-of-the-way
     circle — useful when it's sitting on top of something the trainer
     needs to see. Tap again to restore. */
  video#local.minimized {
    width: 44px !important;
    max-width: 44px !important;
    min-width: 44px !important;
    height: 44px !important;
    border-radius: 50%;
    opacity: 0.6;
    object-fit: cover;
  }
  .placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted); text-align: center; padding: 0 24px;
  }
  .placeholder .big { font-size: 16px; color: var(--text); }
  .placeholder .small { font-size: 13px; max-width: 320px; }

  footer {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    padding-left: calc(16px + env(safe-area-inset-left));
    padding-right: calc(16px + env(safe-area-inset-right));
    border-top: 1px solid var(--line);
    flex-shrink: 0;
    background: var(--panel);
    transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.35s ease;
    max-height: 340px;
    overflow: hidden;
  }

  /* Fullscreen auto-hide: header/footer collapse away after a few seconds of
     inactivity so the video fills the screen, and fade back in on any
     mouse move, tap, or keypress. */
  body.chrome-hidden header,
  body.chrome-hidden footer {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
    padding-bottom: 0;
    border-color: transparent;
  }
  select {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; max-width: 170px;
  }
  button {
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 500;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.active-off { background: rgba(224,85,111,0.15); border-color: var(--danger); color: var(--danger); }
  button.primary { background: var(--accent); color: #06201d; border-color: var(--accent); }
  button.primary.end { background: var(--danger); border-color: var(--danger); color: #fff; }
  button:disabled { opacity: 0.4; cursor: default; }

  .controls-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }

  @media (max-width: 520px) {
    select { max-width: 130px; font-size: 12px; }
    button { padding: 9px 12px; font-size: 13px; }
  }

  /* ===== DIAGNOSTICS MODULE: CSS START =====
     Everything between these markers can be deleted as a block to fully
     remove the low-bandwidth toggle's styling. It does not affect any
     other rule above it. */
  .subtle-row { opacity: 0.65; }
  .subtle-row button {
    padding: 6px 12px; font-size: 12px; border-radius: 8px;
  }
  /* ===== DIAGNOSTICS MODULE: CSS END ===== */

  /* ===== CAMERA NAMING MODULE: CSS START =====
     Styling for the "Name Camera" panel. Delete this block (and the
     matching HTML / JS blocks) to remove the feature entirely. */
  #cameraNamePanel { flex-wrap: wrap; }
  #cameraNamePanel[hidden] { display: none; } /* without this, .controls-row's display:flex wins the tie and the panel never actually hides */
  .cam-name-label { font-size: 11px; color: var(--muted); width: 100%; text-align: center; }
  /* ===== CAMERA NAMING MODULE: CSS END ===== */

  /* ===== CAMERA REMOTE SWITCH MODULE: CSS START =====
     A small floating bar over the top of the remote video, showing one
     button per camera the OTHER side has available, so either person can
     ask the other side to switch cameras without touching their own
     dropdown. Delete this block (and the matching HTML/JS blocks) to
     remove the feature entirely. */
  #camSwitchOverlay {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    gap: 8px;
    max-width: calc(100% - 24px);
    overflow-x: auto;
    background: rgba(20,23,28,0.78);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px;
  }
  #camSwitchOverlay[hidden] { display: none; }
  #camSwitchOverlay button {
    padding: 7px 12px; font-size: 12px; border-radius: 8px; white-space: nowrap; flex-shrink: 0;
  }
  #camSwitchOverlay button.cam-switch-active {
    border-color: var(--accent); color: var(--accent);
  }
  /* ===== CAMERA REMOTE SWITCH MODULE: CSS END ===== */
</style>
</head>
<body>

<header>
  <div class="title">Training Call</div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Not connected</span></div>
</header>

<main>
  <video id="remote" autoplay playsinline></video>
  <div class="placeholder" id="placeholder">
    <div class="big">Connecting…</div>
    <div class="small" id="placeholderSub">This starts automatically. Send this same link to the other side — whoever opens it second connects the call.</div>
  </div>
  <video id="local" autoplay playsinline muted></video>
  <!-- ===== CAMERA REMOTE SWITCH MODULE: overlay START =====
       Populated at runtime with one button per camera the other side
       reports having. Hidden whenever the other side has fewer than 2
       cameras (nothing useful to switch to). -->
  <div id="camSwitchOverlay" hidden></div>
  <!-- ===== CAMERA REMOTE SWITCH MODULE: overlay END ===== -->
</main>

<footer>
  <div class="controls-row">
    <select id="cameraSelect" title="Camera"></select>
    <select id="micSelect" title="Microphone"></select>
  </div>
  <div class="controls-row">
    <button id="muteBtn">Mute</button>
    <button id="camBtn">Camera off</button>
    <button id="fullscreenBtn">Fullscreen</button>
    <button id="callBtn" class="primary">Start Call</button>
  </div>
  <!-- ===== DIAGNOSTICS MODULE: bandwidth toggle button START =====
       Delete this whole <div> to remove the low-bandwidth control from
       the page. No other markup depends on it. -->
  <div class="controls-row subtle-row">
    <button id="bandwidthBtn" title="Lower outgoing video quality to save bandwidth">Low Bandwidth: Off</button>
  </div>
  <!-- ===== DIAGNOSTICS MODULE: bandwidth toggle button END ===== -->

  <!-- ===== CAMERA NAMING MODULE: controls START =====
       Lets you assign a persistent custom name (e.g. "GymE-1") to whichever
       camera is currently selected in the dropdown above — useful when two
       cameras are the same model and the browser shows the same generic
       label for both. Delete this whole block (both <div> rows) plus the
       matching CSS and JS blocks to remove the feature; nothing else
       depends on it. -->
  <div class="controls-row subtle-row">
    <button id="nameCameraBtn" title="Give the currently selected camera a custom name">Name Camera</button>
  </div>
  <div class="controls-row subtle-row" id="cameraNamePanel" hidden>
    <span class="cam-name-label" id="cameraNamePanelLabel"></span>
    <button class="cam-name-preset" data-name="GymE-1">GymE-1</button>
    <button class="cam-name-preset" data-name="GymE-2">GymE-2</button>
    <button id="cameraNameCustomBtn">Custom…</button>
    <button id="cameraNameClearBtn">Clear name</button>
    <button id="cameraNameCancelBtn">Cancel</button>
  </div>
  <!-- ===== CAMERA NAMING MODULE: controls END ===== -->

  <!-- ===== SELF-VIEW POPOUT MODULE: controls START =====
       Opens your own camera feed in a plain separate window near the main
       screen — drag/resize it onto a second monitor manually. Shows the
       UNMIRRORED feed: the small preview above is flipped via CSS for
       comfort, but this window (like the feed Maria actually receives) is
       not. Delete this whole <div> plus the matching JS block near the end
       of the script to remove the feature; nothing else depends on it. -->
  <div class="controls-row subtle-row">
    <button id="popoutBtn" title="Open your camera feed in a separate window you can drag to a second monitor">Pop Out My View</button>
  </div>
  <!-- ===== SELF-VIEW POPOUT MODULE: controls END ===== -->
</footer>

<script>
(() => {
  const remoteVideo = document.getElementById('remote');
  const localVideo = document.getElementById('local');
  const cameraSelect = document.getElementById('cameraSelect');
  const micSelect = document.getElementById('micSelect');
  const muteBtn = document.getElementById('muteBtn');
  const camBtn = document.getElementById('camBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const callBtn = document.getElementById('callBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const placeholder = document.getElementById('placeholder');
  const placeholderSub = document.getElementById('placeholderSub');

  const LS_CAMERA = 'trainingCall:cameraId';
  const LS_MIC = 'trainingCall:micId';
  const LS_HAS_CONNECTED = 'trainingCall:hasConnectedBefore';
  const LS_CLIENT_ID = 'trainingCall:clientId';

  // SEAT-SWAP MODULE: a persistent per-device identity, so a reconnect (Wi-Fi
  // drop, page refresh, launcher relaunch) can be recognized by the server as
  // "this same client coming back" instead of a second, competing device.
  // Stored in localStorage so it survives refreshes and relaunches on this
  // profile (see ops/gymcam-dualcam-remap-launch.sh's persistent
  // --user-data-dir). Generated once; reused forever after.
  function getOrCreateClientId() {
    try {
      let id = localStorage.getItem(LS_CLIENT_ID);
      if (id) return id;
      id = (window.crypto && typeof window.crypto.randomUUID === 'function')
        ? window.crypto.randomUUID()
        : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
      localStorage.setItem(LS_CLIENT_ID, id);
      return id;
    } catch (e) {
      // localStorage unavailable (private mode, etc.) — fall back to a
      // per-load id. Reconnects in this session just won't be recognized;
      // behavior degrades to the pre-seat-swap "anonymous seat" path.
      return (window.crypto && typeof window.crypto.randomUUID === 'function')
        ? window.crypto.randomUUID()
        : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    }
  }
  const clientId = getOrCreateClientId();

  const params = new URLSearchParams(location.search);
  const room = params.get('room') || 'gym';

  // FAMILY-FOOLPROOF BRIDGE — Guarantee A (PER-CAMERA). The native launcher
  // resolves cameras by stable USB serial at the OS layer and appends inv=door.
  // Two PIXYs need DIFFERENT inverts: the door (GymE-2) is tilt ON / pan ON, the
  // rack (GymE-1) is tilt ON / pan OFF (measured — the rack genuinely differs on
  // pan). See the ORDER-KEYED note immediately below for how each camera's pair is
  // now selected — by enumeration POSITION, launcher-pinned by serial — superseding
  // the earlier deviceId-hash map, which a cold boot could silently cross-wire.
  // Guarantee A (PER-CAMERA, ORDER-KEYED) — identity by enumeration POSITION,
  // not by deviceId. The serial-resolving launcher (gymcam-dualcam-remap-launch.sh)
  // pins the physical DOOR onto /dev/video0 and the RACK onto /dev/video2 by
  // hardware serial on every launch, so the browser ALWAYS enumerates door first,
  // rack second — regardless of how a cold boot re-shuffled USB. We therefore key
  // each camera's invert pair + role name off its INDEX in the enumerated list
  // (which the launcher controls) instead of off the deviceId hash (which it does
  // not). deviceId is HMAC(salt, /dev/videoN): it names the node NUMBER, not the
  // camera — proven 2026-08-01 by lens-cover under the remap. A cold-boot swap moves
  // which camera sits on video0 but not the hash string on video0, which is exactly
  // why deviceId-keying broke and index-keying cannot. deviceId is still used as a
  // within-session handle for getUserMedia + the camera-switch messages, where it is
  // perfectly stable. Param absent -> the page behaves exactly as the base build.
  const AF_FORCE_MODE = (params.get('inv') === 'door');
  // ===== TELEMETRY MODULE: gym/trainer role latch ===========================
  // Declared immediately after AF_FORCE_MODE, before any afdiag() call exists,
  // so telemIsTrainer() is safe to call from the very first afdiag() line.
  // Starts from AF_FORCE_MODE (set only by the gym launcher's ?inv=door) and
  // latches true the first time a PTZ (tilt-capable) camera is adopted -- see
  // the 1s telemetry tick below. Never reverts once true.
  let telemIsGym = AF_FORCE_MODE;
  const telemIsTrainer = () => !telemIsGym;
  // State for the log-stream/heartbeat/sigprobe module below -- declared here,
  // alongside the role latch, so every value exists before any afdiag() call
  // (afdiag()'s enqueue hook reads telemIsTrainer() from its very first
  // invocation in the page's startup sequence).
  const TELEM_LS_QUEUE = 'telemLogQueue_v1';
  const TELEM_QUEUE_MAX = 2000;       // in-memory queue cap -- oldest lines drop first
  const TELEM_STALE_MS = 6 * 60 * 60 * 1000; // discard queued lines older than 6h on load
  const TELEM_CHUNK_MAX_LINES = 50;   // at most this many lines per control-channel message
  const TELEM_CHUNK_MAX_BYTES = 8192; // ...and stop adding lines past ~8KB of JSON
  const TELEM_BUFFERED_AMOUNT_MAX = 65536; // skip sending this tick if channel backlog >= 64KB
  let telemQueue = [];                // lines not yet sent (or not yet confirmed sent)
  let telemQueueDirty = false;        // set on any mutation; cleared once mirrored
  let telemHbSeq = 0;
  let telemHbLastAt = 0;
  let telemSigprobeSeq = 0;
  // ===== TELEMETRY MODULE END (role latch) ===================================
  // ===== LOGSTREAM MODULE: state (gym -> localhost session receiver) ==========
  // Declared here, next to the role latch, for the same reason as TELEM_* above:
  // the hook inside afdiagFlush() reads it from the very first flush. Gym role
  // only (telemIsGym). ?logsink= overrides the sink for benching, loopback only.
  const LOGSINK_URL = (() => {
    try {
      const u = new URL(params.get('logsink') || '');
      if (/^https?:$/.test(u.protocol) && /^(127\.0\.0\.1|localhost|\[::1\])$/.test(u.hostname)) return u.href;
    } catch (e) {}
    return 'http://127.0.0.1:4010/log';
  })();
  const LOGSINK_TICK_MS = 5000;          // batch interval
  const LOGSINK_MAX_LINES = 100;         // per POST
  const LOGSINK_MAX_BYTES = 32768;       // per POST (UTF-8 JSON body)
  const LOGSINK_POSTS_PER_TICK = 10;     // lets a backlog drain faster than 100 lines / 5s
  const LOGSINK_QUEUE_MAX = 5000;        // in-memory cap while unreachable -- oldest drop first
  const LOGSINK_BACKOFF_MIN_MS = 15000;
  const LOGSINK_BACKOFF_MAX_MS = 60000;
  const LOGSINK_TIMEOUT_MS = 10000;      // abort a hung POST
  const LOGSINK_LINGER_MS = 120000;      // keep streaming this long after the last peer leaves
  const LOGSINK_PREROLL_MS = 120000;     // while idle, hold only the last 2 min (sent when a call starts)
  const LOGSINK_END_GIVEUP_MS = 600000;  // stop retrying an undelivered end marker after 10 min
  let logsinkQueue = [];                 // lines not yet confirmed by the receiver
  let logsinkMode = 'idle';              // 'idle' | 'live' | 'ending'
  let logsinkLastPeerAt = 0;             // last tick a peer was connected
  let logsinkEndingSince = 0;
  let logsinkBusy = false;               // one POST sequence at a time
  let logsinkNextAt = 0;                 // backoff: no POST before this
  let logsinkBackoff = 0;
  let logsinkFailing = false;            // one diagnostic per outage, one per recovery
  let logsinkFailCount = 0;
  let logsinkDropped = 0;                // lines dropped by the queue cap (running total)
  let logsinkDroppedAtFail = 0;
  // ===== LOGSTREAM MODULE END (state) =========================================
  //  index : { t: invertTilt, p: invertPan, role: display name }
  const AF_ROLE_BY_INDEX = AF_FORCE_MODE ? [
    { t: true, p: true,  role: 'Door' },   // index 0 — launcher pins the door here (pan ON)
    { t: true, p: false, role: 'Rack' }    // index 1 — rack (pan OFF)
  ] : null;
  // Position of a deviceId in the current enumerated camera list. cameraSelect is
  // built in enumerate order by listDevices(); -1 if not found.
  function afCameraIndex(deviceId) {
    return [...cameraSelect.options].findIndex((o) => o.value === deviceId);
  }
  // Role/invert pair for a camera by its enumeration position. null in non-forced
  // mode; null for an out-of-range index (>=2 or not found) -> treated UNRECOGNISED.
  function afRoleFor(deviceId) {
    if (!AF_ROLE_BY_INDEX) return null;
    const i = afCameraIndex(deviceId);
    return (i >= 0 && i < AF_ROLE_BY_INDEX.length) ? AF_ROLE_BY_INDEX[i] : null;
  }
  // Fallback for a camera whose position is out of range (should not happen under
  // the remap launcher, which presents exactly two). pan:false so it cannot run
  // away on pan; auto-framing is separately HELD.
  const AF_FORCE_FALLBACK = { t: true, p: false };
  let afInvUnconfirmed = false;  // set true when an unrecognised camera is adopted
  console.log('[build] index-effortfix 2026-11-12 — inv=' +
    (params.get('inv') || '(none)') + (AF_FORCE_MODE ? ' (order-keyed: index0=Door, index1=Rack)' : ''));

  // Google's public STUN servers — free, no signup, fine for most home networks.
  // ICE tries these (and any direct path) first; they're enough for wifi-to-wifi calls.
  //
  // TURN fallback (Metered.ca free tier, 20GB/month) — only used if a direct/STUN
  // path can't be found (e.g. restrictive cellular networks). Credentials below are
  // tied to our free account quota, not a security secret — TURN creds are meant to
  // ship to the client, that's how the protocol works. If the call connects fine
  // without it (most sessions will), these entries simply go unused.
  const ICE_SERVERS = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun.relay.metered.ca:80' },
    {
      urls: 'turn:standard.relay.metered.ca:80',
      username: '3781fe1f6d857864a846de77',
      credential: 'epirZplvHuT7vJb1'
    },
    {
      urls: 'turn:standard.relay.metered.ca:80?transport=tcp',
      username: '3781fe1f6d857864a846de77',
      credential: 'epirZplvHuT7vJb1'
    },
    {
      urls: 'turn:standard.relay.metered.ca:443',
      username: '3781fe1f6d857864a846de77',
      credential: 'epirZplvHuT7vJb1'
    },
    {
      urls: 'turns:standard.relay.metered.ca:443?transport=tcp',
      username: '3781fe1f6d857864a846de77',
      credential: 'epirZplvHuT7vJb1'
    }
  ];

  let localStream = null;
  let pc = null;
  let ws = null;
  let inCall = false;
  let roomFull = false; // set on server 'full' -- gates the room-busy retry loop below
  let replaced = false; // SEAT-SWAP MODULE: set on server 'replaced' -- this tab was swapped out by our own reconnect elsewhere; never auto-retry
  let pendingCandidates = [];
  let amCaller = false; // only the caller initiates ICE restarts, to avoid both sides colliding
  let controlChannel = null; // CAMERA REMOTE SWITCH MODULE: data channel for cross-side camera control
  let wsOpenedAt = 0; // TELEMETRY MODULE: wall-clock ms when the current ws opened, for TELEM-HB wsAge
  // PINGPONG MODULE: app-level signaling liveness (see the PINGPONG block below
  // the TELEMETRY module). Declared here so onopen/onmessage can touch them.
  let pingSeq = 0;
  let lastPongAt = 0;    // pong baseline -- reset on ws open and on tab-visible
  let lastRtt = null;    // ms, from the most recent pong
  let pongSeen = false;  // latches true on the first pong ever: proves the server speaks ping/pong
  let probe = null;      // in-flight check ping after a long hide: { seq, socket, hiddenFor, timer }
  let disconnectTimer = null;
  let iceRestartAttempts = 0;
  const MAX_ICE_RESTARTS = 4;

  // RECOVER MODULE: consolidated single-timer signaling retry (replaces the old
  // untracked ws.onclose setTimeout + the separate roomFullRetryTimer -- both could
  // fire independently and open a second concurrent socket sharing the same cid,
  // which is what produced the spurious REPLACED eviction on 2026-09-27).
  let signalRetryTimer = null;
  let signalRetryAttempt = 0;
  const SIGNAL_RETRY_BASE_MS = 1000;
  const SIGNAL_RETRY_MAX_MS = 30000;
  const SIGNAL_RETRY_MAX_EXPONENT = 6;
  let rebuildingPc = false; // guards attemptIceRestart() vs rebuildPeerConnection() from racing each other
  let joinOfferSent = false; // guards against a duplicate offer from a 'request-offer' arriving mid-join
  // CONTROL MODULE: what the in-flight join offer was -- 'fresh' (new pc, new
  // control channel) or 'ice-restart' (the old pc, whose channel a brand-new
  // remote pc can never receive). A 'request-offer' overrides only the latter.
  let joinOfferKind = null;
  // CONTROL MODULE: every offer carries an id (oid) that the answer echoes, so
  // an answer to an offer from a pc we have since replaced is ignored. A peer
  // that does not echo it (older page) is answered as before.
  let lastOfferId = null;
  let pcGen = 0;            // counts peer connections, for the CONTROL log lines
  let hiddenAt = 0; // timestamp of the last visibilitychange -> hidden, for the forced-reconnect-after-hidden check
  const FORCE_RECONNECT_HIDDEN_MS = 10000;

  // RECOVER MODULE: paced media-rebuild ladder (separate from the fast ICE-restart
  // ladder below -- this paces REBUILDS specifically, so a sustained outage doesn't
  // hammer rebuild attempts back-to-back).
  let mediaRebuildAttempt = 0;
  let mediaRebuildTimer = null;
  const MEDIA_REBUILD_BASE_MS = 2000;
  const MEDIA_REBUILD_MAX_MS = 30000;

  // Pinch-to-zoom / double-tap-to-zoom on the remote video specifically.
  // This is deliberately implemented as our own CSS transform on the video
  // element rather than relying on the browser's page-level zoom (which we
  // disabled in the viewport meta tag, since native page zoom on a live
  // video stream caused freezes/disconnects). Scoping it to just this
  // element keeps the rest of the page (and the connection) untouched.
  let remoteZoom = 1;
  let remotePanX = 0;
  let remotePanY = 0;
  let pinchStartDist = 0;
  let pinchStartZoom = 1;
  let lastTapTime = 0;
  let lastTapX = 0;
  let lastTapY = 0;
  let panActive = false;
  let panStartX = 0;
  let panStartY = 0;
  let panOriginX = 0;
  let panOriginY = 0;
  const MAX_REMOTE_ZOOM = 4;
  const DOUBLE_TAP_ZOOM = 2.5;

  function setStatus(text, mode) {
    statusText.textContent = text;
    statusDot.className = 'dot' + (mode ? ' ' + mode : '');
  }

  function setPlaceholder(big, small, show) {
    placeholder.style.display = show ? 'flex' : 'none';
    if (big !== null) placeholder.querySelector('.big').textContent = big;
    if (small !== undefined && small !== null) placeholderSub.textContent = small;
  }

  async function listDevices() {
    // AF DIAGNOSTIC LOGGER: log-only -- distinguish the init call (no args)
    // from an ondevicechange-triggered call (browser passes the Event as the
    // first arg) without touching either call site below.
    const afdiagListReason = (arguments.length && arguments[0] && arguments[0].type === 'devicechange') ? 'devicechange' : 'init';
    const devices = await navigator.mediaDevices.enumerateDevices();
    const prevCam = cameraSelect.value || localStorage.getItem(LS_CAMERA);
    const prevMic = micSelect.value || localStorage.getItem(LS_MIC);
    cameraSelect.innerHTML = '';
    micSelect.innerHTML = '';
    let camCount = 0, micCount = 0;
    devices.forEach((d) => {
      if (d.kind === 'videoinput') {
        camCount++;
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Camera ${camCount}`;
        rawCameraLabels[d.deviceId] = opt.textContent; // CAMERA NAMING MODULE
        cameraSelect.appendChild(opt);
      } else if (d.kind === 'audioinput') {
        micCount++;
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || `Microphone ${micCount}`;
        micSelect.appendChild(opt);
      }
    });
    if (prevCam && [...cameraSelect.options].some((o) => o.value === prevCam)) cameraSelect.value = prevCam;
    if (prevMic && [...micSelect.options].some((o) => o.value === prevMic)) micSelect.value = prevMic;
    relabelCameraOptions(); // CAMERA NAMING MODULE: apply any saved custom camera names
    sendCameraList(); // CAMERA REMOTE SWITCH MODULE: let the other side know our current camera options
    // AF DIAGNOSTIC LOGGER: log-only -- full camera list + why this run
    // happened, so a "disappears from switcher" incident shows exactly what
    // enumerateDevices returned and whether it was init or a devicechange.
    try {
      const afdiagCamList = [...cameraSelect.options]
        .map((o) => (o.textContent || '(no label)') + ' [' + (o.value || '').slice(0, 8) + ']')
        .join(', ');
      afdiag('listDevices (' + afdiagListReason + ') — ' + camCount + ' camera(s): ' + (afdiagCamList || 'none'));
    } catch (e) {}
  }

  async function startLocalStream() {
    const videoId = cameraSelect.value || undefined;
    const audioId = micSelect.value || undefined;
    // AUTO-FRAME EDIT: pan/tilt/zoom:true asks for the PTZ capability so the
    // active track exposes motor control to applyConstraints(). This is what
    // triggers Chromium's SECOND permission prompt (camera-control), which is
    // invisible in --app= mode — launch this page in a normal window.
    const ptz = { pan: true, tilt: true, zoom: true };
    const baseVideo = { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } };
    const videoBase = videoId ? Object.assign({ deviceId: { exact: videoId } }, baseVideo) : Object.assign({}, baseVideo);
    const constraints = {
      video: Object.assign({}, videoBase, ptz),
      audio: audioId ? { deviceId: { exact: audioId } } : true
    };

    // If the PTZ request is refused outright, fall back to a plain stream so the
    // CALL still happens. Auto-framing is the feature; the call is the point.
    let newStream;
    try {
      newStream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (ptzErr) {
      newStream = await navigator.mediaDevices.getUserMedia({
        video: videoBase,
        audio: audioId ? { deviceId: { exact: audioId } } : true
      });
    }

    if (localStream) {
      localStream.getTracks().forEach((t) => t.stop());
    }
    localStream = newStream;
    localVideo.srcObject = localStream;
    popoutUpdateStream(); // SELF-VIEW POPOUT MODULE: keep the popped-out window's feed in sync with camera switches

    if (pc) {
      const videoTrack = localStream.getVideoTracks()[0];
      const audioTrack = localStream.getAudioTracks()[0];
      const senders = pc.getSenders();
      const vSender = senders.find((s) => s.track && s.track.kind === 'video');
      const aSender = senders.find((s) => s.track && s.track.kind === 'audio');
      if (vSender && videoTrack) vSender.replaceTrack(videoTrack);
      if (aSender && audioTrack) aSender.replaceTrack(audioTrack);
    }
  }

  async function init() {
    try {
      // Request permission once with defaults so device labels become visible,
      // then list devices properly.
      const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      tempStream.getTracks().forEach((t) => t.stop());
      await listDevices();
      navigator.mediaDevices.ondevicechange = listDevices;
      // Opening the page is meant to be the only step on repeat visits — but
      // on the very first visit from a given browser, skip the auto-start so
      // there's a calm window (with Safari's normal toolbar still visible)
      // to set up "Add to Home Screen" before the page takes over the screen.
      if (localStorage.getItem(LS_HAS_CONNECTED)) {
        startCallFlow();
      } else {
        setPlaceholder('Ready when you are', 'First time here: feel free to set up "Add to Home Screen" now, then tap Start Call. After this, it\'ll connect automatically every time.', true);
      }
    } catch (err) {
      setPlaceholder('Camera or microphone blocked', 'Allow camera and microphone access for this page in your browser settings, then reload.', true);
      setStatus('Permission needed', 'bad');
    }
  }

  function wsUrl() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    return `${proto}//${location.host}?room=${encodeURIComponent(room)}&cid=${encodeURIComponent(clientId)}`;
  }

  // RECOVER MODULE: single consolidated retry path (replaces the old untracked
  // ws.onclose setTimeout + the separate roomFullRetryTimer). Capped exponential
  // backoff with jitter; never gives up permanently.
  function computeBackoff(attempt) {
    const exp = Math.min(attempt, SIGNAL_RETRY_MAX_EXPONENT);
    const capped = Math.min(SIGNAL_RETRY_MAX_MS, SIGNAL_RETRY_BASE_MS * Math.pow(2, exp - 1));
    return Math.round(capped * (0.5 + Math.random() * 0.5)); // 50-100% jitter, avoids synchronized retries
  }

  function scheduleReconnect(reason) {
    if (!inCall || replaced) return;
    if (signalRetryTimer) return; // ONE timer only -- a second scheduling attempt in this window is a safe no-op
    signalRetryAttempt++;
    const delay = computeBackoff(signalRetryAttempt);
    afdiag('RECONNECT scheduled — reason=' + reason + ' attempt=' + signalRetryAttempt + ' delay=' + delay + 'ms');
    setStatus('Reconnecting… (attempt ' + signalRetryAttempt + ')', 'warn');
    signalRetryTimer = setTimeout(() => {
      signalRetryTimer = null;
      if (!inCall || replaced) return;
      connectSignaling();
    }, delay);
  }

  function cancelReconnect() {
    if (signalRetryTimer) { clearTimeout(signalRetryTimer); signalRetryTimer = null; }
  }

  function reconnectNow(reason, force) {
    if (!inCall || replaced) return;
    if (!force && ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    afdiag('RECONNECT-NOW trigger — reason=' + reason + ' force=' + !!force + ' wsState=' + (ws ? ws.readyState : 'null'));
    cancelReconnect();
    connectSignaling();
  }

  function connectSignaling() {
    if (ws) { try { ws.close(4001, 'superseded'); } catch (e) {} } // close the old one FIRST, always
    const mySocket = new WebSocket(wsUrl());
    ws = mySocket;

    mySocket.onopen = () => {
      if (mySocket !== ws) return;
      wsOpenedAt = Date.now(); // TELEMETRY MODULE: feeds TELEM-HB's wsAge field
      lastPongAt = Date.now(); // PINGPONG MODULE: fresh socket gets a full 40s before the watchdog can fire
      setStatus('Waiting for the other side to join…', 'warn');
    };

    mySocket.onmessage = async (event) => {
      if (mySocket !== ws) { afdiag('WS MESSAGE ignored (superseded socket)'); return; }
      const msg = JSON.parse(event.data);

      if (msg.type === 'joined') {
        afdiag('SIGNAL joined — peers=' + msg.peers);
        // SEAT-SWAP MODULE: being admitted at all means we were not turned
        // away for a full room this time -- clear any room-busy backoff
        // state left over from earlier retries.
        roomFull = false;
        cancelReconnect();
        if (signalRetryAttempt > 0) {
          afdiag('RECONNECT succeeded after ' + signalRetryAttempt + ' attempt(s)');
          setStatus('Reconnected', 'live');
        }
        signalRetryAttempt = 0;
        amCaller = (msg.peers === 2); // deterministic every join -- at most one side ever sees peers===2 for a given pairing
        joinOfferSent = false; // fresh join cycle -- reset the double-offer guard
        joinOfferKind = null;
        if (amCaller) {
          if (!pc) {
            joinOfferSent = true; // set BEFORE the awaits -- a 'request-offer' can arrive mid-await
            joinOfferKind = 'fresh';
            await createPeerConnection();
            await makeOffer();
          } else if (pc.connectionState !== 'connected' && pc.connectionState !== 'connecting') {
            afdiag('SIGNAL joined (rejoin) — pc state=' + pc.connectionState + ' — renegotiating');
            joinOfferSent = true; // set BEFORE the await, same reason
            joinOfferKind = 'ice-restart';
            await attemptIceRestart();
          }
          // else: pc looks connected/connecting -- leave it alone for now; if the other
          // side actually has nothing (single-sided-drop gap), its 'peer-joined' handler
          // will send us 'request-offer' and we act on it below.
        }
      } else if (msg.type === 'request-offer') {
        // Gap fix: the other side had no pc at all when it got our 'joined'/'peer-joined'
        // (torn down by an earlier 'peer-left' on its end) and our own pc merely LOOKED
        // connected above, so we never offered. Rebuild for real instead of waiting for
        // organic ICE failure detection.
        afdiag('SIGNAL request-offer received — amCaller=' + amCaller + ' pc=' + (pc ? pc.connectionState : 'null') + ' joinOfferSent=' + joinOfferSent +
          (joinOfferKind ? ' kind=' + joinOfferKind : '') + (msg.reason ? ' reason=' + msg.reason : ''));
        if (!amCaller) {
          afdiag('SIGNAL request-offer ignored — not the caller');
        } else if (msg.reason === 'control-missing') {
          // CONTROL MODULE: the other side has a connected pc but no control channel.
          controlRecover('peer request');
        } else if (joinOfferSent && joinOfferKind !== 'ice-restart') {
          afdiag('SIGNAL request-offer ignored — an offer for this join is already in flight');
        } else {
          // CONTROL MODULE: an ICE restart of our old pc cannot give the other
          // side's brand-new pc a control channel; rebuild instead.
          if (joinOfferSent) afdiag('SIGNAL request-offer — the offer in flight was an ICE restart of the old pc; rebuilding');
          joinOfferSent = true;
          joinOfferKind = 'fresh';
          await rebuildPeerConnection('request-offer');
        }
      } else if (msg.type === 'peer-joined') {
        afdiag('SIGNAL peer-joined');
        if (pc && pc.connectionState === 'connected') {
          setStatus('Connected', 'live');
        } else {
          setStatus('Other side joined — connecting…', 'warn');
        }
        amCaller = false; // the side that just joined (peers===2 on ITS OWN 'joined') is the caller, never us
        if (!pc) {
          await createPeerConnection();
          afdiag('SIGNAL peer-joined — no local pc, requesting fresh offer');
          send({ type: 'request-offer' });
        } else if (pc.connectionState !== 'connected' && pc.connectionState !== 'connecting') {
          afdiag('SIGNAL peer-joined — pc state=' + pc.connectionState + ' (not our role to offer; waiting for their offer)');
        }
        // else: pc already connected/connecting -- both sides kept a live pc (e.g. a pure
        // signaling-server restart); leave it alone.
      } else if (msg.type === 'offer') {
        afdiag('SIGNAL offer received' + (pc ? ' — local pc state=' + pc.connectionState : ' — no local pc'));
        if (pc && (pc.connectionState === 'failed' || pc.connectionState === 'closed')) {
          // Callee-side offer-reset: a fresh offer arrived while our own pc is dead --
          // this is the caller's rebuild landing here. Reset locally so we never answer
          // into a dead pc. No new signaling message needed; inferred purely from our
          // own pc.connectionState. Preserve amCaller (teardownPeerConnection zeroes it).
          afdiag('SIGNAL offer — local pc state=' + pc.connectionState + ' — resetting before answering');
          const wasCaller = amCaller;
          teardownPeerConnection();
          amCaller = wasCaller;
        }
        // CONTROL MODULE: an offer from a different peer session (the other
        // side rebuilt its pc) gets a fresh pc here too, so its new control
        // channel arrives; an ICE restart keeps its session id and is unaffected.
        if (pc && pc.remoteDescription && controlSdpSession(msg.sdp) &&
            controlSdpSession(msg.sdp) !== controlSdpSession(pc.remoteDescription.sdp)) {
          afdiag('SIGNAL offer from a new peer session — resetting before answering');
          const wasCaller = amCaller;
          teardownPeerConnection();
          amCaller = wasCaller;
        }
        if (!pc) await createPeerConnection();
        await pc.setRemoteDescription(new RTCSessionDescription(msg));
        await flushPendingCandidates();
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send(msg.oid ? { type: 'answer', sdp: answer.sdp, oid: msg.oid } : { type: 'answer', sdp: answer.sdp });
      } else if (msg.type === 'answer') {
        if (msg.oid && lastOfferId && msg.oid !== lastOfferId) {
          afdiag('SIGNAL answer ignored — it answers an offer from a pc since replaced');   // CONTROL MODULE
          return;
        }
        afdiag('SIGNAL answer received');
        await pc.setRemoteDescription(new RTCSessionDescription(msg));
        await flushPendingCandidates();
      } else if (msg.type === 'candidate') {
        if (pc && pc.remoteDescription) {
          try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (e) {}
        } else {
          pendingCandidates.push(msg.candidate);
        }
      } else if (msg.type === 'peer-left') {
        afdiag('SIGNAL peer-left');
        setStatus('Other side disconnected', 'warn');
        setPlaceholder('Call ended', 'The other side left. Tap Start Call to begin a new session.', true);
        teardownPeerConnection();
      } else if (msg.type === 'replaced') {
        // SEAT-SWAP MODULE: the server saw another connection with this same
        // device's clientId join this room (our own reconnect, a refresh, or
        // another tab/window here) and evicted this socket's seat in its
        // favor. Stand DOWN, do not retry -- retrying would just evict that
        // new occupant right back, and the two could ping-pong forever.
        afdiag('SIGNAL replaced — standing down, no retry');
        replaced = true;
        cancelReconnect();
        inCall = false;
        callBtn.textContent = 'Start Call';
        callBtn.classList.remove('end');
        // Close the old pc BEFORE the final setStatus below. Left open, it
        // keeps running its own lifecycle (the far side is gone, so it drifts
        // to 'disconnected' then 'failed' on its own timeline) and its
        // onconnectionstatechange handler would overwrite "Call moved" with
        // "Connection wobbling…" / "Connection lost — reconnecting…" minutes
        // later, plus attemptIceRestart() would fire pointlessly. teardown
        // also clears disconnectTimer so that queued restart never runs.
        teardownPeerConnection();
        // Release the camera/mic and clear the local preview -- this tab is
        // no longer part of any call, so it has no business holding the
        // devices. startLocalStream() re-acquires them from scratch the next
        // time this tab's Start Call is pressed (startCallFlow() only calls
        // it when localStream is null).
        if (localStream) {
          localStream.getTracks().forEach((t) => t.stop());
          localStream = null;
        }
        localVideo.srcObject = null;
        setStatus('Taken over by another window', 'warn');
        setPlaceholder('Call moved', 'This call was taken over by another window or reconnect on this device. Tap Start Call here only if you want to use this window instead.', true);
      } else if (msg.type === 'full') {
        // SEAT-SWAP MODULE: a full room is often a stale seat that just
        // hasn't been cleaned up yet (heartbeat sweep, or the other side's
        // own reconnect still in flight) rather than a permanent state, so
        // keep retrying through the single consolidated retry path -- never
        // give up permanently.
        afdiag('SIGNAL full — room busy');
        roomFull = true;
        setStatus('Room busy — retrying…', 'warn');
        setPlaceholder('Room busy', 'This link is already open on two devices. Retrying automatically…', true);
        scheduleReconnect('room-full');
      } else if (msg.type === 'sigprobe') {
        // TELEMETRY MODULE: gym-side arrival of the trainer's signaling-path
        // probe. Purely additive leaf -- no existing branch above is touched.
        afdiagIngestRemote('SIGPROBE seq=' + msg.seq);
      } else if (msg.type === 'pong') {
        // PINGPONG MODULE: server's reply to our own ping (never relayed from the peer).
        const now = Date.now();
        lastPongAt = now;
        pongSeen = true;
        if (typeof msg.t === 'number') lastRtt = now - msg.t;
        if (lastRtt !== null && lastRtt > 2000) afdiag('PONG seq=' + msg.seq + ' rtt=' + lastRtt + 'ms (slow)');
        pongProbeAnswered(msg.seq, lastRtt);
      }
    };

    mySocket.onclose = (event) => {
      if (mySocket !== ws) { afdiag('WS CLOSE ignored (superseded socket) — code=' + event.code); return; }
      afdiag('WS CLOSE — code=' + event.code + ' reason=' + (event.reason || '(none)') + ' wasClean=' + event.wasClean);
      if (inCall && !replaced) setStatus('Signaling lost — retrying…', 'bad');
      scheduleReconnect('ws-close');
    };

    mySocket.onerror = () => {
      if (mySocket !== ws) return;
      afdiag('WS ERROR');
      // SEAT-SWAP MODULE: once this tab has been replaced, its status is
      // final ("Call moved") -- don't let a trailing socket-error event
      // (the server closing this socket right after 'replaced' can trigger
      // one in some browsers) overwrite it.
      if (replaced) return;
      setStatus('Connection error', 'bad');
    };
  }

  function send(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(msg)); return; }
    // Narrow, zero-guesswork item-(c) fix: this is a PROVEN failure (we tried to send and
    // the socket isn't usable), not a heuristic -- convert it into a real recovery trigger
    // instead of silently dropping the message as before.
    afdiag('SEND dropped — ws not open (state=' + (ws ? ws.readyState : 'null') + ') for type=' + (msg && msg.type));
    reconnectNow('send-while-not-open');
  }

  async function flushPendingCandidates() {
    for (const c of pendingCandidates) {
      try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
    }
    pendingCandidates = [];
  }

  async function createPeerConnection() {
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    pcGen++;   // CONTROL MODULE

    localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

    // ===== CAMERA REMOTE SWITCH MODULE: open/receive the control channel =====
    // Whichever side makes the offer also opens the data channel; the other
    // side receives it via ondatachannel. Either way, setupControlChannel()
    // wires up the same send/receive logic once it's ready.
    if (amCaller) {
      controlChannel = pc.createDataChannel('control');
      setupControlChannel();
    }
    pc.ondatachannel = (event) => {
      if (event.channel.label === 'control') {
        controlChannel = event.channel;
        setupControlChannel();
      }
    };
    // ===== CAMERA REMOTE SWITCH MODULE END =====

    pc.onicecandidate = (event) => {
      if (event.candidate) send({ type: 'candidate', candidate: event.candidate });
    };

    pc.ontrack = (event) => {
      remoteVideo.srcObject = event.streams[0];
      setPlaceholder(null, null, false);
    };

    pc.onconnectionstatechange = () => {
      if (!pc) return;
      afdiag('PC connectionState=' + pc.connectionState);
      if (pc.connectionState === 'connected') {
        setStatus('Connected', 'live');
        setPlaceholder(null, null, false);
        clearTimeout(disconnectTimer);
        iceRestartAttempts = 0; // reset once the connection is stably back
        mediaRebuildAttempt = 0;
        clearTimeout(mediaRebuildTimer);
        mediaRebuildTimer = null;
        localStorage.setItem(LS_HAS_CONNECTED, 'true');
      } else if (pc.connectionState === 'disconnected') {
        // 'disconnected' often self-heals within a few seconds (a brief
        // Wi-Fi blip, a tab losing focus momentarily, etc.) — give it a
        // short grace period before trying anything ourselves.
        setStatus('Connection wobbling — recovering…', 'warn');
        clearTimeout(disconnectTimer);
        disconnectTimer = setTimeout(attemptIceRestart, 4000);
      } else if (pc.connectionState === 'failed') {
        setStatus('Connection lost — reconnecting…', 'bad');
        clearTimeout(disconnectTimer);
        attemptIceRestart();
      } else if (pc.connectionState === 'connecting') {
        setStatus('Connecting…', 'warn');
      }
    };

    // RECOVER MODULE: log-only -- deliberately does not drive any recovery decision of
    // its own, so there is only ever one state machine (onconnectionstatechange above)
    // deciding when to act.
    pc.oniceconnectionstatechange = () => {
      if (!pc) return;
      afdiag('PC iceConnectionState=' + pc.iceConnectionState);
    };
  }

  async function attemptIceRestart(force) {
    if (!pc || !amCaller) return; // only the caller renegotiates, to avoid both sides colliding
    if (!force && pc.connectionState === 'connected') return; // already recovered on its own
    if (rebuildingPc) return; // a rebuild is already in flight -- don't collide with it
    if (iceRestartAttempts >= MAX_ICE_RESTARTS) {
      afdiag('ICE RESTART exhausted (' + iceRestartAttempts + ' attempts) — falling back to paced rebuild');
      scheduleMediaRebuild('ice-restart-exhausted');
      return;
    }
    iceRestartAttempts++;
    afdiag('ICE RESTART attempt ' + iceRestartAttempts + '/' + MAX_ICE_RESTARTS);
    try {
      const offer = await pc.createOffer({ iceRestart: true });
      await pc.setLocalDescription(offer);
      lastOfferId = controlOfferId();
      send({ type: 'offer', sdp: offer.sdp, oid: lastOfferId });
    } catch (e) {
      afdiag('ICE RESTART error — ' + (e && e.message));
      // If this attempt fails to even start, the next state-change event
      // (or the timer above) will trigger another try, up to the cap.
    }
  }

  // RECOVER MODULE: paced media-rebuild ladder. Rebuilds (not individual ICE-restart
  // attempts) are spaced by a capped, jittered backoff so a sustained outage doesn't
  // hammer rebuild attempts back-to-back. Reset to 0 on a stable 'connected' above.
  function computeMediaBackoff(attempt) {
    const exp = Math.min(attempt, 6);
    const capped = Math.min(MEDIA_REBUILD_MAX_MS, MEDIA_REBUILD_BASE_MS * Math.pow(2, exp - 1));
    return Math.round(capped * (0.5 + Math.random() * 0.5));
  }

  function scheduleMediaRebuild(trigger) {
    if (!amCaller || mediaRebuildTimer) return;
    mediaRebuildAttempt++;
    const delay = computeMediaBackoff(mediaRebuildAttempt);
    afdiag('MEDIA REBUILD scheduled — trigger=' + trigger + ' attempt=' + mediaRebuildAttempt + ' delay=' + delay + 'ms');
    mediaRebuildTimer = setTimeout(() => { mediaRebuildTimer = null; rebuildPeerConnection(trigger); }, delay);
  }

  async function rebuildPeerConnection(trigger) {
    if (!amCaller || rebuildingPc) return; // same one-side-only discipline as attemptIceRestart
    rebuildingPc = true;
    afdiag('MEDIA REBUILD start — trigger=' + trigger + ' iceRestartAttempts=' + iceRestartAttempts);
    setStatus('Rebuilding connection…', 'warn');
    try {
      const wasCaller = amCaller; // teardownPeerConnection() unconditionally resets amCaller=false -- capture first
      teardownPeerConnection();
      amCaller = wasCaller; // restore role so makeOffer() below still runs on the right side
      iceRestartAttempts = 0; // fresh ICE-restart budget for the new pc's own lifecycle
      if (!localStream) { afdiag('MEDIA REBUILD aborted — no local stream'); return; }
      await createPeerConnection();
      await makeOffer();
      afdiag('MEDIA REBUILD offer sent');
    } catch (e) {
      afdiag('MEDIA REBUILD error — ' + (e && e.message));
    } finally {
      rebuildingPc = false;
    }
  }

  async function makeOffer() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    lastOfferId = controlOfferId();
    send({ type: 'offer', sdp: offer.sdp, oid: lastOfferId });
  }

  function teardownPeerConnection() {
    if (pc) { pc.close(); pc = null; }
    remoteVideo.srcObject = null;
    pendingCandidates = [];
    clearTimeout(disconnectTimer);
    amCaller = false;
    iceRestartAttempts = 0;
    resetRemoteZoom();
    // CAMERA REMOTE SWITCH MODULE: the channel dies with the old pc, and any
    // buttons we were showing described a connection that no longer exists.
    controlChannel = null;
    camSwitchOverlay.hidden = true;
    camSwitchOverlay.innerHTML = '';
  }

  async function startCallFlow() {
    if (inCall) return;
    roomFull = false; // a deliberate Start Call clears any prior room-full stand-down
    cancelReconnect();
    signalRetryAttempt = 0;
    replaced = false; // SEAT-SWAP MODULE: a deliberate Start Call clears any prior seat-swap stand-down
    inCall = true;
    callBtn.textContent = 'End Call';
    callBtn.classList.add('end');
    setPlaceholder('Connecting…', 'Waiting for the other side to join…', true);
    try {
      if (!localStream) await startLocalStream();
      connectSignaling();
    } catch (err) {
      setStatus('Could not access camera/mic', 'bad');
      inCall = false;
      callBtn.textContent = 'Start Call';
      callBtn.classList.remove('end');
    }
  }

  function endCallFlow() {
    inCall = false;
    cancelReconnect(); // a manual End Call also cancels any pending reconnect
    clearTimeout(mediaRebuildTimer);
    mediaRebuildTimer = null;
    callBtn.textContent = 'Start Call';
    callBtn.classList.remove('end');
    teardownPeerConnection();
    if (ws) { ws.close(); ws = null; }
    setStatus('Not connected', '');
    setPlaceholder('Call ended', 'Tap Start Call to begin a new session.', true);
  }

  callBtn.addEventListener('click', () => {
    if (!inCall) startCallFlow(); else endCallFlow();
  });

  // RECOVER MODULE: reconnect triggers beyond the passive retry timer -- if the tab
  // comes back into view/focus, or the network comes back, check right now instead of
  // waiting for the backoff timer.
  document.addEventListener('visibilitychange', () => {
    afdiag('PAGE visibilitychange — state=' + document.visibilityState);
    if (document.visibilityState === 'hidden') {
      hiddenAt = Date.now();
    } else if (document.visibilityState === 'visible') {
      const hiddenFor = hiddenAt ? (Date.now() - hiddenAt) : 0;
      if (hiddenFor > FORCE_RECONNECT_HIDDEN_MS) {
        // PINGPONG BUILD: check the socket with a ping before forcing a reconnect --
        // a forced reconnect closes the seat and the other side tears its call down.
        verifyOrReconnect(hiddenFor);
      } else {
        reconnectNow('visibilitychange');
      }
    }
  });
  window.addEventListener('pageshow', (e) => {
    afdiag('PAGE pageshow — persisted=' + e.persisted);
    const hiddenFor = hiddenAt ? (Date.now() - hiddenAt) : 0;
    if (e.persisted || hiddenFor > FORCE_RECONNECT_HIDDEN_MS) {
      reconnectNow('pageshow-forced', true);
    } else {
      reconnectNow('pageshow');
    }
  });
  window.addEventListener('online', () => { afdiag('NETWORK online'); reconnectNow('online'); });
  window.addEventListener('offline', () => { afdiag('NETWORK offline'); });
  window.addEventListener('focus', () => { afdiag('PAGE focus'); reconnectNow('focus'); });
  document.addEventListener('freeze', () => { afdiag('PAGE freeze'); }); // Page Lifecycle API, Chromium-only, log-only
  document.addEventListener('resume', () => { afdiag('PAGE resume'); reconnectNow('resume'); });
  window.addEventListener('pagehide', (e) => { afdiag('PAGE pagehide — persisted=' + e.persisted); });

  // --- Fullscreen + auto-hiding controls -----------------------------------
  // Goal: while in fullscreen, the header and footer fade away after a few
  // seconds so the video fills the whole screen, then reappear the moment
  // the mouse moves, the screen is tapped, or a key is pressed.
  let hideTimer = null;

  function revealChrome() {
    document.body.classList.remove('chrome-hidden');
    clearTimeout(hideTimer);
    if (document.fullscreenElement) {
      hideTimer = setTimeout(() => {
        document.body.classList.add('chrome-hidden');
      }, 3000);
    }
  }

  document.addEventListener('mousemove', revealChrome);
  document.addEventListener('touchstart', revealChrome);
  document.addEventListener('keydown', revealChrome);

  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
      fullscreenBtn.textContent = 'Exit Fullscreen';
      revealChrome();
    } else {
      fullscreenBtn.textContent = 'Fullscreen';
      clearTimeout(hideTimer);
      document.body.classList.remove('chrome-hidden');
    }
  });

  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  // iOS (iPhone/iPad) doesn't reliably support page-level fullscreen — on
  // some iOS versions the API reports itself as "available" but actually
  // calling it on a page like this one freezes the video. Rather than trust
  // that self-reported support, detect iOS directly and hide the button
  // there unconditionally. The real fullscreen equivalent on iOS is opening
  // this page from a Home Screen icon (Share → Add to Home Screen), which
  // hides Safari's own chrome automatically and works reliably.
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS often reports as Mac
  const supportsPageFullscreen = !isIOS && document.fullscreenEnabled &&
    typeof document.documentElement.requestFullscreen === 'function';
  if (!supportsPageFullscreen) {
    fullscreenBtn.style.display = 'none';
  }

  muteBtn.addEventListener('click', () => {
    if (!localStream) return;
    const track = localStream.getAudioTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    muteBtn.textContent = track.enabled ? 'Mute' : 'Unmute';
    muteBtn.classList.toggle('active-off', !track.enabled);
  });

  camBtn.addEventListener('click', () => {
    if (!localStream) return;
    const track = localStream.getVideoTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    camBtn.textContent = track.enabled ? 'Camera on' : 'Camera off';
    camBtn.classList.toggle('active-off', !track.enabled);
  });

  localVideo.addEventListener('click', () => {
    localVideo.classList.toggle('minimized');
  });

  function applyRemoteTransform() {
    remoteVideo.style.transform = `translate(${remotePanX}px, ${remotePanY}px) scale(${remoteZoom})`;
  }

  function clampRemotePan() {
    const maxOffset = (remoteZoom - 1) * 250;
    remotePanX = Math.max(-maxOffset, Math.min(maxOffset, remotePanX));
    remotePanY = Math.max(-maxOffset, Math.min(maxOffset, remotePanY));
  }

  function resetRemoteZoom() {
    remoteZoom = 1;
    remotePanX = 0;
    remotePanY = 0;
    applyRemoteTransform();
  }

  remoteVideo.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.hypot(dx, dy);
      pinchStartZoom = remoteZoom;
      panActive = false;
    } else if (e.touches.length === 1) {
      const t = e.touches[0];
      const now = Date.now();
      const movedSinceLastTap = Math.hypot(t.clientX - lastTapX, t.clientY - lastTapY);

      if (now - lastTapTime < 350 && movedSinceLastTap < 40) {
        // Double tap: toggle between normal and a fixed zoomed-in level.
        remoteZoom = remoteZoom > 1 ? 1 : DOUBLE_TAP_ZOOM;
        remotePanX = 0;
        remotePanY = 0;
        applyRemoteTransform();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
        lastTapX = t.clientX;
        lastTapY = t.clientY;
      }

      if (remoteZoom > 1) {
        panActive = true;
        panStartX = t.clientX;
        panStartY = t.clientY;
        panOriginX = remotePanX;
        panOriginY = remotePanY;
      }
    }
  }, { passive: true });

  remoteVideo.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStartDist > 0) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      remoteZoom = Math.min(MAX_REMOTE_ZOOM, Math.max(1, pinchStartZoom * (dist / pinchStartDist)));
      clampRemotePan();
      applyRemoteTransform();
    } else if (e.touches.length === 1 && panActive && remoteZoom > 1) {
      e.preventDefault();
      const t = e.touches[0];
      remotePanX = panOriginX + (t.clientX - panStartX);
      remotePanY = panOriginY + (t.clientY - panStartY);
      clampRemotePan();
      applyRemoteTransform();
    }
  }, { passive: false });

  remoteVideo.addEventListener('touchend', () => {
    panActive = false;
    pinchStartDist = 0;
    if (remoteZoom < 1.05) resetRemoteZoom();
  }, { passive: true });

  // Also support double-click on desktop for the same zoom toggle.
  remoteVideo.addEventListener('dblclick', () => {
    remoteZoom = remoteZoom > 1 ? 1 : DOUBLE_TAP_ZOOM;
    remotePanX = 0;
    remotePanY = 0;
    applyRemoteTransform();
  });

  window.addEventListener('orientationchange', resetRemoteZoom);

  cameraSelect.addEventListener('change', () => {
    localStorage.setItem(LS_CAMERA, cameraSelect.value);
    if (localStream) startLocalStream();
    sendCameraList(); // CAMERA REMOTE SWITCH MODULE: tell the other side which camera is now active
  });
  micSelect.addEventListener('change', () => {
    localStorage.setItem(LS_MIC, micSelect.value);
    if (localStream) startLocalStream();
  });

  // ===== CAMERA NAMING MODULE: JS START =================================
  // Assigns a persistent custom name (stored in localStorage, keyed by the
  // browser's internal deviceId — stable across reloads as long as the
  // camera stays in the same USB port) to whichever camera is selected.
  // This solves the problem of two identical-model cameras (e.g. two
  // EMEET PIXYs) reporting the exact same generic label, by letting you
  // tell them apart yourself instead of relying on the OS-reported name.
  //
  // Design goal: only touches dropdown *display text* and a localStorage
  // map — never touches which camera is actually selected/streamed, so it
  // can't affect call behavior. To remove: delete this block, the two
  // "CAMERA NAMING MODULE" lines inside listDevices() above, and the
  // matching HTML/CSS blocks.
  const LS_CAMERA_NAMES = 'trainingCall:cameraNames';
  const nameCameraBtn = document.getElementById('nameCameraBtn');
  const cameraNamePanel = document.getElementById('cameraNamePanel');
  const cameraNamePanelLabel = document.getElementById('cameraNamePanelLabel');
  const cameraNameCustomBtn = document.getElementById('cameraNameCustomBtn');
  const cameraNameClearBtn = document.getElementById('cameraNameClearBtn');
  const cameraNameCancelBtn = document.getElementById('cameraNameCancelBtn');
  let rawCameraLabels = {}; // deviceId -> original OS-reported label, refreshed by listDevices()

  function loadCameraNames() {
    try { return JSON.parse(localStorage.getItem(LS_CAMERA_NAMES) || '{}'); }
    catch { return {}; }
  }
  function saveCameraNames(map) {
    localStorage.setItem(LS_CAMERA_NAMES, JSON.stringify(map));
  }
  function relabelCameraOptions() {
    const names = loadCameraNames();
    [...cameraSelect.options].forEach((opt, i) => {
      const raw = rawCameraLabels[opt.value] || opt.textContent;
      // ORDER-KEYED: prefer the position-derived Door/Rack role in forced mode.
      const role = (AF_ROLE_BY_INDEX && AF_ROLE_BY_INDEX[i]) ? AF_ROLE_BY_INDEX[i].role : null;
      const label = role || names[opt.value] || null;
      opt.textContent = label ? `${label} (${raw})` : raw;
    });
  }
  function setCameraName(name) {
    if (!cameraSelect.value) return;
    const names = loadCameraNames();
    if (name) names[cameraSelect.value] = name;
    else delete names[cameraSelect.value];
    saveCameraNames(names);
    relabelCameraOptions();
  }
  nameCameraBtn.addEventListener('click', () => {
    const raw = rawCameraLabels[cameraSelect.value] || 'this camera';
    cameraNamePanelLabel.textContent = `Naming the camera currently selected above (${raw})`;
    cameraNamePanel.hidden = !cameraNamePanel.hidden;
  });
  document.querySelectorAll('.cam-name-preset').forEach((btn) => {
    btn.addEventListener('click', () => {
      setCameraName(btn.dataset.name);
      cameraNamePanel.hidden = true;
    });
  });
  cameraNameCustomBtn.addEventListener('click', () => {
    const name = prompt('Custom name for this camera:', '');
    if (name && name.trim()) setCameraName(name.trim().slice(0, 24));
    cameraNamePanel.hidden = true;
  });
  cameraNameClearBtn.addEventListener('click', () => {
    setCameraName(null);
    cameraNamePanel.hidden = true;
  });
  cameraNameCancelBtn.addEventListener('click', () => {
    cameraNamePanel.hidden = true;
  });
  // ===== CAMERA NAMING MODULE: JS END =====================================

  // ===== CAMERA REMOTE SWITCH MODULE: JS START ============================
  // Lets either side put buttons on screen for the OTHER side's cameras,
  // and switch that side's active camera remotely (e.g. Maria taps a
  // button on her phone, and the gym PC switches which camera it's
  // sending — no need for whoever's on camera to touch the dropdown).
  //
  // How it works: a small WebRTC data channel ("control") rides alongside
  // the existing video/audio connection. Each side sends its own camera
  // list (deviceId + friendly label + which one is currently active)
  // whenever that list changes; each side renders the OTHER side's list
  // as buttons. Tapping a button sends back a "switch to this deviceId"
  // request, which the receiving side applies using the exact same
  // startLocalStream() path the dropdown already uses.
  //
  // Design goal: only touches the control channel and the overlay's own
  // buttons — never reaches into pc's video/audio senders directly, and
  // never changes what happens when using the dropdown locally. To
  // remove: delete this block, the "CAMERA REMOTE SWITCH MODULE" hook
  // lines in createPeerConnection(), teardownPeerConnection(),
  // listDevices(), and the cameraSelect 'change' handler above, plus the
  // matching HTML/CSS blocks.
  const camSwitchOverlay = document.getElementById('camSwitchOverlay');

  function setupControlChannel() {
    const gen = pcGen;   // CONTROL MODULE: which pc this channel belongs to, for the log lines
    controlChannel.onopen = () => {
      try { afdiag('CONTROL channel open pc=' + gen); } catch (e) {}
      sendCameraList(); sharedWidgetsOnOpen();   // STOPWATCH MODULE: shared widgets resync on every open
    };
    controlChannel.onclose = () => {
      try { afdiag('CONTROL channel closed pc=' + gen); } catch (e) {}
      camSwitchOverlay.hidden = true;
      camSwitchOverlay.innerHTML = '';
    };
    controlChannel.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }
      if (msg.type === 'camera-list') {
        renderRemoteCameraButtons(msg.cameras || []);
      } else if (msg.type === 'switch-camera') {
        console.log('[cam-switch] RECEIVED switch-camera deviceId=' + msg.deviceId + ' at ' + new Date().toISOString());
        try { const i = [...cameraSelect.options].findIndex((o) => o.value === msg.deviceId); afdiag('CAMSWITCH received switch-camera deviceId=' + String(msg.deviceId || '').slice(0, 8) + ' -> ' + (i < 0 ? 'not present here (ignored)' : ((AF_ROLE_BY_INDEX && AF_ROLE_BY_INDEX[i] ? AF_ROLE_BY_INDEX[i].role.toLowerCase() : 'unmapped') + ' (index ' + i + ')' + (cameraSelect.value === msg.deviceId ? ', already active' : '')))); } catch (e) { /* LOGSTREAM MODULE: diagnostic only */ }
        const opt = [...cameraSelect.options].find((o) => o.value === msg.deviceId);
        if (!opt) return; // camera no longer present on this side — ignore
        cameraSelect.value = msg.deviceId;
        localStorage.setItem(LS_CAMERA, msg.deviceId);
        if (localStream) startLocalStream().then(sendCameraList);
      } else if (msg.type === 'trainer-log-batch') {
        // TELEMETRY MODULE: gym-side arrival of a batch of trainer log lines.
        // Purely additive leaf -- camera-list/switch-camera above untouched.
        (msg.lines || []).forEach((line) => afdiagIngestRemote(line));
      } else if (msg.type === 'effort-ask') {
        effortAskReceive(msg);   // EFFORT MODULE: trainer side
      } else if (msg.type === 'effort') {
        try { if (window.__POSEREC__ && window.__POSEREC__.remote) window.__POSEREC__.remote(msg); } catch (e) {}   // EFFORT MODULE: gym side, ?poserec=1 only
      } else if (typeof msg.type === 'string' && msg.type in sharedWidgets) {
        // STOPWATCH MODULE: a shared-widget snapshot ({type:'timer', snapshot}).
        sharedWidgets[msg.type].receive(msg.snapshot);
      }
    };
  }

  // ===== CONTROL MODULE: missing control channel watchdog ===============
  // A pc that is connected while its control channel is not open (camera
  // list, stopwatch sync, effort asks, trainer log lines all ride on it) is
  // logged after CONTROL_MISSING_MS and recovered: the caller rebuilds its pc;
  // the callee asks the caller for that with request-offer (reason
  // control-missing). At most one attempt per CONTROL_RETRY_MS on each side.
  // Plus helpers for offer ids and SDP session ids (see SIGNAL above).
  const CONTROL_MISSING_MS = 8000;
  const CONTROL_RETRY_MS = 30000;
  let controlMissingSince = 0;
  let controlLastRecover = 0;

  // The session id from the SDP o= line; the same for every offer from one pc.
  function controlSdpSession(sdp) {
    const m = /^o=\S+ (\d+) /m.exec(String(sdp || ''));
    return m ? m[1] : null;
  }

  function controlOfferId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function controlChannelOpen() {
    return !!(controlChannel && controlChannel.readyState === 'open');
  }

  // Shared by the watchdog and a peer's request; refuses within CONTROL_RETRY_MS.
  function controlRecover(why) {
    const now = Date.now();
    if (now - controlLastRecover < CONTROL_RETRY_MS) {
      afdiag('CONTROL recover skipped (' + why + ') — last attempt ' + Math.round((now - controlLastRecover) / 1000) + 's ago');
      return;
    }
    if (controlChannelOpen()) { afdiag('CONTROL recover skipped (' + why + ') — channel open here'); return; }
    controlLastRecover = now;
    if (amCaller) {
      afdiag('CONTROL recover (' + why + ') — rebuilding the pc');
      joinOfferSent = true;
      joinOfferKind = 'fresh';
      rebuildPeerConnection('control-missing');
    } else {
      afdiag('CONTROL recover (' + why + ') — asking the other side for a fresh offer');
      send({ type: 'request-offer', reason: 'control-missing' });
    }
  }

  function controlWatchTick() {
    try {
      if (!pc || pc.connectionState !== 'connected' || controlChannelOpen()) { controlMissingSince = 0; return; }
      const now = Date.now();
      if (!controlMissingSince) { controlMissingSince = now; return; }
      if (now - controlMissingSince < CONTROL_MISSING_MS) return;
      if (now - controlLastRecover < CONTROL_RETRY_MS) return;
      afdiag('CONTROL channel missing — pc=' + pcGen + ' connected for ' + Math.round((now - controlMissingSince) / 1000) +
        's, channel ' + (controlChannel ? controlChannel.readyState : 'none'));
      controlRecover('watchdog');
    } catch (e) {}
  }
  setInterval(controlWatchTick, 1000);
  // ===== CONTROL MODULE END ==============================================

  function sendCameraList() {
    if (!controlChannel || controlChannel.readyState !== 'open') return;
    const names = loadCameraNames(); // CAMERA NAMING MODULE: custom names, keyed by deviceId
    const cameras = [...cameraSelect.options].map((opt, i) => ({
      deviceId: opt.value,
      // ORDER-KEYED NAMES: in forced mode the remap launcher pins door=index0,
      // rack=index1, so enumeration position gives a stable, correct Door/Rack
      // label with no deviceId dependence. Falls back to a custom name, then the
      // raw OS-reported label (identical "EMEET PIXY" on both, which is why the
      // old label was useless as a discriminator).
      label: (AF_ROLE_BY_INDEX && AF_ROLE_BY_INDEX[i] ? AF_ROLE_BY_INDEX[i].role : null)
        || names[opt.value] || rawCameraLabels[opt.value] || opt.textContent,
      active: opt.value === cameraSelect.value
    }));
    controlChannel.send(JSON.stringify({ type: 'camera-list', cameras }));
  }

  function renderRemoteCameraButtons(cameras) {
    camSwitchOverlay.innerHTML = '';
    if (cameras.length < 2) {
      // Nothing to switch to — one camera or none reported.
      camSwitchOverlay.hidden = true;
      return;
    }
    cameras.forEach((cam) => {
      const btn = document.createElement('button');
      btn.textContent = cam.label;
      if (cam.active) btn.classList.add('cam-switch-active');
      btn.addEventListener('click', () => {
        console.log('[cam-switch] SEND switch-camera deviceId=' + cam.deviceId + ' at ' + new Date().toISOString());
        if (controlChannel && controlChannel.readyState === 'open') {
          controlChannel.send(JSON.stringify({ type: 'switch-camera', deviceId: cam.deviceId }));
        }
      });
      camSwitchOverlay.appendChild(btn);
    });
    camSwitchOverlay.hidden = false;
  }
  // ===== CAMERA REMOTE SWITCH MODULE: JS END ==============================

  // ===== DIAGNOSTICS MODULE START =====================================
  // Adds: (1) a live connection-stats feed + per-session history log,
  // written to localStorage only — never shown on this page; (2) an
  // automatic bitrate cap that backs off when the call is routed through
  // the TURN relay; (3) a manual "Low Bandwidth" toggle.
  //
  // Design goals: never touch the call's own variables or functions
  // (pc, localStream, startLocalStream, createPeerConnection, etc.) —
  // this block only *observes* them — so a bug here can't break calling,
  // and the whole module can be deleted by removing this block plus the
  // matching CSS/HTML blocks marked above, plus deleting public/diagnostics.html.
  // Reports are viewed separately, on /diagnostics.html — nothing here
  // changes what either side sees on the call screen itself.
  const DIAG_LS_LIVE = 'trainingCall:diag:liveStats';
  const DIAG_LS_LOG = 'trainingCall:diag:sessionLog';
  const DIAG_LS_LOWBW = 'trainingCall:diag:lowBandwidth';
  const DIAG_MAX_LOG_ENTRIES = 50;
  const DIAG_POLL_MS = 3000;
  const DIAG_BITRATE_FULL = 2500000;  // ~2.5 Mbps cap, matches the 1080p target
  const DIAG_BITRATE_RELAY = 900000;  // auto cap when routed via TURN relay
  const DIAG_BITRATE_LOW = 350000;    // manual "Low Bandwidth" cap

  const bandwidthBtn = document.getElementById('bandwidthBtn');

  let lowBandwidthMode = localStorage.getItem(DIAG_LS_LOWBW) === '1';
  let diagLastPc = null;
  let diagPollTimer = null;
  let diagSessionStart = null;
  let diagBitrateSamples = [];
  let diagReconnectCount = 0;
  let diagCandidateType = null;
  let diagPrevBytes = { sent: 0, received: 0, audioSent: 0, audioReceived: 0, time: 0 };

  function diagSetButtonLabel() {
    if (!bandwidthBtn) return;
    bandwidthBtn.textContent = 'Low Bandwidth: ' + (lowBandwidthMode ? 'On' : 'Off');
    bandwidthBtn.classList.toggle('active-off', lowBandwidthMode);
  }
  diagSetButtonLabel();

  async function diagApplyBitrateCap(kbpsCap) {
    if (!pc) return;
    try {
      const sender = pc.getSenders().find((s) => s.track && s.track.kind === 'video');
      if (!sender) return;
      const params = sender.getParameters();
      if (!params.encodings || !params.encodings.length) params.encodings = [{}];
      params.encodings[0].maxBitrate = kbpsCap;
      await sender.setParameters(params);
    } catch (e) { /* never let a diagnostics failure affect the call */ }
  }

  async function diagApplyBandwidthMode() {
    if (lowBandwidthMode) {
      await diagApplyBitrateCap(DIAG_BITRATE_LOW);
      const track = localStream && localStream.getVideoTracks()[0];
      if (track) {
        try {
          await track.applyConstraints({ width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 20 } });
        } catch (e) {}
      }
    } else {
      // Hand back to the automatic cap (full quality, or relay-reduced —
      // diagPollStats will reassert the right one on its next tick).
      await diagApplyBitrateCap(DIAG_BITRATE_FULL);
      const track = localStream && localStream.getVideoTracks()[0];
      if (track) {
        try {
          await track.applyConstraints({ width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } });
        } catch (e) {}
      }
    }
  }

  if (bandwidthBtn) {
    bandwidthBtn.addEventListener('click', () => {
      lowBandwidthMode = !lowBandwidthMode;
      localStorage.setItem(DIAG_LS_LOWBW, lowBandwidthMode ? '1' : '0');
      diagSetButtonLabel();
      diagApplyBandwidthMode();
    });
  }

  function diagFinalizeSession() {
    if (!diagSessionStart || diagBitrateSamples.length === 0) {
      diagSessionStart = null;
      diagBitrateSamples = [];
      diagReconnectCount = 0;
      diagCandidateType = null;
      localStorage.removeItem(DIAG_LS_LIVE);
      return;
    }
    const endedAt = Date.now();
    const avgUp = Math.round(diagBitrateSamples.reduce((a, s) => a + s.up, 0) / diagBitrateSamples.length);
    const avgDown = Math.round(diagBitrateSamples.reduce((a, s) => a + s.down, 0) / diagBitrateSamples.length);
    const audioUpSamples = diagBitrateSamples.filter((s) => s.audioUp != null);
    const audioDownSamples = diagBitrateSamples.filter((s) => s.audioDown != null);
    const avgAudioUp = audioUpSamples.length ? Math.round(audioUpSamples.reduce((a, s) => a + s.audioUp, 0) / audioUpSamples.length) : null;
    const avgAudioDown = audioDownSamples.length ? Math.round(audioDownSamples.reduce((a, s) => a + s.audioDown, 0) / audioDownSamples.length) : null;
    // Loss is a cumulative running total, so the last sample already reflects the whole session.
    const lossSamples = diagBitrateSamples.filter((s) => s.audioLossPct != null);
    const finalAudioLossPct = lossSamples.length ? lossSamples[lossSamples.length - 1].audioLossPct : null;
    const entry = {
      startedAt: diagSessionStart,
      endedAt,
      durationSec: Math.round((endedAt - diagSessionStart) / 1000),
      avgBitrateUpKbps: avgUp,
      avgBitrateDownKbps: avgDown,
      avgAudioBitrateUpKbps: avgAudioUp,
      avgAudioBitrateDownKbps: avgAudioDown,
      audioPacketLossPct: finalAudioLossPct,
      reconnectCount: diagReconnectCount,
      candidateType: diagCandidateType,
      bandwidthMode: lowBandwidthMode ? 'low' : 'auto'
    };
    try {
      const log = JSON.parse(localStorage.getItem(DIAG_LS_LOG) || '[]');
      log.push(entry);
      while (log.length > DIAG_MAX_LOG_ENTRIES) log.shift();
      localStorage.setItem(DIAG_LS_LOG, JSON.stringify(log));
    } catch (e) {}
    diagSessionStart = null;
    diagBitrateSamples = [];
    diagReconnectCount = 0;
    diagCandidateType = null;
    localStorage.removeItem(DIAG_LS_LIVE);
  }

  async function diagPollStats(pcRef) {
    if (!pcRef) return;
    try {
      const stats = await pcRef.getStats();
      let bytesSent = null, bytesReceived = null, pairLocalCandId = null;
      let audioBytesSent = null, audioBytesReceived = null, audioPacketsLost = null, audioPacketsReceived = null;
      stats.forEach((report) => {
        if (report.type === 'outbound-rtp' && report.kind === 'video') bytesSent = report.bytesSent;
        if (report.type === 'inbound-rtp' && report.kind === 'video') bytesReceived = report.bytesReceived;
        if (report.type === 'outbound-rtp' && report.kind === 'audio') audioBytesSent = report.bytesSent;
        if (report.type === 'inbound-rtp' && report.kind === 'audio') {
          audioBytesReceived = report.bytesReceived;

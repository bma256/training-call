        afPose = await make('CPU');
        afQ('afPoseState').textContent = 'ready (CPU)';
        afLog('Pose model ready (CPU).', 'af-warn');
      }
      afPoseReady = true;
      if (afTrack && afCaps && afCaps.tilt) afQ('afGo').disabled = false;
      afMaybeAutoStart('pose ready');
    } catch (err) {
      afPoseError = err;
      afQ('afPoseState').textContent = 'FAILED';
      afLog('Pose model failed to load: ' + err.message + ' — the call is unaffected; auto-framing is unavailable.', 'af-err');
    }
  })();

  // ---- motor command queue (ported from v13) -----------------------------
  function afClamp(axis, v) {
    const c = afCaps[axis];
    const requested = Math.round(v);
    let out = Math.max(c.min, Math.min(c.max, requested));
    // AFFIX (fix D): soft down-cap on top of the camera's own hardware limit,
    // logged at the point of decision -- this is why the old post-hoc "clamped
    // at limit" check in afPump could never fire for a normal, working clamp:
    // afClamp already trimmed the value before it was ever sent.
    if (axis === 'tilt') {
      const capUnits = Math.round(AF_TILT_MAX_DOWN * AF_U);
      if (out > capUnits) {
        const hwClamped = out;
        out = capUnits;
        afLog('tilt DOWN-CAPPED at ' + AF_TILT_MAX_DOWN + '° (requested ' + (requested / AF_U).toFixed(0) + '°, hw limit ' + (hwClamped / AF_U).toFixed(0) + '°).', 'af-warn');
        try { afdiag('tilt DOWN-CAPPED at ' + AF_TILT_MAX_DOWN + '° (requested ' + (requested / AF_U).toFixed(1) + '°, hw-clamped ' + (hwClamped / AF_U).toFixed(1) + '°)'); } catch (e) {}
      }
    }
    return out;
  }
  // PINGPONG BUILD (B): no PTZ while the page is hidden. Every pan/tilt command
  // funnels through afQueue/afPump and the open-time zoom checks this too, so
  // one gate covers drive, centre, HOME and zoom. One "paused" line when the
  // first command is skipped, one "resumed" line on return -- no per-command log.
  let afPtzPaused = false;
  function afPtzHiddenSkip() {
    if (!document.hidden) return false;
    if (!afPtzPaused) {
      afPtzPaused = true;
      try { afdiag('PTZ paused (page hidden)'); } catch (e2) {}
    }
    return true;
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && afPtzPaused) {
      afPtzPaused = false;
      try { afdiag('PTZ resumed'); } catch (e2) {}
      afPump(); // nothing queued while hidden, so this is a no-op unless a command raced in
    }
  });
  function afQueue(axis, val) {
    if (afPtzHiddenSkip()) { afWant[axis] = null; return; } // drop, don't buffer: a stale target on resume is worse than none
    if (afWant[axis] !== null) afM.sup[axis]++;
    afWant[axis] = val;
    afPump();
  }
  async function afPump() {
    if (afCmdInFlight || !afTrack) return;
    if (afPtzHiddenSkip()) { afWant = { tilt: null, pan: null }; return; } // (B) a command queued just before hide
    const order = afPumpAlt ? ['pan', 'tilt'] : ['tilt', 'pan'];
    let axis = null;
    for (const a of order) { if (afWant[a] !== null) { axis = a; break; } }
    if (axis === null) return;
    afPumpAlt ^= 1;
    const val = afWant[axis];
    afWant[axis] = null;
    const before = (axis === 'tilt') ? afCurTilt : afCurPan;
    afCmdInFlight = true;
    try {
      await afTrack.applyConstraints({ advanced: [{ [axis]: val }] });
      const s = afTrack.getSettings ? afTrack.getSettings() : {};
      const rep = (typeof s[axis] === 'number') ? s[axis] : val;
      if (Math.abs(rep - val) > AF_U / 2) {
        afM.clamp[axis]++;
        if (afM.clamp[axis] === 1 || afM.clamp[axis] % 20 === 0) {
          afLog(axis + ' clamped at limit (asked ' + (val / AF_U).toFixed(0) + '°, got ' + (rep / AF_U).toFixed(0) + '°).', 'af-warn');
        }
      }
      try {
        afdiag('PTZ ' + axis + ' -> ' + (val / AF_U).toFixed(1) + '° (reported ' + (rep / AF_U).toFixed(1) + '°)' +
          (Math.abs(rep - val) > AF_U / 2 ? ' CLAMPED' : ''));
      } catch (e2) {}
      const moved = Math.abs(rep - before) / AF_U;
      if (axis === 'tilt') { afCurTilt = rep; if (moved > afM.peakT) afM.peakT = moved; }
      else { afCurPan = rep; if (moved > afM.peakP) afM.peakP = moved; }
    } catch (e) {
      afM.errs++;
      afLog('applyConstraints: ' + e.message, 'af-err');
      try { afdiag('PTZ ' + axis + ' -> ' + (val / AF_U).toFixed(1) + '° FAILED: ' + (e && e.message)); } catch (e2) {}
    } finally {
      afCmdInFlight = false;
    }
    afPump();
  }
  function afCenterBoth() {
    if (!afTrack || !afCaps) return;
    if (afCaps.tilt) afQueue('tilt', afClamp('tilt', 0));
    if (afCaps.pan) afQueue('pan', afClamp('pan', 0));
    afSmX = afSmY = null;
  }
  afQ('afCenter').addEventListener('click', () => { afCenterBoth(); afLog('Centred.'); });

  // ---- AFFIX (fix E): resync cached position from the camera's actual -----
  // reported settings before trusting it for a drive computation. Fixes the
  // "external recentre gets silently overridden back" failure -- the old code
  // only ever updated afCurTilt/afCurPan from OUR OWN command replies.
  function afSyncActualPosition() {
    if (!afTrack || !afTrack.getSettings) return;
    try {
      const st = afTrack.getSettings();
      if (typeof st.tilt === 'number') {
        const diff = Math.abs(st.tilt - afCurTilt) / AF_U;
        if (diff > 2) {
          afLog('tilt drifted: cached ' + (afCurTilt / AF_U).toFixed(0) + '°, actual ' + (st.tilt / AF_U).toFixed(0) + '° — resyncing.', 'af-warn');
          try { afdiag('tilt drift ' + diff.toFixed(1) + '° (cached ' + (afCurTilt / AF_U).toFixed(0) + '° -> actual ' + (st.tilt / AF_U).toFixed(0) + '°) — resynced'); } catch (e2) {}
        }
        afCurTilt = st.tilt;
      }
      if (typeof st.pan === 'number') {
        const diff = Math.abs(st.pan - afCurPan) / AF_U;
        if (diff > 2) {
          afLog('pan drifted: cached ' + (afCurPan / AF_U).toFixed(0) + '°, actual ' + (st.pan / AF_U).toFixed(0) + '° — resyncing.', 'af-warn');
          try { afdiag('pan drift ' + diff.toFixed(1) + '° (cached ' + (afCurPan / AF_U).toFixed(0) + '° -> actual ' + (st.pan / AF_U).toFixed(0) + '°) — resynced'); } catch (e2) {}
        }
        afCurPan = st.pan;
      }
    } catch (e) {}
  }

  // ---- AFFIX (fix C): per-camera HOME, replacing 0/0 as the recovery target
  // Door gets a built-in default (30° down / 0° pan); rack gets a built-in
  // default too (32° tilt / -17° pan). Unrecognised/unforced cameras keep
  // today's behaviour (literal 0/0), same as afCenterBoth() above.
  function afHomeStore() {
    try { return JSON.parse(localStorage.getItem(AF_LS_HOME) || '{}'); } catch (e) { return {}; }
  }
  function afPaintHome() {
    try {
      const el = afQ('afHomeVal');
      if (el) el.textContent = afHomeTilt.toFixed(0) + '° / ' + afHomePan.toFixed(0) + '°';
    } catch (e) {}
  }
  function afLoadHome() {
    afHomeTilt = 0; afHomePan = 0; // fallback: today's behaviour until a home is known
    if (afOpenDeviceId) {
      const s = afHomeStore()[afOpenDeviceId];
      if (s && typeof s.tilt === 'number' && typeof s.pan === 'number') {
        afHomeTilt = s.tilt; afHomePan = s.pan;
        afPaintHome();
        return;
      }
    }
    // No saved home for this camera -- a recognised DOOR or RACK gets its
    // built-in non-zero default. Unrecognised/unforced stays 0/0.
    if (AF_FORCE_MODE) {
      const hit = afRoleFor(afOpenDeviceId);
      if (hit && hit.role === 'Door') {
        afHomeTilt = AF_HOME_TILT_DEFAULT;
        afHomePan = AF_HOME_PAN_DEFAULT;
      } else if (hit && hit.role === 'Rack') {
        afHomeTilt = AF_HOME_TILT_RACK_DEFAULT;
        afHomePan = AF_HOME_PAN_RACK_DEFAULT;
      }
    }
    afPaintHome();
  }
  function afSaveHomeCurrent() {
    if (!afOpenDeviceId || !afTrack) { afLog('No camera adopted — cannot set home.', 'af-warn'); return; }
    afSyncActualPosition();
    afHomeTilt = afCurTilt / AF_U;
    afHomePan = afCurPan / AF_U;
    try {
      const s = afHomeStore();
      s[afOpenDeviceId] = { tilt: afHomeTilt, pan: afHomePan };
      localStorage.setItem(AF_LS_HOME, JSON.stringify(s));
    } catch (e) {}
    afPaintHome();
    afLog('Home set to current position: tilt ' + afHomeTilt.toFixed(0) + '°, pan ' + afHomePan.toFixed(0) + '° (' + (afOpenDeviceId || '').slice(0, 8) + ').', 'af-ok');
    try { afdiag('home SET (' + afHomeTilt.toFixed(0) + '°/' + afHomePan.toFixed(0) + '°)'); } catch (e2) {}
  }
  function afResetHome() {
    if (afOpenDeviceId) {
      try {
        const s = afHomeStore();
        delete s[afOpenDeviceId];
        localStorage.setItem(AF_LS_HOME, JSON.stringify(s));
      } catch (e) {}
    }
    afLoadHome(); // re-derive: door/rack default, or 0/0 for unrecognised
    afLog('Home reset for ' + (afOpenDeviceId || '').slice(0, 8) + ': tilt ' + afHomeTilt.toFixed(0) + '°, pan ' + afHomePan.toFixed(0) + '°.', 'af-ok');
    try { afdiag('home RESET (' + afHomeTilt.toFixed(0) + '°/' + afHomePan.toFixed(0) + '°)'); } catch (e2) {}
  }
  function afGoHome() {
    if (!afTrack || !afCaps) return;
    try { afdiag('AFPOS home tT=' + afHomeTilt.toFixed(1) + ' tP=' + afHomePan.toFixed(1) + ' tilt=' + (afCurTilt / AF_U).toFixed(1) + ' pan=' + (afCurPan / AF_U).toFixed(1)); } catch (e2) {}
    if (afCaps.tilt) afQueue('tilt', afClamp('tilt', afHomeTilt * AF_U));
    if (afCaps.pan) afQueue('pan', afClamp('pan', afHomePan * AF_U));
    afSmX = afSmY = null;
  }
  afQ('afSetHome').addEventListener('click', () => { afSaveHomeCurrent(); });
  afQ('afResetHome').addEventListener('click', () => { afResetHome(); });

  afQ('afGo').addEventListener('click', () => {
    if (!afTrack) { afLog('No camera track yet.', 'af-warn'); return; }
    afFraming = !afFraming;
    afQ('afGo').textContent = afFraming ? '⏸ Stop auto-framing' : '▶ Start auto-framing';
    afQ('afGo').className = afFraming ? '' : 'go';
    afToggle.classList.toggle('live', afFraming);
    afToggle.textContent = afFraming ? 'Advanced ●' : 'Advanced';
    afSmX = afSmY = null; afSolidCount = 0; afLocked = false; afLastLockedAt = performance.now(); afHomed = false; afHadLms = false;
    afLog(afFraming ? 'Auto-framing ON.' : 'Auto-framing OFF.', afFraming ? 'af-ok' : 'af-warn');
  });

  // ---- family auto-start (2026-07-31) ------------------------------------
  // afStartFraming: turn framing ON hands-free, mirroring the afGo ON path
  // exactly. Guarded so it is safe by construction — every precondition the
  // manual Start click relies on must already hold, or it returns without
  // doing anything.
  function afStartFraming(reason) {
    if (afFraming) return;                // already running
    if (!afTrack) return;                 // no camera track yet
    if (!afCaps || !afCaps.tilt) return;  // no tilt = trainer's phone — never auto-start
    if (!afPoseReady) return;             // pose model not loaded yet
    if (afInvUnconfirmed) return;         // unrecognised camera stays held (fail-safe)
    afFraming = true;
    afQ('afGo').textContent = '⏸ Stop auto-framing';
    afQ('afGo').className = '';
    afToggle.classList.add('live');
    afToggle.textContent = 'Advanced ●';
    afSmX = afSmY = null; afSolidCount = 0; afLocked = false; afLastLockedAt = performance.now(); afHomed = false; afHadLms = false;
    afLog('Auto-framing ON (auto-started: ' + reason + ').', 'af-ok');
  }

  // afMaybeAutoStart: only auto-start when the per-camera map is active
  // (i.e. ?inv=door). A plain load with no map keeps the original
  // manual-click behaviour completely untouched.
  function afMaybeAutoStart(reason) {
    if (!AF_FORCE_MODE) return;
    afStartFraming(reason);
  }

  // ---- track adoption ----------------------------------------------------
  async function afAdoptTrack(t) {
    // AF DIAGNOSTIC LOGGER: log-only track lifecycle listeners -- detach from
    // the outgoing track, adopt as before, attach to the incoming one. Never
    // changes what auto-framing does with the track; only observes
    // ended/mute/unmute, which is our best signal for a camera that vanishes
    // mid-session without a full device-list change.
    afdiagDetachTrackListeners(afTrack);
    afTrack = t;
    afdiagAttachTrackListeners(afTrack);
    afCaps = null; afOpenDeviceId = null;
    afWant = { tilt: null, pan: null };
    afCmdInFlight = false;
    afSmX = afSmY = null; afSolidCount = 0; afLocked = false; afLastLockedAt = performance.now(); afHomed = false; afHadLms = false;
    if (afFraming) {
      afFraming = false;
      afQ('afGo').textContent = '▶ Start auto-framing';
      afQ('afGo').className = 'go';
      afToggle.classList.remove('live');
      afToggle.textContent = 'Advanced';
      afLog('Camera changed — re-adopting…', 'af-warn');
    }
    afQ('afGo').disabled = true;
    if (!t) { afQ('afDev').textContent = '—'; afQ('afPtz').textContent = '—'; return; }

    const st = t.getSettings ? t.getSettings() : {};
    afOpenDeviceId = st.deviceId || null;
    afCaps = t.getCapabilities ? t.getCapabilities() : {};
    afCurTilt = (typeof st.tilt === 'number') ? st.tilt : 0;
    afCurPan = (typeof st.pan === 'number') ? st.pan : 0;
    afM.sup = { tilt: 0, pan: 0 }; afM.clamp = { tilt: 0, pan: 0 };
    afM.peakT = 0; afM.peakP = 0; afM.detMax = 0; afM.detN = 0; afM.detSum = 0;

    afQ('afDev').textContent = afOpenDeviceId ? afOpenDeviceId.slice(0, 8) : '(no id)';
    const hasT = afCaps && afCaps.tilt && typeof afCaps.tilt.max === 'number';
    const hasP = afCaps && afCaps.pan && typeof afCaps.pan.max === 'number';
    afQ('afPtz').textContent = (hasT ? 'tilt ' : '') + (hasP ? 'pan ' : '') + (afCaps.zoom ? 'zoom' : '') || 'none';

    // PINGPONG BUILD (C): log the hardware PTZ ranges for this camera + its role.
    // Rack is the gym camera; non-forced or out-of-range -> unrecognised.
    try {
      const hit = afRoleFor(afOpenDeviceId);
      const role = hit ? (hit.role === 'Door' ? 'door' : 'gym') : 'unrecognised';
      const rng = (a) => (afCaps && afCaps[a] && typeof afCaps[a].max === 'number')
        ? afCaps[a].min + '..' + afCaps[a].max + (afCaps[a].step ? ' step ' + afCaps[a].step : '')
        : 'none';
      afdiag('CAPS role=' + role + ' (' + (afOpenDeviceId || '').slice(0, 8) + ')' +
        ' pan=' + rng('pan') + ' tilt=' + rng('tilt') + ' zoom=' + rng('zoom'));
    } catch (e2) {}

    // Restore BEFORE the controls become usable — see afRestoreInv().
    afRestoreInv();
    afLoadHome(); // AFFIX (fix C): per-camera home -- door default, rack stays 0/0 until set

    // Widest zoom on open: a wider frame is fewer losses (v14 item 3).
    if (afPtzHiddenSkip()) {
      // (B) adopted while hidden: skip the widest-zoom command for this adoption
    } else if (afCaps.zoom && typeof afCaps.zoom.min === 'number') {
      try {
        await t.applyConstraints({ advanced: [{ zoom: afCaps.zoom.min }] });
        afLog('Zoom set to widest (' + afCaps.zoom.min + ').');
        try { afdiag('PTZ zoom -> widest (' + afCaps.zoom.min + ')'); } catch (e2) {}
      } catch (e) { afLog('Zoom set failed: ' + e.message, 'af-warn'); }
    } else {
      afLog('No zoom capability reported on this unit.', 'af-warn');
    }

    if (hasT) {
      // Hold the Go button for an unrecognised camera (afInvUnconfirmed) so it
      // cannot auto-frame until a human confirms inverts. Recognised cameras and
      // the non-forced path enable normally.
      if (afPoseReady && !afInvUnconfirmed) afQ('afGo').disabled = false;
      if (afInvUnconfirmed) {
        afQ('afGo').disabled = true;
        afLog('Camera ' + (afOpenDeviceId || '').slice(0, 8) + ' adopted but UNRECOGNISED — auto-framing held. Confirm inverts (toggle a checkbox) to enable.', 'af-warn');
        try { afdiag('camera adopted but UNRECOGNISED — auto-framing held'); } catch (e2) {}
      } else {
        afLog('Camera ' + (afOpenDeviceId || '').slice(0, 8) + ' adopted. Tilt/pan available.', 'af-ok');
        try { afdiag('camera adopted, tilt/pan available (' + (afOpenDeviceId || '').slice(0, 8) + ')'); } catch (e2) {}
        afMaybeAutoStart('camera adopted');
      }
    } else {
      afLog('This camera exposes no tilt — pick a PIXY in the camera list.', 'af-err');
      try { afdiag('camera adopted, NO TILT capability (' + (afOpenDeviceId || '').slice(0, 8) + ')'); } catch (e2) {}
    }
  }

  // ---- pose helpers ------------------------------------------------------
  function afAvg(lms, idx, key) {
    let s = 0, n = 0;
    idx.forEach((i) => {
      const p = lms[i];
      if (p && (p.visibility == null || p.visibility > 0.4)) { s += p[key]; n++; }
    });
    return n ? s / n : null;
  }
  const afEma = (prev, val, a) => (prev === null ? val : prev + a * (val - prev));
  // DOORHOME: position telemetry for the AFPOS log lines. Torso height is the
  // vertical shoulder-to-hip distance as a fraction of frame height (null when
  // either pair is not visible). Log-only -- the drive never reads these.
  const afF3 = (v) => (v === null || v === undefined ? 'na' : v.toFixed(3));
  const afS3 = (v) => (v === null || v === undefined ? 'na' : (v >= 0 ? '+' : '') + v.toFixed(3));
  // raw = true (loss line only): average all four torso landmarks regardless of
  // visibility, so a low-visibility loss still logs where the body was.
  function afPosStr(lms, raw) {
    if (!lms) return 'lms=none';
    const avg = raw ? (l, idx, key) => {
      let s = 0, n = 0;
      idx.forEach((i) => { const p = l[i]; if (p) { s += p[key]; n++; } });
      return n ? s / n : null;
    } : afAvg;
    const cX = avg(lms, AF_TORSO, 'x'), cY = avg(lms, AF_TORSO, 'y');
    const sY = avg(lms, [11, 12], 'y'), hY = avg(lms, [23, 24], 'y');
    const th = (sY === null || hY === null) ? null : hY - sY;
    const vs = afVisStats(lms);
    return 'cx=' + afF3(cX) + ' cy=' + afF3(cY) + ' th=' + afF3(th) + ' vmin=' + (vs ? vs.min.toFixed(2) : 'na');
  }
  // DOORHOME: soft-start step scale. 0 = hold (no drive), AF_SOFT_MIN..1 after.
  function afSoftScale(now) {
    if (!afSoftAt) return 1;
    const t = now - afSoftAt;
    let s, ph;
    if (t < AF_SOFT_HOLD_MS) { s = 0; ph = 'hold'; }
    else if (t < AF_SOFT_HOLD_MS + AF_SOFT_SLOW_MS) { s = AF_SOFT_MIN; ph = 'slow'; }
    else if (t < AF_SOFT_HOLD_MS + AF_SOFT_SLOW_MS + AF_SOFT_RAMP_MS) {
      s = AF_SOFT_MIN + (1 - AF_SOFT_MIN) * (t - AF_SOFT_HOLD_MS - AF_SOFT_SLOW_MS) / AF_SOFT_RAMP_MS; ph = 'ramp';
    } else { s = 1; ph = 'full'; afSoftAt = 0; }
    if (ph !== afSoftPhase) {
      afSoftPhase = ph;
      try { afdiag('AFPOS soft phase=' + ph + ' t=' + Math.round(t)); } catch (e2) {}
    }
    return s;
  }
  function afVisStats(lms) {
    let s = 0, n = 0, mn = 1;
    for (const i of AF_TORSO) {
      const p = lms[i];
      if (!p) continue;
      const v = (p.visibility == null) ? 1 : p.visibility;
      s += v; n++; if (v < mn) mn = v;
    }
    return n ? { mean: s / n, min: mn } : null;
  }

  // ---- drive (ported from v13 maybeDrive) --------------------------------
  // AFFIX (fixes A/B/E): rewritten around a debounced "solid lock" instead of
  // trusting any single frame's landmarks. A detection only counts once
  // AF_LOCK_N consecutive frames clear AF_VIS_MIN; NO drive command is
  // computed without a solid lock (fix A). The HOME recovery timer is driven
  // off "time since we last HAD a solid lock," not off raw per-frame
  // presence, so phantom single-frame detections (the flicker that caused
  // the 3-minute stuck-down incident) can no longer reset it (fix B). Going
  // HOME is the one deliberate exception to "no drive without lock" -- it IS
  // the lock-loss response.
  function afMaybeDrive(result) {
    const now = performance.now();
    const lms = result && result.landmarks && result.landmarks[0];
    const afVS = lms ? afVisStats(lms) : null;
    const goodFrame = !!(afVS && afVS.min >= AF_VIS_MIN);

    // Raw landmark-presence edge log -- the flicker signal itself, kept
    // distinct from the debounced lock signal below. This is what let us
    // diagnose the phantom-floor-detection incident from the log in the
    // first place; the lock logic below acts on it, but doesn't replace it.
    try {
      if (lms && !afHadLms) { afHadLms = true; afdiag('landmarks acquired'); }
      else if (!lms && afHadLms) { afHadLms = false; afdiag('landmarks LOST'); }
    } catch (e2) {}

    if (goodFrame) {
      afSolidCount++;
      if (!afLocked && afSolidCount >= AF_LOCK_N) {
        afLocked = true;
        try { afdiag('solid lock ACQUIRED (' + AF_LOCK_N + ' consecutive good frames)'); } catch (e2) {}
        // DOORHOME: the lock after a HOME recovery starts the soft-start clock.
        if (afSoftArmed) { afSoftArmed = false; afSoftAt = now; afSoftPhase = ''; }
        try { afdiag('AFPOS lock ' + afPosStr(lms) + ' tilt=' + (afCurTilt / AF_U).toFixed(1) + ' pan=' + (afCurPan / AF_U).toFixed(1) + ' soft=' + (afSoftAt ? 'on' : 'off')); } catch (e2) {}
      }
    } else {
      afSolidCount = 0;
      if (afLocked) {
        afLocked = false;
        try { afdiag('solid lock LOST (' + (lms ? 'low visibility' : 'no landmarks') + ')'); } catch (e2) {}
        try { afdiag('AFPOS loss ' + afPosStr(lms, true) +' sx=' + afF3(afSmX) + ' sy=' + afF3(afSmY) + ' tilt=' + (afCurTilt / AF_U).toFixed(1) + ' pan=' + (afCurPan / AF_U).toFixed(1)); } catch (e2) {}
      }
    }

    if (afLocked) {
      afSyncActualPosition(); // fix E: never drive from a stale cached position
      afLastLockedAt = now;
      afHomed = false;        // armed again for the next loss
    } else {
      // fix B: unconditional recovery -- no solid lock for the reacquire
      // window sends the camera HOME, whatever the raw flicker looked like.
      // afHomed guards against repeating the command every frame while still
      // unlocked.
      // PINGPONG BUILD (B): checked here, not only in afQueue, so a hidden page
      // does not consume afHomed -- HOME stays armed and fires once visible.
      if (afT.reacq > 0 && !afHomed && now - afLastLockedAt > afT.reacq * 1000 && !afPtzHiddenSkip()) {
        afHomed = true; afM.lost++; afSoftArmed = true; // DOORHOME: the lock at HOME soft-starts
        afLog('No solid lock for ' + afT.reacq + 's — going HOME (loss #' + afM.lost + ').', 'af-warn');
        try { afdiag('HOME recovery triggered (no solid lock for ' + afT.reacq + 's, loss #' + afM.lost + ')'); } catch (e2) {}
        afSyncActualPosition();
        afGoHome();
      }
      return;
    }

    if (now - afLastCmd < afT.rate) return;
    const cX = afAvg(lms, AF_TORSO, 'x'), cY = afAvg(lms, AF_TORSO, 'y');
    if (cX === null || cY === null) return;
    afSmX = afEma(afSmX, cX, afT.smooth);
    afSmY = afEma(afSmY, cY, afT.smooth);
    afLastCmd = now;
    // DOORHOME: during the hold the EMA above keeps settling, but nothing moves.
    const soft = afSoftScale(now);
    if (soft === 0) return;
    let dT = 0, dP = 0;
    const errY = afSmY - afT.torso, errX = afSmX - 0.5;

    if (afCaps.tilt) {
      const mag = Math.abs(errY) - afT.vDead;
      if (mag > 0) {
        let d = -Math.sign(errY) * mag * afT.tGain;
        if (afT.invT) d = -d;
        const stepU = afT.stepT * AF_U * soft;
        d = Math.max(-stepU, Math.min(stepU, d));
        if (Math.abs(d) >= AF_MIN_CMD) { dT = d; afQueue('tilt', afClamp('tilt', afCurTilt + d)); }
      }
    }
    if (afT.panOn && afCaps.pan) {
      const mag = Math.abs(errX) - afT.hDead;
      if (mag > 0) {
        let d = Math.sign(errX) * mag * afT.pGain;
        if (afT.invP) d = -d;
        const stepU = afT.stepP * AF_U * soft;
        d = Math.max(-stepU, Math.min(stepU, d));
        if (Math.abs(d) >= AF_MIN_CMD) { dP = d; afQueue('pan', afClamp('pan', afCurPan + d)); }
      }
    }
    if (dT || dP) {
      try {
        afdiag('AFPOS move ' + afPosStr(lms) + ' sx=' + afF3(afSmX) + ' sy=' + afF3(afSmY) +
          ' errX=' + afS3(errX) + ' errY=' + afS3(errY) +
          ' dT=' + (dT >= 0 ? '+' : '') + (dT / AF_U).toFixed(1) + ' dP=' + (dP >= 0 ? '+' : '') + (dP / AF_U).toFixed(1) +
          ' soft=' + soft.toFixed(2) + ' tilt=' + (afCurTilt / AF_U).toFixed(1) + ' pan=' + (afCurPan / AF_U).toFixed(1));
      } catch (e2) {}
    }
  }

  // ---- render (panel only — hidden panel costs nothing) -------------------
  function afRender(result) {
    if (!afPanelOpen) return;
    const el = localVideo;
    if (!el || !el.videoWidth) return;
    const w = afPrev.width;
    const h = Math.round(w * el.videoHeight / el.videoWidth);
    if (afPrev.height !== h) afPrev.height = h;
    afPrevCtx.drawImage(el, 0, 0, w, h);
    const lms = result && result.landmarks && result.landmarks[0];
    if (!lms) return;
    afPrevCtx.fillStyle = '#7fe0a3';
    AF_TORSO.forEach((i) => {
      const p = lms[i];
      if (!p) return;
      afPrevCtx.beginPath();
      afPrevCtx.arc(p.x * w, p.y * h, 3, 0, 6.2832);
      afPrevCtx.fill();
    });
    if (afSmX !== null && afSmY !== null) {
      const x = afSmX * w, y = afSmY * h;
      afPrevCtx.strokeStyle = '#4aa3ff';
      afPrevCtx.lineWidth = 1.5;
      afPrevCtx.beginPath();
      afPrevCtx.moveTo(x - 9, y); afPrevCtx.lineTo(x + 9, y);
      afPrevCtx.moveTo(x, y - 9); afPrevCtx.lineTo(x, y + 9);
      afPrevCtx.stroke();
    }
    afPrevCtx.strokeStyle = 'rgba(255,255,255,.35)';
    afPrevCtx.lineWidth = 1;
    afPrevCtx.beginPath();
    afPrevCtx.moveTo(0, afT.torso * h); afPrevCtx.lineTo(w, afT.torso * h);
    afPrevCtx.stroke();
  }

  function afPaint() {
    if (!afPanelOpen) return;
    const f = (v, d) => (v == null ? '—' : v.toFixed(d));
    afQ('afFps').textContent = afM.vidFps == null ? '—' : afM.vidFps.toFixed(1) + ' /s';
    afQ('afDet').textContent = afM.detMean == null ? '—'
      : f(afM.detMean, 1) + ' ms (max ' + f(afM.detMax, 0) + ')';
    afQ('afPos').textContent = 'T ' + (afCurTilt / AF_U).toFixed(0) + '° · P ' + (afCurPan / AF_U).toFixed(0) + '°';
    afQ('afSlew').textContent = 'T ' + f(afM.peakT, 0) + ' · P ' + f(afM.peakP, 0);
    afQ('afVis').textContent = (afLocked && afM.vis) ? f(afM.vis.mean, 3) + ' / ' + f(afM.vis.min, 3) : '—';
    afQ('afCounts').textContent = afM.lost + ' / ' + (afM.sup.tilt + afM.sup.pan) + ' / ' + (afM.clamp.tilt + afM.clamp.pan);
    afQ('afLock').textContent = afLocked ? 'LOCKED' : ('unlocked (' + afSolidCount + '/' + AF_LOCK_N + ')');
  }

  // ---- main loop ---------------------------------------------------------
  // Detection reads a DOWNSCALED offscreen canvas, not the 1080p element the
  // bench used at 720p. MediaPipe resizes to 256x256 internally, so this costs
  // nothing in accuracy and removes a 2.25x per-frame texture upload — the
  // single biggest difference between bench conditions and a live 1080p call.
  const afDet = document.createElement('canvas');
  const afDetCtx = afDet.getContext('2d', { willReadFrequently: false });
  const AF_DET_W = 480;

  function afLoop() {
    requestAnimationFrame(afLoop);
    const el = localVideo;
    if (!el) return;

    const s = el.srcObject;
    const t = (s && s.getVideoTracks) ? (s.getVideoTracks()[0] || null) : null;
    if (t !== afTrack) { afAdoptTrack(t); return; }
    if (!afTrack || el.readyState < 2 || !el.videoWidth) return;
    if (el.currentTime === afLastVideoTime) return;
    afLastVideoTime = el.currentTime;

    const now = performance.now();
    afM.fpsWin++;
    if (now - afM.fpsAt >= 1000) {
      afM.vidFps = afM.fpsWin * 1000 / (now - afM.fpsAt);
      afM.fpsWin = 0; afM.fpsAt = now;
      afPaint();
    }

    if (!afPoseReady) return;
    const interval = 1000 / Math.max(1, afT.detHz);
    if (now - afLastDetect < interval) return;
    afLastDetect = now;

    const w = AF_DET_W;
    const h = Math.round(w * el.videoHeight / el.videoWidth);
    if (afDet.width !== w || afDet.height !== h) { afDet.width = w; afDet.height = h; }
    afDetCtx.drawImage(el, 0, 0, w, h);

    let result = null;
    const t0 = performance.now();
    try { result = afPose.detectForVideo(afDet, t0); } catch (e) { afM.errs++; }
    const dt = performance.now() - t0;
    afM.detN++; afM.detSum += dt;
    if (dt > afM.detMax) afM.detMax = dt;
    afM.detMean = afM.detSum / afM.detN;
    if (afM.detN > 200) { afM.detSum = afM.detMean * 50; afM.detN = 50; }

    const lms = result && result.landmarks && result.landmarks[0];
    if (lms) afM.vis = afVisStats(lms);
    afLastResult = result;
    if (window.__KINESIS__) window.__KINESIS__.consume(result);
    if (window.__POSEREC__) window.__POSEREC__.consume(result, t0, dt);

    afRender(result);
    if (afFraming) afMaybeDrive(result);
  }

  // ---- boot --------------------------------------------------------------
  if (afLoadTune()) afLog('Tuning restored.', 'af-ok');
  afReadTune();
  afLog('Auto-frame module loaded (v14 merge).', 'af-ok');
  if (!AF_FORCE_MODE) afLog('Inverts are stored per deviceId PER ORIGIN — nothing carries over from the bench on localhost:8090. Expect to set them once here.', 'af-warn');
  requestAnimationFrame(afLoop);

  // ===== POSEREC HOST: the only parts of this script the POSEREC block
  // (?poserec=1 only) can reach -- afdiag lines, the active camera's role
  // (same index rule as auto-framing), and the note in the voice status text.
  if (params.get('poserec') === '1') {
    window.__POSEREC_HOST__ = Object.freeze({
      log: (msg) => afdiag(String(msg)),
      role: () => { const r = afRoleFor(afOpenDeviceId); return r ? r.role.toLowerCase() : 'unknown'; },
      note: (text) => voiceCmdNote(text),
      // EFFORT MODULE: gym role, the effort-ask message, the pop-out line.
      gym: () => telemIsGym,
      send: (msg) => {
        if (!controlChannel || controlChannel.readyState !== 'open') return false;
        controlChannel.send(JSON.stringify(msg));
        return true;
      },
      effort: (text) => { effortSelfText = String(text || ''); clockViewsUpdate(); },
      person: (text) => { effortPersonText = String(text || ''); clockViewsUpdate(); },
      flash: (text) => effortFlash(text)
    });
  }
  // ===== AUTO-FRAME MODULE: JS END =======================================


  init();
})();
</script>
<script>
/* =======================================================================
   POSEREC — landmark recorder. Test build index-effortfix 2026-11-12.
   -----------------------------------------------------------------------
   - ?poserec=1 to enable; fully dormant otherwise (no globals, no timers,
     no phrases registered).
   - Read-only consumer of the pose stream: afLoop hands every detection to
     window.__POSEREC__.consume(result, t0, dt), beside the KINESIS tap.
     Never touches WebRTC, PTZ or framing.
   - Records frames that have a person, only while a set is open, plus
     POSEREC_PRE_MS before it (ring buffer) and POSEREC_POST_MS after it.
   - Sets are labelled by voice through the __VOICECMD__ registry (not the
     KINESIS engine): "set start", "set start <exercise>", "set stop". A set
     closes itself after POSEREC_AUTO_CLOSE_MS. The open set shows in the
     small voice status text.
   - Transport follows the LOGSTREAM pattern: batched POSTs to a loopback
     receiver (default http://127.0.0.1:4012/pose; ?posesink= for another
     loopback URL), capped queue, backoff, every failure swallowed.
     Landmarks never go through afdiag. afdiag gets one line per set
     start/stop and at most one per sink outage and one per recovery.
   - Reaches the main script only through window.__POSEREC_HOST__ (afdiag,
     camera role, voice status note), which exists only with ?poserec=1.
   - Set naming: an exercise from the list heard as its own final result
     within POSEREC_NAME_MS of a bare "set start" names that open set (its
     stop record, effort-ask and the journal carry the name). Later, or for a
     set that has a name, a lone exercise word does nothing. Uses
     __VOICECMD__.listen(), which sees results but never matches them.
   - EFFORT (gym role only): "effort one".."effort ten" said during a set
     closes that set at once (reason=effort) and rates it; said between sets
     it rates the last closed set. "session effort one".."ten" rates the whole
     session. A split result, "effort" then a lone "one".."ten" as the next
     final result within POSEREC_JOIN_MS, counts as "effort N" (likewise
     "session effort"), through __VOICECMD__.listen(). Every set stop sends {type:'effort-ask', set, n,
     exercise} to the trainer, whose tap comes back as {type:'effort', set,
     value} (see the EFFORT MODULE in the main script). Each rating is one
     effort record plus one afdiag line. The pop-out shows the gym's own last
     rating; the trainer's rating is never shown on the gym, nor the gym's on
     the trainer.
   - PERSON (gym role only): "session start maria" / "session start alex"
     closes any open set (reason=person), sets the current person, writes one
     person record and one afdiag line, and restarts n at 1. Later set and
     effort records carry person (null until a name is said; an effort on a
     set carries that set's person). The person is kept in localStorage for
     the rest of the day (America/Toronto), so a reload keeps it. The pop-out
     shows the name small under the effort line; the trainer sees nothing.
   - FLASH (gym role only, pop-out only): every accepted voice command shows
     large text near the top of the pop-out for 2.5 s: the person's name, "Set 1
     · squats" (again when a lone word names the set), "Set 1 done", "Effort 7"
     / "Session effort 8", "Timer start/stop/reset". Ignored commands, the
     trainer's tap and automatic closes show nothing. The small line under the
     effort line shows the person and open set, "Alex · set 2 squats".
   Record format (one JSON object per line at the receiver):
     {type:'frame', t, seq, set, role, w, h, ms, hidden, lm, wlm}
       lm / wlm: landmarks[0] / worldLandmarks[0] as [[x,y,z,visibility],...]
       rounded to 4 decimals; wlm is null when the model gives none.
     {type:'set', action:'start'|'stop', exercise, t, seq, set, n, person
       [, reason, durMs, frames on stop]}   n: 1, 2, 3... since the page load or the last person
     {type:'effort', sid, t, set, by:'self'|'trainer', scope:'set'|'session',
       value 1-10, person, seq}   set is null for scope 'session'.
     {type:'person', sid, t, person, seq}
     t is epoch ms; seq counts every record of this page load; set is the
     seq of the set's start event (pre-roll frames follow that event).
   ======================================================================= */
(function () {
  'use strict';
  const Q = new URLSearchParams(location.search);
  if (Q.get('poserec') !== '1') return;

  // ----- POSEREC PURE START (test/poserec.test.js extracts this part) -----
  // Spoken exercise names for "set start <exercise>". Edit freely, but use
  // words the Vosk small model knows: it has no "deadlift", so "dead lift".
  const POSEREC_EXERCISES = ['squats', 'pushups', 'lunges', 'rows', 'press', 'curls', 'plank', 'dead lift'];
  const POSEREC_PRE_MS = 5000;
  const POSEREC_POST_MS = 5000;
  const POSEREC_AUTO_CLOSE_MS = 5 * 60 * 1000;
  const POSEREC_NAME_MS = 3000;   // a lone exercise word this soon after a bare "set start" names the set

  function poserecRound(v) {
    return (typeof v === 'number' && isFinite(v)) ? Math.round(v * 1e4) / 1e4 : 0;
  }

  // [[x, y, z, visibility], ...], or null when there are no points.
  function poserecPoints(list) {
    if (!Array.isArray(list) || !list.length) return null;
    return list.map((p) => [poserecRound(p.x), poserecRound(p.y), poserecRound(p.z), poserecRound(p.visibility)]);
  }

  // One frame record, or null when no person was found.
  function poserecFrame(result, meta) {
    const lm = poserecPoints(result && result.landmarks && result.landmarks[0]);
    if (!lm) return null;
    const ms = Number(meta.ms);
    return {
      type: 'frame', t: meta.t, role: meta.role, w: meta.w, h: meta.h,
      ms: isFinite(ms) ? Math.round(ms * 10) / 10 : null, hidden: !!meta.hidden,
      lm, wlm: poserecPoints(result.worldLandmarks && result.worldLandmarks[0])
    };
  }

  // Voice phrases and what each one does: every way to say set start (bare
  // or with an exercise) and set stop, originals first.
  const POSEREC_SET_START = ['set start', 'start set', 'begin set'];
  const POSEREC_SET_STOP = ['set stop', 'stop set', 'end set', 'set done'];

  function poserecPhrases(exercises) {
    const out = [{ phrase: 'set start', action: 'start', exercise: null }, { phrase: 'set stop', action: 'stop', exercise: null }]
      .concat(exercises.map((ex) => ({ phrase: 'set start ' + ex, action: 'start', exercise: ex })));
    POSEREC_SET_START.slice(1).forEach((s) => {
      out.push({ phrase: s, action: 'start', exercise: null });
      exercises.forEach((ex) => out.push({ phrase: s + ' ' + ex, action: 'start', exercise: ex }));
    });
    POSEREC_SET_STOP.slice(1).forEach((s) => out.push({ phrase: s, action: 'stop', exercise: null }));
    return out;
  }

  // Set state, the pre-roll ring buffer and the post-roll window. Times are
  // epoch ms passed in by the caller. emit(record) gets every record to send,
  // in order, with seq and set already filled in.
  function poserecRecorder(emit, opts) {
    const o = Object.assign({ preMs: POSEREC_PRE_MS, postMs: POSEREC_POST_MS, autoCloseMs: POSEREC_AUTO_CLOSE_MS,
      nameMs: POSEREC_NAME_MS }, opts);
    let seq = 0;
    let count = 0;      // sets started in this page load, for n
    let person = null;  // carried by set records; setPerson() restarts n
    let ring = [];      // frames waiting for a set, newest last, at most preMs old
    let open = null;    // { set, n, person, exercise, t, frames }
    let post = null;    // { set, until } after a stop
    const out = (rec) => { rec.seq = ++seq; emit(rec); return rec; };

    function frame(rec) {
      if (!rec) return;
      if (open) { rec.set = open.set; open.frames++; out(rec); return; }
      if (post && rec.t <= post.until) { rec.set = post.set; out(rec); return; }
      post = null;
      ring.push(rec);
      const cutoff = rec.t - o.preMs;
      let i = 0;
      while (i < ring.length && ring[i].t < cutoff) i++;
      if (i) ring = ring.slice(i);
    }

    function start(exercise, now) {
      const ended = open ? stop('restart', now) : null;
      const set = seq + 1;
      const n = ++count;
      const event = out({ type: 'set', action: 'start', exercise: exercise || null, t: now, set, n, person });
      open = { set, n, person, exercise: exercise || null, t: now, frames: 0 };
      post = null;
      const cutoff = now - o.preMs;
      const pre = ring.filter((r) => r.t >= cutoff);
      ring = [];
      pre.forEach((r) => { r.set = set; open.frames++; out(r); });
      return { event, ended, pre: pre.length };
    }

    function stop(reason, now) {
      if (!open) return null;
      const s = open;
      open = null;
      post = { set: s.set, until: now + o.postMs };
      return out({ type: 'set', action: 'stop', exercise: s.exercise, t: now, set: s.set, n: s.n, person: s.person,
        reason, durMs: now - s.t, frames: s.frames });
    }

    function tick(now) {
      return (open && now - open.t >= o.autoCloseMs) ? stop('auto', now) : null;
    }

    function state() {
      return { open: open ? Object.assign({}, open) : null, post: !!post, ring: ring.length, seq, person };
    }

    // The person for sets started from now on; n starts again at 1.
    function setPerson(p) {
      person = p || null;
      count = 0;
    }

    // Any other record (effort): seq filled in, emitted at once.
    function event(rec) {
      return out(rec);
    }

    // Names the open set when it has no name and started within nameMs;
    // returns a copy of the named set, or null when nothing changed.
    function name(exercise, now) {
      if (!open || open.exercise || !exercise || now - open.t > o.nameMs) return null;
      open.exercise = exercise;
      return Object.assign({}, open);
    }

    return { frame, start, stop, tick, state, event, name, setPerson };
  }

  // The exercise when a final result is exactly one list entry, else null.
  function poserecExerciseWord(exercises, text) {
    const said = String(text == null ? '' : text).toLowerCase().trim().split(/\s+/).join(' ');
    return exercises.indexOf(said) >= 0 ? said : null;
  }

  // "effort one".."effort ten" rate a set; "session effort one".."ten" the session.
  const POSEREC_EFFORT_WORDS = ['one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];

  function poserecEffortPhrases() {
    const out = [];
    POSEREC_EFFORT_WORDS.forEach((w, i) => {
      out.push({ phrase: 'effort ' + w, scope: 'set', value: i + 1 });
      out.push({ phrase: 'session effort ' + w, scope: 'session', value: i + 1 });
    });
    return out;
  }

  // Split rating: Vosk sometimes hears "effort seven" as two final results,
  // "effort" then "seven". A final result of exactly "effort" (or "session
  // effort") waits POSEREC_JOIN_MS for the next final result; if that is
  // exactly one number word it gives {phrase, scope, value} as if the whole
  // phrase had been said. Any other final result ends the wait; a number with
  // no wait does nothing. heard() gets every final result (__VOICECMD__.listen).
  const POSEREC_JOIN_MS = 4500;

  function poserecEffortJoiner(windowMs) {
    let wait = null;   // { scope, t }
    return {
      heard(text, now) {
        const said = String(text == null ? '' : text).toLowerCase().trim().split(/\s+/).join(' ');
        if (said === 'effort' || said === 'session effort') {
          wait = { scope: said === 'effort' ? 'set' : 'session', t: now };
          return null;
        }
        const w = wait;
        wait = null;
        const i = POSEREC_EFFORT_WORDS.indexOf(said);
        if (!w || i < 0 || now - w.t > windowMs) return null;
        return { phrase: (w.scope === 'set' ? 'effort ' : 'session effort ') + said, scope: w.scope, value: i + 1 };
      },
      waiting: () => !!wait
    };
  }

  function poserecEffortValue(v) {
    return (Number.isInteger(v) && v >= 1 && v <= 10) ? v : null;
  }

  // Which set a rating belongs to. Said while a set is open, it is held for
  // that set until closed() (the page closes the set at once); otherwise it
  // rates the last closed set. A trainer rating must name a set closed in this load.
  function poserecEffortTracker() {
    let pending = null;     // { set, value }
    let last = null;        // last closed set
    const closed = new Set();
    return {
      // { set, pending } or null when no set has been started yet.
      self(value, openSet) {
        if (openSet != null) { pending = { set: openSet, value }; return { set: openSet, pending: true }; }
        return last != null ? { set: last, pending: false } : null;
      },
      // Called on every set stop; returns the waiting rating for it, or null.
      closed(set) {
        last = set;
        closed.add(set);
        const v = (pending && pending.set === set) ? pending.value : null;
        pending = null;
        return v;
      },
      known(set) { return closed.has(set); },
      state() { return { pending: pending ? Object.assign({}, pending) : null, last }; }
    };
  }

  function poserecEffortRecord(sid, t, set, by, scope, value, person) {
    return { type: 'effort', sid, t, set, by, scope, value, person: person || null };
  }

  // "session start <name>" sets the current person. Names must be words the
  // Vosk small model knows (both are, checked 2026-11-11 in graph/Gr.fst).
  const POSEREC_PEOPLE = ['maria', 'alex'];
  const POSEREC_PERSON_KEY = 'trainingCall:poserecPerson';

  // "session start <name>", then the alias "start session <name>".
  function poserecPersonPhrases(people) {
    return people.map((p) => ({ phrase: 'session start ' + p, person: p }))
      .concat(people.map((p) => ({ phrase: 'start session ' + p, person: p })));
  }

  function poserecPersonRecord(sid, t, person) {
    return { type: 'person', sid, t, person };
  }

  // Pop-out text: "Maria".
  function poserecPersonText(person) {
    return person ? person.charAt(0).toUpperCase() + person.slice(1) : '';
  }

  // The pop-out's small status line: "Alex · set 2 squats", "Alex", "set 1", or ''.
  function poserecStatusText(person, open) {
    const set = open ? 'set ' + open.n + (open.exercise ? ' ' + open.exercise : '') : '';
    return [poserecPersonText(person), set].filter(Boolean).join(' · ');
  }

  // The flash on set start (or naming): "Set 1 · squats", or "Set 1".
  function poserecSetFlash(ev) {
    return 'Set ' + ev.n + (ev.exercise ? ' · ' + ev.exercise : '');
  }

  // The America/Toronto day of epoch ms t, as YYYY-MM-DD.
  function poserecDay(t) {
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit' }).format(t);
  }

  // The saved person when it was saved today and is still a known name, else null.
  function poserecPersonRestore(raw, today, people) {
    try {
      const o = JSON.parse(raw);
      return (o && o.day === today && people.indexOf(o.person) >= 0) ? o.person : null;
    } catch (e) { return null; }
  }

  function poserecPersonSave(person, today) {
    return JSON.stringify({ day: today, person });
  }

  // The pop-out line for the gym's own rating.
  function poserecEffortText(scope, value) {
    return (scope === 'session' ? 'Session effort ' : 'Effort ') + value;
  }

  // Same rule as LOGSINK_URL: only a loopback http(s) URL may override.
  function poserecSinkUrl(param) {
    try {
      const u = new URL(param || '');
      if (/^https?:$/.test(u.protocol) && /^(127\.0\.0\.1|localhost|\[::1\])$/.test(u.hostname)) return u.href;
    } catch (e) {}
    return 'http://127.0.0.1:4012/pose';
  }

  // Oldest-first serialized records within the caps (newestFirst for pagehide,
  // still returned oldest-first). Records are ASCII JSON, so length is bytes.
  function poserecTakeBatch(queue, maxRecords, maxBytes, newestFirst) {
    const out = [];
    let bytes = 64;   // {"sid":"...","records":[]}
    const n = queue.length;
    for (let k = 0; k < n && out.length < maxRecords; k++) {
      const s = queue[newestFirst ? n - 1 - k : k];
      if (out.length && bytes + s.length + 1 > maxBytes) break;
      out.push(s);
      bytes += s.length + 1;
    }
    return newestFirst ? out.reverse() : out;
  }

  function poserecBody(sid, records) {
    return '{"sid":' + JSON.stringify(sid) + ',"records":[' + records.join(',') + ']}';
  }

  function poserecClock(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  // ----- POSEREC PURE END -----------------------------------------------

  const POSEREC_SINK_URL = poserecSinkUrl(Q.get('posesink'));
  const POSEREC_TICK_MS = 2000;           // batch interval
  const POSEREC_MAX_RECORDS = 400;        // per POST
  const POSEREC_MAX_BYTES = 512 * 1024;   // per POST
  const POSEREC_POSTS_PER_TICK = 5;
  const POSEREC_QUEUE_MAX = 9000;         // 10 min at 15 Hz while unreachable -- oldest drop first
  const POSEREC_BACKOFF_MIN_MS = 15000;
  const POSEREC_BACKOFF_MAX_MS = 60000;
  const POSEREC_TIMEOUT_MS = 10000;
  const POSEREC_KEEPALIVE_BYTES = 60000;  // keepalive bodies are capped at 64 KB
  const POSEREC_SID = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);

  const host = window.__POSEREC_HOST__ || null;
  const log = (msg) => { try { if (host) host.log(msg); } catch (e) {} };
  const note = (text) => { try { if (host) host.note(text); } catch (e) {} };

  let queue = [];          // serialized records not yet confirmed by the receiver
  let busy = false;
  let nextAt = 0, backoff = 0;
  let failing = false, failCount = 0;
  let dropped = 0, droppedAtFail = 0;
  let sent = 0, consumed = 0, persons = 0;

  const recorder = poserecRecorder((rec) => {
    queue.push(JSON.stringify(rec));
    if (queue.length > POSEREC_QUEUE_MAX) {
      dropped += queue.length - POSEREC_QUEUE_MAX;
      queue = queue.slice(queue.length - POSEREC_QUEUE_MAX);
    }
  });

  function consume(result, t0, dt) {
    try {
      consumed++;
      const lms = result && result.landmarks && result.landmarks[0];
      if (!lms || !lms.length) return;
      persons++;
      const v = document.getElementById('local');
      recorder.frame(poserecFrame(result, {
        t: Math.round(performance.timeOrigin + t0),
        role: host ? host.role() : 'unknown',
        w: v ? v.videoWidth : 0, h: v ? v.videoHeight : 0,
        ms: dt, hidden: document.hidden
      }));
    } catch (e) { /* the recorder must never affect the pose loop */ }
  }

  const gym = () => { try { return !!(host && host.gym()); } catch (e) { return false; } };
  const effort = poserecEffortTracker();
  const setPersons = new Map();   // closed set id -> its person, for ratings that come later

  // A set rating carries that set's person; a session rating the current one.
  function effortEmit(by, scope, set, value) {
    const person = (set != null && setPersons.has(set)) ? setPersons.get(set) : recorder.state().person;
    recorder.event(poserecEffortRecord(POSEREC_SID, Date.now(), set, by, scope, value, person));
    log('POSEREC effort by=' + by + ' scope=' + scope + ' set=' + (set == null ? '-' : set) + ' value=' + value);
  }

  // After every set stop: the rating said during the set, and the trainer's ask.
  function closed(ev, ask) {
    if (!gym()) return;
    setPersons.set(ev.set, ev.person || null);
    const v = effort.closed(ev.set);
    if (v != null) effortEmit('self', 'set', ev.set, v);
    if (ask) {
      let sent = false, why = 'control channel not open';
      try { sent = !!(host && host.send({ type: 'effort-ask', set: ev.set, n: ev.n, exercise: ev.exercise || null })); } catch (e) { why = 'send failed'; }
      if (!sent) log('POSEREC effort-ask not sent (' + why + ') set=' + ev.set + ' n=' + ev.n);
    }
  }

  function selfEffort(p) {
    try {
      if (p.scope === 'session') {
        effortEmit('self', 'session', null, p.value);
      } else {
        const open = recorder.state().open;
        const r = effort.self(p.value, open ? open.set : null);
        if (!r) { log('POSEREC effort ' + p.value + ' ignored (no set yet)'); return; }
        if (r.pending) {
          // Said during the set: it ends the set now, and closed() records the rating.
          const ev = recorder.stop('effort', Date.now());
          log('POSEREC set stop ' + describe(ev) + ' reason=effort dur=' + (ev.durMs / 1000).toFixed(1) + 's frames=' + ev.frames);
          closed(ev, true);
          showSet();
        } else {
          effortEmit('self', 'set', r.set, p.value);
        }
      }
      if (host) host.effort(poserecEffortText(p.scope, p.value));
      flash(poserecEffortText(p.scope, p.value));
    } catch (e) {}
  }

  // Large confirmation on the pop-out (the host ignores it off the gym role).
  function flash(text) {
    try { if (host && host.flash) host.flash(text); } catch (e) {}
  }

  // The pop-out's status line (person and open set), sent only on a change.
  let statusShown = null;
  function showPerson() {
    try {
      const st = recorder.state();
      const text = poserecStatusText(st.person, st.open);
      if (text === statusShown) return;
      statusShown = text;
      if (host && host.person) host.person(text);
    } catch (e) {}
  }

  // "session start <name>": close any open set, then the new person, n from 1.
  function personStart(p) {
    try {
      const now = Date.now();
      const ev = recorder.stop('person', now);
      if (ev) {
        log('POSEREC set stop ' + describe(ev) + ' reason=person dur=' + (ev.durMs / 1000).toFixed(1) + 's frames=' + ev.frames);
        closed(ev, true);
      }
      recorder.setPerson(p.person);
      recorder.event(poserecPersonRecord(POSEREC_SID, now, p.person));
      try { localStorage.setItem(POSEREC_PERSON_KEY, poserecPersonSave(p.person, poserecDay(now))); } catch (e) {}
      log('POSEREC person ' + p.person + ' (set count restarts at 1)');
      flash(poserecPersonText(p.person));
      showSet();
    } catch (e) {}
  }

  // A person said earlier today survives a reload (no new person record).
  function personRestore() {
    try {
      let raw = null;
      try { raw = localStorage.getItem(POSEREC_PERSON_KEY); } catch (e) {}
      const person = poserecPersonRestore(raw, poserecDay(Date.now()), POSEREC_PEOPLE);
      if (!person) return;
      recorder.setPerson(person);
      log('POSEREC person ' + person + ' (restored from earlier today)');
      showPerson();
    } catch (e) {}
  }

  // {type:'effort', set, value} from the trainer's tap.
  function remote(msg) {
    try {
      if (!gym() || !msg || msg.type !== 'effort') return;
      const v = poserecEffortValue(msg.value);
      if (!v || !Number.isSafeInteger(msg.set) || !effort.known(msg.set)) {
        log('POSEREC effort from trainer ignored (set=' + String(msg.set).slice(0, 12) + ': not a closed set, or a bad value)');
        return;
      }
      effortEmit('trainer', 'set', msg.set, v);
    } catch (e) {}
  }

  // "effort" then a lone number within POSEREC_JOIN_MS: the same as "effort N".
  const joiner = poserecEffortJoiner(POSEREC_JOIN_MS);
  function joinHeard(text) {
    try {
      if (!gym()) return;
      const j = joiner.heard(text, Date.now());
      if (!j) return;
      const p = poserecEffortPhrases().find((x) => x.phrase === j.phrase);
      if (!p) return;
      log('POSEREC effort joined (split) value=' + p.value);
      selfEffort(p);
    } catch (e) {}
  }

  // A lone exercise word right after a bare "set start" (see POSEREC_NAME_MS).
  function heard(text) {
    joinHeard(text);
    try {
      const ex = poserecExerciseWord(POSEREC_EXERCISES, text);
      if (!ex) return;
      const s = recorder.name(ex, Date.now());
      if (!s) return;
      log('POSEREC set named ' + ex + ' set=' + s.set + ' n=' + s.n);
      flash(poserecSetFlash(s));
      showSet();
    } catch (e) {}
  }

  function showSet() {
    const s = recorder.state().open;
    note(s ? 'set ' + (s.exercise || '') + ' ' + poserecClock(Date.now() - s.t) : '');
    showPerson();
  }

  function describe(ev) {
    return (ev.exercise || '(no exercise)') + ' set=' + ev.set + ' n=' + ev.n;
  }

  function label(entry) {
    try {
      const now = Date.now();
      if (entry.action === 'start') {
        const r = recorder.start(entry.exercise, now);
        if (r.ended) log('POSEREC set stop ' + describe(r.ended) + ' reason=restart dur=' + (r.ended.durMs / 1000).toFixed(1) + 's frames=' + r.ended.frames);
        if (r.ended) closed(r.ended, true);
        log('POSEREC set start ' + describe(r.event) + ' pre=' + r.pre);
        flash(poserecSetFlash(r.event));
      } else {
        const ev = recorder.stop('voice', now);
        log(ev ? 'POSEREC set stop ' + describe(ev) + ' reason=voice dur=' + (ev.durMs / 1000).toFixed(1) + 's frames=' + ev.frames
          : 'POSEREC set stop ignored (no open set)');
        if (ev) closed(ev, true);
        if (ev) flash('Set ' + ev.n + ' done');
      }
      showSet();
    } catch (e) {}
  }

  function stateTick() {
    try {
      const ev = recorder.tick(Date.now());
      if (ev) log('POSEREC set stop ' + describe(ev) + ' reason=auto dur=' + (ev.durMs / 1000).toFixed(1) + 's frames=' + ev.frames);
      if (ev) closed(ev, true);
      showSet();
    } catch (e) {}
  }

  function post(records, keepalive) {
    const ctl = (!keepalive && typeof AbortController === 'function') ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => { try { ctl.abort(); } catch (e) {} }, POSEREC_TIMEOUT_MS) : null;
    return fetch(POSEREC_SINK_URL, {
      method: 'POST',
      headers: { 'Content-Type': keepalive ? 'text/plain' : 'application/json' },
      body: poserecBody(POSEREC_SID, records),
      keepalive: !!keepalive,
      credentials: 'omit',
      cache: 'no-store',
      signal: ctl ? ctl.signal : undefined,
    }).then((r) => {
      if (timer) clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
    }, (e) => {
      if (timer) clearTimeout(timer);
      throw e;
    });
  }

  function sinkOk() {
    if (failing) {
      log('POSEREC sink recovered after ' + failCount + ' failed attempt(s); ' + (dropped - droppedAtFail) + ' record(s) dropped while down');
    }
    failing = false; failCount = 0; backoff = 0; nextAt = 0;
  }

  function sinkFail(e) {
    failCount++;
    backoff = backoff ? Math.min(backoff * 2, POSEREC_BACKOFF_MAX_MS) : POSEREC_BACKOFF_MIN_MS;
    nextAt = Date.now() + backoff;
    if (!failing) {
      failing = true;
      droppedAtFail = dropped;
      log('POSEREC sink unreachable (' + String((e && e.message) || e).slice(0, 80) + ') — queue=' + queue.length +
        ', retrying every ' + (POSEREC_BACKOFF_MIN_MS / 1000) + '-' + (POSEREC_BACKOFF_MAX_MS / 1000) + 's');
    }
  }

  async function sinkTick() {
    try {
      if (busy || !queue.length || Date.now() < nextAt) return;
      busy = true;
      try {
        for (let n = 0; n < POSEREC_POSTS_PER_TICK && queue.length; n++) {
          const records = poserecTakeBatch(queue, POSEREC_MAX_RECORDS, POSEREC_MAX_BYTES, false);
          const droppedBefore = dropped;
          await post(records, false);
          // the cap may have trimmed the front of the queue while the POST was in flight
          const done = Math.max(0, records.length - (dropped - droppedBefore));
          queue = queue.slice(done);
          sent += records.length;
          sinkOk();
        }
      } catch (e) {
        sinkFail(e);
      } finally {
        busy = false;
      }
    } catch (e) { /* the recorder must never affect the call */ }
  }

  function pagehide() {
    try {
      const open = recorder.state().open;
      const ev = open ? recorder.stop('pagehide', Date.now()) : null;
      if (ev) closed(ev, false);
      if (!queue.length) return;
      post(poserecTakeBatch(queue, POSEREC_MAX_RECORDS, POSEREC_KEEPALIVE_BYTES, true), true).catch(() => {});
    } catch (e) { /* never affect unload */ }
  }

  function status() {
    return Object.assign({ sink: POSEREC_SINK_URL, sid: POSEREC_SID, consumed, persons, queued: queue.length,
      sent, dropped, failing, failCount, exercises: POSEREC_EXERCISES.slice(), effort: effort.state() }, recorder.state());
  }

  // Phrases another module already owns (e.g. ?voiceword=set) are left alone.
  if (window.__VOICECMD__) {
    const taken = window.__VOICECMD__.status().phrases;
    poserecPhrases(POSEREC_EXERCISES).forEach((p) => {
      if (taken.indexOf(p.phrase) >= 0) { log('POSEREC phrase "' + p.phrase + '" already registered, skipped'); return; }
      window.__VOICECMD__.register({ phrase: p.phrase, action: () => label(p) });
    });
    if (window.__VOICECMD__.listen) window.__VOICECMD__.listen(heard);
    if (gym()) {
      poserecEffortPhrases().forEach((p) => {
        if (taken.indexOf(p.phrase) >= 0) { log('POSEREC phrase "' + p.phrase + '" already registered, skipped'); return; }
        window.__VOICECMD__.register({ phrase: p.phrase, action: () => selfEffort(p) });
      });
      poserecPersonPhrases(POSEREC_PEOPLE).forEach((p) => {
        if (taken.indexOf(p.phrase) >= 0) { log('POSEREC phrase "' + p.phrase + '" already registered, skipped'); return; }
        window.__VOICECMD__.register({ phrase: p.phrase, action: () => personStart(p) });
      });
    }
  }
  if (gym()) personRestore();

  window.__POSEREC__ = Object.freeze({ consume, status, remote });
  try {
    setInterval(stateTick, 1000);
    setInterval(sinkTick, POSEREC_TICK_MS);
    window.addEventListener('pagehide', pagehide);
  } catch (e) {}
  log('POSEREC on: sink=' + POSEREC_SINK_URL + ' sid=' + POSEREC_SID + ' exercises=' + POSEREC_EXERCISES.join(',') + ' effort=' + (gym() ? 'on' : 'off'));
})();
</script>
<script>
/* =======================================================================
   KINESIS V4 — dormant, flag-gated, READ-ONLY consumer of the pose stream
   Build 2026-08-22b. Voice arming via VOSK (offline WASM speech), SELF-HOSTED.
   -----------------------------------------------------------------------
   - ?kinesis=1 to enable; fully dormant otherwise.
   - Read-only: reads landmarks via window.__KINESIS__.consume(result),
     writes ONLY to its own panel + arm/disarm. Never touches WebRTC/PTZ/framing.
   - Foundation = skeleton adapter (knSkeleton): named joints only.
   - V2 core unchanged: counting runs only while ARMED; auto-range self-cal.
   - VOICE (changed in V4): the browser's on-device recognizer was ruled out on
     this box (mic chain works, zero transcripts). V4 uses VOSK — offline WASM
     speech, small English model, no account, no Google backend. Phrases:
     "start set" -> arm, "stop set" -> disarm, reusing the SAME phraseHit()/fire()
     path proven in V2/V3. Fuzzy match + re-fire guard. Voice defaults OFF (it
     shares the mic; fine solo, a separate question on a live call). Manual
     button is the permanent fallback.
   - ROUTE B (this build): Vosk lib + model SELF-HOSTED from vendor/vosk/ — no CDN
     dependency for a load-bearing feature. Proven local on 2026-08-22. Override
     still available via ?voskLib= / ?voskModel= for testing.
   - Instrument: the panel shows the RAW transcript + any error (V3's panel only
     showed matches, which hid misses — a null result was undiagnosable).
   - Safety net: a set auto-disarms after 90 s with no counted rep, so a missed
     "stop set" can't leave a set running forever.
   - Calibration override still available: ?down=NN&up=MM
   ======================================================================= */
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  if (Q.get('kinesis') !== '1') return;

  // ---------- SKELETON ADAPTER (only code that knows raw MP indices) ------
  var MP = {
    nose:0,
    shoulderL:11, shoulderR:12, elbowL:13, elbowR:14, wristL:15, wristR:16,
    hipL:23, hipR:24, kneeL:25, kneeR:26, ankleL:27, ankleR:28
  };
  function J(lms,i){ var p=lms[i]; if(!p) return null;
    return {x:p.x,y:p.y,z:(p.z==null?0:p.z),v:(p.visibility==null?0:p.visibility)}; }
  function mid(a,b){ if(!a||!b) return null;
    return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,z:(a.z+b.z)/2,v:Math.min(a.v,b.v)}; }
  function knSkeleton(lms){
    if(!lms) return null;
    var s={ nose:J(lms,MP.nose),
      shoulderL:J(lms,MP.shoulderL),shoulderR:J(lms,MP.shoulderR),
      elbowL:J(lms,MP.elbowL),elbowR:J(lms,MP.elbowR),
      wristL:J(lms,MP.wristL),wristR:J(lms,MP.wristR),
      hipL:J(lms,MP.hipL),hipR:J(lms,MP.hipR),
      kneeL:J(lms,MP.kneeL),kneeR:J(lms,MP.kneeR),
      ankleL:J(lms,MP.ankleL),ankleR:J(lms,MP.ankleR),
      source:'mediapipe-blazepose-33' };
    s.shoulderMid=mid(s.shoulderL,s.shoulderR);
    s.hipMid=mid(s.hipL,s.hipR);
    return s;
  }

  // ---------- geometry on NAMED joints -----------------------------------
  function visOK(js,thr){ for(var i=0;i<js.length;i++){ if(!js[i]||js[i].v<thr) return false; } return true; }
  function angleDeg(a,b,c){
    if(!a||!b||!c) return null;
    var abx=a.x-b.x,aby=a.y-b.y,cbx=c.x-b.x,cby=c.y-b.y;
    var m1=Math.hypot(abx,aby),m2=Math.hypot(cbx,cby);
    if(m1===0||m2===0) return null;
    var cos=Math.max(-1,Math.min(1,(abx*cbx+aby*cby)/(m1*m2)));
    return Math.acos(cos)*180/Math.PI;
  }

  // ---------- exercise profiles ------------------------------------------
  var PROFILES = {
    pushup:{
      label:'Push-up',
      signal:function(sk){
        var a=[];
        if(visOK([sk.shoulderL,sk.elbowL,sk.wristL],0.5)) a.push(angleDeg(sk.shoulderL,sk.elbowL,sk.wristL));
        if(visOK([sk.shoulderR,sk.elbowR,sk.wristR],0.5)) a.push(angleDeg(sk.shoulderR,sk.elbowR,sk.wristR));
        if(!a.length) return null;
        var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s/a.length;
      },
      down:100, up:150, minRepMs:600
    }
  };
  var active='pushup';

  var ovrDown=parseFloat(Q.get('down')), ovrUp=parseFloat(Q.get('up'));
  function thrDown(){ return isNaN(ovrDown)?PROFILES[active].down:ovrDown; }
  function thrUp(){   return isNaN(ovrUp)?PROFILES[active].up:ovrUp; }

  var NO_REP_TIMEOUT_MS = 90000; // auto-disarm after 90s with no counted rep

  // ---------- state: session + current set + rep machine -----------------
  var lastSkeleton=null;
  var armed=false;
  var rep={ state:'up', sig:null, lastRepAt:0 };
  var set={ reps:0, min:Infinity, max:-Infinity, start:0, lastRepWall:0 };
  var session={ reps:0, sets:0 };
  var lastSet=null;
  var autoStopTimer=null;

  function scheduleAutoStop(){
    if(autoStopTimer) clearTimeout(autoStopTimer);
    autoStopTimer=setTimeout(function(){
      if(armed){ note('auto-stop (90s no rep)'); disarmSet(); }
    }, NO_REP_TIMEOUT_MS);
  }
  function clearAutoStop(){ if(autoStopTimer){ clearTimeout(autoStopTimer); autoStopTimer=null; } }

  function armSet(){
    if(armed) return;
    armed=true;
    set={ reps:0, min:Infinity, max:-Infinity, start:performance.now(), lastRepWall:Date.now() };
    rep.state='up'; rep.lastRepAt=0;
    scheduleAutoStop();
    render();
  }
  function disarmSet(){
    if(!armed) return;
    armed=false; clearAutoStop();
    session.sets++;
    var range=(set.max>set.min)?(set.max-set.min):0;
    var sugD=null,sugU=null;
    if(range>=25){ sugD=Math.round(set.min+0.25*range); sugU=Math.round(set.max-0.25*range); }
    lastSet={ reps:set.reps,
      min:(set.min===Infinity?null:set.min), max:(set.max===-Infinity?null:set.max),
      dur:(performance.now()-set.start)/1000, sugD:sugD, sugU:sugU, smallRange:(range<25) };
    render();
  }
  function toggleSet(){ armed?disarmSet():armSet(); }
  function resetAll(){
    armed=false; clearAutoStop();
    rep={state:'up',sig:null,lastRepAt:0};
    set={reps:0,min:Infinity,max:-Infinity,start:0,lastRepWall:0};
    session={reps:0,sets:0}; lastSet=null; render();
  }

  function feed(result){
    var lms=result&&result.landmarks&&result.landmarks[0];
    var sk=knSkeleton(lms); lastSkeleton=sk;
    if(!sk){ rep.sig=null; render(); return; }
    var sig=PROFILES[active].signal(sk);
    rep.sig=sig;
    if(armed && sig!=null){
      if(sig<set.min) set.min=sig;
      if(sig>set.max) set.max=sig;
      var now=performance.now();
      if(rep.state==='up' && sig<=thrDown()){
        rep.state='down';
      } else if(rep.state==='down' && sig>=thrUp()){
        if(now-rep.lastRepAt>=PROFILES[active].minRepMs){
          set.reps++; session.reps++; rep.lastRepAt=now; set.lastRepWall=Date.now();
          scheduleAutoStop(); // reset the no-rep timer on every counted rep
        }
        rep.state='up';
      }
    }
    render();
  }

  // ---------- VOICE (on-device, offline) ---------------------------------
  var voice={ on:false, supported:false, status:'off', lastHeard:'', raw:'',
              model:null, recognizer:null, audioCtx:null, micStream:null,
              srcNode:null, procNode:null, loading:false };
  function note(msg){ voice.lastHeard=msg; render(); }

  function phraseHit(text){
    var t=(' '+text.toLowerCase()+' ').replace(/[^a-z ]/g,' ');
    var hasSet = t.indexOf(' set ')>=0 || t.indexOf(' sets ')>=0;
    var hasStart = t.indexOf(' start ')>=0 || t.indexOf(' begin ')>=0;
    var hasStop  = t.indexOf(' stop ')>=0 || t.indexOf(' done ')>=0 || t.indexOf(' end ')>=0;
    if(hasStart && hasStop) return null;      // ambiguous, ignore
    if(hasStart && hasSet) return 'start';
    if(hasStop && hasSet)  return 'stop';
    return null;
  }

  var lastFire=0;
  function fire(kind){
    var now=Date.now();
    if(now-lastFire < 1200) return;           // re-fire guard
    if(kind==='start' && !armed){ lastFire=now; note('heard: start set'); armSet(); }
    else if(kind==='stop' && armed){ lastFire=now; note('heard: stop set'); disarmSet(); }
  }

  // ---- VOSK engine (route A: lib+model from jsDelivr CDN) --------------
  // Overridable for testing via ?voskLib= and ?voskModel= .
  var VOSK_LIB_URL   = Q.get('voskLib')   || 'vendor/vosk/vosk.js';
  var VOSK_MODEL_URL = Q.get('voskModel') || 'vendor/vosk/vosk-model-small-en-us-0.15.tar.gz';
  var VOSK_SAMPLE_RATE = 16000;             // Vosk small-en model is 16k

  function loadScript(url){
    return new Promise(function(resolve,reject){
      var sc=document.createElement('script');
      sc.src=url; sc.async=true;
      sc.onload=function(){ resolve(); };
      sc.onerror=function(){ reject(new Error('script load failed: '+url)); };
      document.head.appendChild(sc);
    });
  }

  function voiceStart(){
    if(voice.on || voice.loading) return;
    voice.loading=true; voice.status='loading lib…'; voice.raw=''; render();

    var libP = (window.Vosk) ? Promise.resolve() : loadScript(VOSK_LIB_URL);
    libP.then(function(){
      if(!window.Vosk){ throw new Error('Vosk global missing after lib load'); }
      voice.status='loading model (~40MB)…'; render();
      return window.Vosk.createModel(VOSK_MODEL_URL);
    }).then(function(model){
      voice.model=model;
      voice.status='opening mic…'; render();
      // Small grammar constrains the decoder to our phrases (+[unk] catch-all).
      var rec=new model.KaldiRecognizer(VOSK_SAMPLE_RATE,
        JSON.stringify(['start set','stop set','begin set','end set','done set','[unk]']));
      rec.setWords(true);
      rec.on('result', function(msg){
        var txt=(msg && msg.result && msg.result.text) || '';
        voice.raw=txt||'(empty final)';
        var hit=phraseHit(txt);
        if(hit) fire(hit);
        render();
      });
      rec.on('partialresult', function(msg){
        var txt=(msg && msg.result && msg.result.partial) || '';
        if(txt) voice.raw='… '+txt;
        render();
      });
      voice.recognizer=rec;
      return navigator.mediaDevices.getUserMedia({audio:true, video:false});
    }).then(function(stream){
      voice.micStream=stream;
      var AC=window.AudioContext||window.webkitAudioContext;
      voice.audioCtx=new AC();
      voice.srcNode=voice.audioCtx.createMediaStreamSource(stream);
      // ScriptProcessor is deprecated but universally present; fine for a mic tap.
      var bufSize=4096;
      voice.procNode=voice.audioCtx.createScriptProcessor(bufSize,1,1);
      voice.procNode.onaudioprocess=function(ev){
        if(!voice.on || !voice.recognizer) return;
        try{ voice.recognizer.acceptWaveform(ev.inputBuffer); }catch(e){}
      };
      voice.srcNode.connect(voice.procNode);
      voice.procNode.connect(voice.audioCtx.destination); // needed for onaudioprocess to fire
      voice.on=true; voice.loading=false; voice.status='listening (vosk)'; render();
    }).catch(function(e){
      voice.loading=false; voice.on=false;
      voice.status='err: '+(e && (e.message||e.name) || '?'); render();
    });
  }

  function voiceStop(){
    voice.on=false; voice.loading=false;
    try{ if(voice.procNode){ voice.procNode.disconnect(); voice.procNode.onaudioprocess=null; } }catch(e){}
    try{ if(voice.srcNode) voice.srcNode.disconnect(); }catch(e){}
    try{ if(voice.audioCtx) voice.audioCtx.close(); }catch(e){}
    try{ if(voice.micStream) voice.micStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    try{ if(voice.recognizer && voice.recognizer.remove) voice.recognizer.remove(); }catch(e){}
    voice.procNode=null; voice.srcNode=null; voice.audioCtx=null;
    voice.micStream=null; voice.recognizer=null;
    voice.status='off'; render();
  }
  function voiceToggle(){ voice.on||voice.loading?voiceStop():voiceStart(); }

  // ---------- panel ------------------------------------------------------
  var el={};
  function fmt(x,d){ return (x==null)?'—':(+x).toFixed(d==null?2:d); }
  function vpair(a,b){ return fmt(a?a.v:null,2)+' / '+fmt(b?b.v:null,2); }

  function buildPanel(){
    var st=document.createElement('style');
    st.textContent=
      '#knPanel{position:fixed;left:10px;top:10px;z-index:99998;background:#171b22;color:#cfd8e3;'
      +'font:12px/1.4 system-ui,-apple-system,sans-serif;border:1px solid #2b313c;border-radius:10px;'
      +'padding:10px 12px;min-width:234px;box-shadow:0 6px 20px rgba(0,0,0,.35)}'
      +'#knPanel h4{margin:0 0 6px;font-size:11px;color:#9fb0c4;letter-spacing:.05em;text-transform:uppercase;'
      +'display:flex;justify-content:space-between;align-items:center}'
      +'#knBadge{font-weight:700;padding:1px 7px;border-radius:10px;font-size:10px;letter-spacing:.06em}'
      +'#knBadge.idle{background:#33210f;color:#e8c46a}#knBadge.armed{background:#123322;color:#7fe0a3}'
      +'#knPanel .kr{display:flex;justify-content:space-between;gap:12px;margin:2px 0}'
      +'#knPanel .kr span:last-child{color:#e6edf5;font-variant-numeric:tabular-nums}'
      +'#knPanel .knreps{font-size:26px;font-weight:700;color:#7fe0a3;line-height:1;margin:5px 0}'
      +'#knPanel hr{border:0;border-top:1px solid #2b313c;margin:7px 0}'
      +'#knPanel .knsub{color:#7f8b99;font-size:11px}'
      +'#knPanel button{margin-top:6px;width:100%;background:#232a34;color:#cfd8e3;border:1px solid #333c48;'
      +'border-radius:6px;padding:6px;cursor:pointer;font:12px system-ui}'
      +'#knPanel button:hover{background:#2b333f}'
      +'#knArm.armed{background:#123322;border-color:#1f6f45;color:#9be9bf}'
      +'#knArm.idle{background:#2a3340;border-color:#3a556e;color:#bfe0ff}'
      +'#knVoice.on{background:#10233a;border-color:#2f5c86;color:#bfe0ff}';
    document.head.appendChild(st);

    var d=document.createElement('div'); d.id='knPanel';
    d.innerHTML=
      '<h4><span>KINESIS V5 &middot; read-only</span><span id="knBadge" class="idle">IDLE</span></h4>'
      +'<div class="kr"><span>Exercise</span><span id="knEx">&mdash;</span></div>'
      +'<div class="knreps"><span id="knReps">0</span> <span id="knRepsLbl" class="knsub">reps</span></div>'
      +'<div class="kr knsub"><span>session total</span><span id="knTot">0 reps / 0 sets</span></div>'
      +'<div class="kr"><span>Phase</span><span id="knState">&mdash;</span></div>'
      +'<div class="kr"><span>Signal</span><span id="knSig">&mdash;</span></div>'
      +'<div class="kr knsub"><span>down / up</span><span id="knThr">&mdash;</span></div>'
      +'<button id="knArm" class="idle">Arm set</button>'
      +'<button id="knVoice">Voice: off</button>'
      +'<div class="kr knsub" style="margin-top:5px"><span>voice</span><span id="knVstat">off</span></div>'
      +'<div class="kr knsub"><span>heard</span><span id="knHeard">&mdash;</span></div>'
      +'<div class="kr knsub"><span>raw</span><span id="knRaw">&mdash;</span></div>'
      +'<div id="knLast" class="knsub" style="margin-top:6px"></div>'
      +'<hr>'
      +'<div class="kr knsub"><span>adapter</span><span id="knSrc">&mdash;</span></div>'
      +'<div class="kr knsub"><span>vis el L/R</span><span id="knVel">&mdash;</span></div>'
      +'<div class="kr knsub"><span>vis wr L/R</span><span id="knVwr">&mdash;</span></div>'
      +'<button id="knReset">Reset all</button>';
    document.body.appendChild(d);
    document.getElementById('knArm').addEventListener('click',toggleSet);
    document.getElementById('knVoice').addEventListener('click',voiceToggle);
    document.getElementById('knReset').addEventListener('click',resetAll);

    el.badge=document.getElementById('knBadge');
    el.ex=document.getElementById('knEx');
    el.reps=document.getElementById('knReps');
    el.repsLbl=document.getElementById('knRepsLbl');
    el.tot=document.getElementById('knTot');
    el.state=document.getElementById('knState');
    el.sig=document.getElementById('knSig');
    el.thr=document.getElementById('knThr');
    el.arm=document.getElementById('knArm');
    el.voiceBtn=document.getElementById('knVoice');
    el.vstat=document.getElementById('knVstat');
    el.heard=document.getElementById('knHeard');
    el.raw=document.getElementById('knRaw');
    el.last=document.getElementById('knLast');
    el.src=document.getElementById('knSrc');
    el.vel=document.getElementById('knVel');
    el.vwr=document.getElementById('knVwr');
    render();
  }

  function render(){
    if(!el.reps) return;
    var sk=lastSkeleton;
    el.ex.textContent=PROFILES[active].label;
    el.badge.textContent=armed?'ARMED':'IDLE';
    el.badge.className=armed?'armed':'idle';
    el.arm.textContent=armed?'Stop set':'Arm set';
    el.arm.className=armed?'armed':'idle';
    el.reps.textContent=armed?set.reps:(lastSet?lastSet.reps:0);
    el.repsLbl.textContent=armed?'reps (this set)':'reps (last set)';
    el.tot.textContent=session.reps+' reps / '+session.sets+' sets';
    el.state.textContent=rep.state.toUpperCase();
    el.sig.textContent=(rep.sig==null)?'—':fmt(rep.sig,1)+'°';
    var ovr=(!isNaN(ovrDown)||!isNaN(ovrUp))?' (url)':'';
    el.thr.textContent=Math.round(thrDown())+'° / '+Math.round(thrUp())+'°'+ovr;

    el.voiceBtn.textContent='Voice: '+(voice.on?'on':'off');
    el.voiceBtn.className=voice.on?'on':'';
    el.vstat.textContent=voice.status;
    el.heard.textContent=voice.lastHeard||'—';
    if(el.raw) el.raw.textContent=voice.raw||'—';

    if(!armed && lastSet){
      var r=lastSet, txt='last set: '+r.reps+' reps · '
        +(r.min==null?'—':fmt(r.min,0)+'°–'+fmt(r.max,0)+'°')+' · '+fmt(r.dur,0)+'s';
      if(r.smallRange) txt+=' · range small — do fuller reps';
      else if(r.sugD!=null) txt+=' · suggest down/up '+r.sugD+'°/'+r.sugU+'°';
      el.last.textContent=txt;
    } else { el.last.textContent=''; }

    el.src.textContent=sk?sk.source:'—';
    el.vel.textContent=sk?vpair(sk.elbowL,sk.elbowR):'—';
    el.vwr.textContent=sk?vpair(sk.wristL,sk.wristR):'—';
  }

  // ---------- register tap + hooks ---------------------------------------
  window.__KINESIS__={ consume:feed, arm:armSet, disarm:disarmSet, toggle:toggleSet,
                       voice:voiceToggle, reset:resetAll, version:'v5-2026-08-22b' };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',buildPanel);
  else buildPanel();
})();
</script>
</body>
</html>
